<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - AZS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #111; border-left: 1px solid #222; border-top: 1px solid #222; }
        ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #e6d100; }
        
        /* HEADER I MENU */
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; box-shadow: 0 2px 10px rgba(255, 232, 0, 0.2); }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; transition: 0.2s; }
        .menu-btn:hover { transform: scale(1.1); }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.8); }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        /* PASEK NAWIGACJI (MIESIĄCE, TYGODNIE, DRUK) */
        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 800; width: 100%; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        
        .controls-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        select { background: #000; color: #fff; border: 1px solid #ffe800; padding: 8px 12px; font-weight: 900; border-radius: 8px; outline: none; cursor: pointer; font-size: 0.8rem; }
        select:focus { box-shadow: 0 0 10px rgba(255, 232, 0, 0.3); }

        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 15px; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; text-transform: uppercase; }
        .btn-gen:hover { transform: scale(1.05); box-shadow: 0 0 10px rgba(255, 232, 0, 0.5); }
        
        .btn-print { background: #3498db; color: #fff; border: none; padding: 8px 15px; font-weight: 900; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; text-transform: uppercase; }
        .btn-print:hover { background: #2980b9; transform: scale(1.05); box-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }

        /* KONTENER TABELI */
        .table-container { flex: 1; overflow: auto; background: #080808; width: 100%; display: block; padding: 10px; }
        
        .azs-title { text-align: center; color: #ffe800; font-weight: 900; font-size: 1.5rem; margin-top: 10px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .azs-dates { text-align: center; color: #888; font-weight: 700; font-size: 1rem; margin-bottom: 20px; }

        table { border-collapse: collapse; width: 100%; min-width: 1400px; background: #111; border: 2px solid #333; }
        thead th { background: #1a1a1a; position: sticky; top: 0; padding: 12px 5px; border: 1px solid #333; font-size: 0.65rem; color: #ffe800; text-transform: uppercase; }
        
        .th-task { width: 350px; text-align: left; padding-left: 15px !important; }
        .th-day { width: 80px; text-align: center; }
        .th-sign { width: 60px; text-align: center; background: #0a0a0a; color: #888; }
        
        .header-main-row th { border-bottom: 3px solid #ffe800; }
        
        tbody tr { border-bottom: 1px solid #222; transition: 0.2s; }
        tbody tr:hover { background-color: #151515; }
        
        td { border: 1px solid #222; padding: 6px 5px; font-size: 0.75rem; font-weight: 700; color: #fff; text-align: center; }
        .td-task { text-align: left; padding-left: 15px; font-size: 0.65rem; color: #ccc; font-weight: 600; line-height: 1.2; }
        .td-name { color: #ffe800; font-weight: 900; text-transform: uppercase; }
        .td-empty { color: #333; background: #0a0a0a; }
        .td-sign { background: #151515; } 
        .td-sign-empty { background: #0a0a0a; } /* Zablokowane miejsce na podpis */

        /* =========================================
           MAGIA CSS DO DRUKOWANIA (A4 POZIOM)
           ========================================= */
        @media print {
            @page { size: landscape; margin: 8mm; }
            body { background: white; color: black; height: auto; overflow: visible; font-family: Arial, sans-serif; }
            header, .sidebar, .overlay, .navigation-area, .menu-btn { display: none !important; }
            
            .table-container { overflow: visible; padding: 0; }
            .azs-title { color: black; margin-top: 0; font-size: 1.2rem; }
            .azs-dates { color: #333; font-size: 0.9rem; margin-bottom: 10px; }
            
            table { min-width: 100%; border: 2px solid black; background: white; }
            thead th { background: #ddd !important; color: black !important; border: 1px solid black !important; position: static; font-size: 0.55rem; padding: 5px; }
            .header-main-row th { border-bottom: 2px solid black !important; }
            
            tbody tr { border-bottom: 1px solid black; }
            td { border: 1px solid black !important; color: black !important; padding: 4px 2px; font-size: 0.55rem; }
            
            .td-task { color: black !important; font-weight: bold; font-size: 0.45rem; width: 45%; }
            .td-name { color: black !important; font-weight: 900; font-size: 0.5rem; }
            .td-empty { color: transparent !important; background: #eee !important; } 
            
            .td-sign { background: white !important; }
            .td-sign-empty { background: #eee !important; }
            
            /* Unikaj ucinania wierszy w połowie na wydruku */
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">

<div class="navigation-area">
    <div class="controls-group">
        <select id="monthSelect" onchange="updateWeeks()"></select>
        <select id="weekSelect"></select>
        <button class="btn-gen" onclick="generateAZS()">🔄 GENERUJ AZS Z PLANU</button>

    <button class="btn-print" onclick="window.print()">🖨️ DRUKUJ AZS</button>
</div>

<div class="table-container">
    <div class="azs-title">AGENDA ZADAŃ SKLEPU (AZS)</div>
    <div class="azs-dates" id="azsDates">Wybierz tydzień i kliknij generuj...</div>

    <table id="azsTable">
        <thead>
            <tr>
                <th rowspan="2" class="th-task">NAZWY ZADAŃ ORAZ OSOBY ODPOWIEDZIALNE:</th>
                <th colspan="7" style="border-right: 2px solid #ffe800;">PRZYPISANE OSOBY</th>
                <th colspan="7">MIEJSCE NA PODPIS</th>
            </tr>
            <tr class="header-main-row">
                <th class="th-day">PON</th><th class="th-day">WTO</th><th class="th-day">ŚRO</th>
                <th class="th-day">CZW</th><th class="th-day">PIĄ</th><th class="th-day">SOB</th>

                <th class="th-sign">PON</th><th class="th-sign">WTO</th><th class="th-sign">ŚRO</th>
                <th class="th-sign">CZW</th><th class="th-sign">PIĄ</th><th class="th-sign">SOB</th><th class="th-sign">NIE</th>

        <tbody id="azsBody">
            </tbody>

<script>

    }

    // BAZA PRACOWNIKÓW - Odczytana i dostosowana z Twojego środowiska
    const employees = [
        {n: "PAWEŁ", p: false, dept: "ME"},

    ];

    // BAZA ZADAŃ WPROST Z TWOJEGO EXCELA! 
    // Indeksy dni: 1=PON, 2=WTO, 3=SRO, 4=CZW, 5=PIA, 6=SOB, 0=NIE
    const azsTasksData = [
        { name: "Reagowanie na SMS i KOMUNIKAT W MARKECIE informujący o złożeniu zamówienia OZG i SZS + wysłanie potwierdzenia max. do 15 minut", days: [1,2,3,4,5,6] },

        { name: "Osoba odpowiedzialna za odbieranie TELEFONÓW SKLEPOWYCH w ciągu dnia + za utrzymywanie ich maksymalnej głośności i naładowania baterii", days: [1,2,3,4,5,6] },
        { name: "Wydruk CENÓWEK + Wydruk RAPORTU WYWIESZEK KORZYŚCI i sprawdzenie wszystkich WYWIESZEK KORZYŚCI do wywieszenia oraz tych do usunięcia", days: [1,2,3,4,5,6] },
        { name: "Porządek i bezpieczeństwo SOCJAL, MAGAZYN, pozostałe pomieszczenia + OTOCZENIE SKLEPU i NAMIOTU, w tym kontrola FLAG i LOGO ŚWIETLNEGO", days: [1,2,3,4,5,6] },
        { name: "Kontrola: Brak zalegających DOKUMENTÓW na widoku + PORZĄDEK POK, SERWIS, STANOWISKA KOMPUTEROWE + ODKURZANIE SALI SPRZEDAŻY", days: [1,2,3,4,5,6] },
        { name: "Wystawienie POTYKACZY + uzupełnianie obowiązujących materiałów DRUKOWANYCH", days: [1,2,3,4,5,6] },
        { name: "Uzupełnienie LODÓWKI Z NAPOJAMI (LAYOUT) + EKSPOZYCJI NA POK + KOSZYKA Z DROBNYM SLW NA POK (towar + zamówienia)", days: [1,2,3,4,5,6] },
        { name: "Wykonanie FORMATEK zgodnie z datami podanymi na TOL", days: [1,2,3,4,5,6] },
        { name: "Kontrola dokumentów MM przyjęcia zatwierdzonych w nocy + informacja o tym fakcie do KE/KSS", days: [1,2,3,4,5,6] },
        { name: "Weryfikacja ilości i wartości zamówień OZG i MESK i PWS do dbioru w danym dniu + informacja do KE/KSS maksymalnie godzinę po otwarciu sklepu", days: [1,2,3,4,5,6] },
        { name: "Przekazanie informacji Pracownikom POK na temat OZG i MESK O WARTOŚCI POWYŻEJ 500 ZŁ w celu zapewnienia dosprzedaży", days: [1,2,3,4,5,6] },
        { name: "Kontrola: Włączony radiowęzeł oraz MUZYKA na wszystkich nośnikach + Przestrzeganie zakazu odtwarzania treści chron. prawem autorskim", days: [1,2,3,4,5,6] },
        { name: "Kontrola: Włączone wszystkie TOWARY objęte obowiązkiem włączenia + Włączone i zapętlone wszystkie obowiązkowe prezentacje", days: [1,2,3,4,5,6] },
        { name: "Kontrola: Na wszystkich SZCZYTACH, WYSPACH, KOSZACH i EKSPOZYTORACH Prawidłowe MODELE, CENY, WYWIESZKI i WYSTAWIENIE 100% SZTUK towarów", days: [1,2,3,4,5,6] },
        { name: "Kontrola: Uzupełnione DZIURY towarowe we wszystkich DZIAŁACH + informacja o tym fakcie do KE/KSS", days: [1,2,3,4,5,6] },
        { name: "Kontrola POPRAWNOŚCI CEN wg HARMONOGRAMU + w grupach, w których wystąpiła NIEZGODNA CENA SYSTEMOWA", days: [1,2,3,4,5,6] },
        { name: "Przyjęcie TOWARU + wydruk z Marketu RAPORTU NOWYCH TOWARÓW, żeby wiedzieć co należy wystawić na półkę", days: [1,2,3,4,5,6] },
        { name: "Kontrola Wystawienia Towaru (KWT) - rozłożenie kontroli na wszyskie dni tygodnia (razem wszystkie grupy muszą być skontrolowane w sklepie RAZ W TYGODNIU)", days: [1,2,3,4,5,6] },
        { name: "Kontrola listy OBECNOŚCI + Kontrola zeszytu WYJŚĆ + Kontrola grafików PRZERW/POSIŁKÓW", days: [1,2,3,4,5,6] },
        { name: "Praca z REKLAMACJAMI, w tym również WYSYŁKI, WYDANIA oraz BIEŻĄCY KONTAKT TELEFONICZNY Z KLIENTEM", days: [1,2,3,4,5,6] },
        { name: "INWENTARYZACJA cząstkowa kolejnych działów oraz kolejnych GRUP WYSOKIEGO RYZYKA (polecenie wykonania pracownikowi SALI + egzekwowanie)", days: [1,2,3,4,5,6] },
        { name: "Kontrola wyrywkowa kazdego rodzaju ZABEZPIECZEŃ", days: [1,2,3,4,5] },
        { name: "Wskazanie osób do BADANIA KONKURENCJI zgodnie z aktualnymi wytycznymi", days: [1,2,3,4,5] },
        { name: "Kontrola MESK i PWS (sprawność procesu + składowanie wg zasad + nieodebrane >1 dnia: czy wykonane telefony do klientów z komentarzem w PDS)", days: [1,2,3,4,5] },
        { name: "Kontrola wywołanych ZWROTÓW NIEODEBRANYCH MESK i PWS (RAPORT 507) + wystawienie na salę sprzedaży towarów pozostawionych na stanie sklepu", days: [1,2,3,4,5] },
        { name: "Opróżnianie szafek i strefy MESK z zalegających towarów NIEODEBRANYCH (MESK, PWS, OZG)", days: [1] },
        { name: "Kontrola czy nie ma zapisanych HASEŁ przy stanowiskach, SZCZEGÓLNIE RATALNE I SERWISOWE", days: [1] },
        { name: "Kontrola PUSTE MAGAZYNY + podział na 10 stref (Puste, Pełne, Wartościówka, Internet, Zwroty, Wywózki, Reklamacje, Wyposażenie, Odpady, Dostawa)", days: [2] },
        { name: "Kontrola towarów NPW (Wystawienie 100% + Oznaczenie + Cena + Strategia sprzedaży)", days: [3] },
        { name: "Sprawdzenie CAŁEJ ekspozycji czy nie ma niezgłoszonych towarów NPW lub PSP i niezwłoczne zgłoszenie ich do KE/KSS", days: [3] },
        { name: "Kontrola towarów SLW (Wystawienie 100% + Oznaczenie + Cena + Strategia sprzedaży)", days: [3] },
        { name: "Kontrola towarów z kończącą się datą (wprowadzenie na NPW kat. T) + towarów już przeterminowanych (ZWROT)", days: [3] },
        { name: "Kontrola CZYSTOŚCI towaru i regałów", days: [3] },
        { name: "Kontrola TOP (ZA POMOCĄ KOLEKTORA)", days: [4] },
        { name: "Kontrola oznaczeń AKCJI PROMOCYJNYCH w całym sklepie", days: [4] },
        { name: "Kontrola NTOL LISTA VM - REKLAMACJE (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - DZIAŁ AGD DROBNE (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - DZIAŁ AGD DUŻE (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - DZIAŁ IT (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - DZIAŁ RTV i ROZRYWKA (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - DZIAŁ RS (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - POK (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] },
        { name: "Kontrola NTOL LISTA VM - OGÓLNE (zrealizuj w dniach od poniedziałku do czwartku)", days: [4] }
    ];

    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    const year = 2026;
    let currentWeeks = [];

    // --- CZYTANIE Z PLANU PRACY ---
    function getShiftOnly(n, d, m) {
        let v = localStorage.getItem(`pl_${year}_${m}_${n}_${d}`) || "";
        return v.split('|')[0] || "";
    }

    function initSelectors() {
        const mSel = document.getElementById('monthSelect');
        months.forEach((m, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${m} ${year}`;
            mSel.appendChild(opt);
        });
        mSel.value = new Date().getMonth();
        updateWeeks();
    }

    // Kalkulacja tygodni
    function updateWeeks() {
        const mIndex = parseInt(document.getElementById('monthSelect').value);
        const daysInMonth = new Date(year, mIndex + 1, 0).getDate();
        
        currentWeeks = [];
        let currentWeek = [];

        for (let d = 1; d <= daysInMonth; d++) {
            let date = new Date(year, mIndex, d);
            currentWeek.push(d);
            
            // Koniec tygodnia (Niedziela) lub koniec miesiąca
            if (date.getDay() === 0 || d === daysInMonth) {
                currentWeeks.push([...currentWeek]);
                currentWeek = [];
            }
        }

        const wSel = document.getElementById('weekSelect');
        wSel.innerHTML = "";
        currentWeeks.forEach((week, i) => {
            let opt = document.createElement('option');
            opt.value = i;
            let startD = String(week[0]).padStart(2, '0');
            let endD = String(week[week.length-1]).padStart(2, '0');
            let mStr = String(mIndex + 1).padStart(2, '0');
            opt.innerText = `Tydzień ${i + 1} (${startD}.${mStr} - ${endD}.${mStr})`;
            wSel.appendChild(opt);
        });
    }

    // --- GŁÓWNY SILNIK GENERUJĄCY TABELĘ AZS ---
    function generateAZS() {
        const mIndex = parseInt(document.getElementById('monthSelect').value);
        const wIndex = parseInt(document.getElementById('weekSelect').value);
        const weekDays = currentWeeks[wIndex];

        // Nagłówek dla wydruku
        let startD = String(weekDays[0]).padStart(2, '0');
        let endD = String(weekDays[weekDays.length - 1]).padStart(2, '0');
        let mStr = String(mIndex + 1).padStart(2, '0');
        document.getElementById('azsDates').innerText = `WPISZ DATY: OD ${startD}.${mStr} DO ${endD}.${mStr}`;

        const tbody = document.getElementById('azsBody');
        tbody.innerHTML = "";

        // Licznik obciążenia (żeby sprawiedliwie dzielić zadania)
        let workload = {};
        employees.forEach(e => workload[e.n] = 0);

        azsTasksData.forEach(task => {
            let tr = document.createElement('tr');
            let html = `<td class="td-task">${task.name}</td>`;
            
            let firstDayOfWeek = new Date(year, mIndex, weekDays[0]).getDay();
            let emptyDaysBefore = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1; 

            let activeDaysHtml = "";
            let signaturesHtml = "";
            let dayCounter = 0;

            // Puste dni przed początkiem danego tygodnia
            for(let i=0; i<emptyDaysBefore; i++) {
                activeDaysHtml += `<td class="td-empty">-</td>`;
                signaturesHtml += `<td class="td-sign-empty"></td>`;
                dayCounter++;
            }

            // Dni właściwe dla wybranego tygodnia
            weekDays.forEach(d => {
                let currentDayOfWeek = new Date(year, mIndex, d).getDay(); 
                
                // Sprawdzamy czy to zadanie wykonuje się w ten konkretny dzień tygodnia wg CSV
                if(!task.days.includes(currentDayOfWeek)) {
                    activeDaysHtml += `<td class="td-empty">-</td>`;
                    signaturesHtml += `<td class="td-sign-empty"></td>`;
                } else {
                    // Znajdź kto aktualnie fizycznie PRACUJE tego dnia wg grafiku (omijaj Kierownika ME)
                    let workingToday = employees.filter(e => {
                        let shift = getShiftOnly(e.n, d, mIndex);
                        return shift.includes('-') && e.dept !== 'ME';
                    });

                    if (workingToday.length === 0) {
                        activeDaysHtml += `<td class="td-empty">BRAK OBS.</td>`;
                        signaturesHtml += `<td class="td-sign"></td>`;
                    } else {
                        // Posortuj pracowników tak, by wybrać tego z najmniejszą ilością zadań dzisiaj
                        workingToday.sort((a, b) => workload[a.n] - workload[b.n]);
                        let assignedPerson = workingToday[0];
                        
                        workload[assignedPerson.n]++; // Dodaj mu obciążenie
                        activeDaysHtml += `<td class="td-name">${assignedPerson.n}</td>`;
                        signaturesHtml += `<td class="td-sign"></td>`;
                    }
                }
                dayCounter++;
            });

            // Puste dni na końcu tygodnia
            while(dayCounter < 7) {
                activeDaysHtml += `<td class="td-empty">-</td>`;
                signaturesHtml += `<td class="td-sign-empty"></td>`;
                dayCounter++;
            }

            html += activeDaysHtml + signaturesHtml;
            tr.innerHTML = html;
            tbody.appendChild(tr);
        });
    }

    // Inicjalizacja przy wejściu na stronę
    window.onload = () => {
        initSelectors();
        generateAZS(); // Automatycznie generuje pierwszy tydzień na start
    };
</script>
</body>
</html>
