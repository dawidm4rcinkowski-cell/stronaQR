<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER I MENU */
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        /* GŁÓWNA ZAWARTOŚĆ */
        .content { flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }
        
        /* POWITANIE */
        .greeting { text-align: center; margin-bottom: 20px; }
        .greeting h1 { color: #fff; font-size: 1.5rem; }
        .greeting span { color: #ffe800; }

        /* ZEGAR KAFELKOWY (Flip Clock 3D) */
        .clock-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; perspective: 1000px; }
        .time-box { background: #151515; border: 2px solid #333; border-radius: 10px; padding: 15px 20px; display: flex; flex-direction: column; align-items: center; min-width: 90px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); transform-style: preserve-3d; }
        .time-box .label { font-size: 0.5rem; color: #888; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
        .time-box .digits { font-size: 2.5rem; font-weight: 900; color: #ffe800; height: 45px; display: flex; justify-content: center; align-items: center; }
        
        .flip-anim { animation: fullFlip 0.5s ease-in-out; }
        
        @keyframes fullFlip {
            0% { transform: rotateX(0deg); background: #151515; }
            50% { transform: rotateX(-90deg); background: #222; } /* W połowie obrotu ciemnieje */
            100% { transform: rotateX(0deg); background: #151515; }
        }

        /* SKRÓTY (KAFELKI) */
        .section-title { font-size: 0.8rem; color: #666; font-weight: 900; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .shortcuts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 35px; }
        .shortcut-card { background: linear-gradient(145deg, #1a1a1a, #111); border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; text-decoration: none; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .shortcut-card:hover { transform: translateY(-5px); border-color: #ffe800; box-shadow: 0 5px 15px rgba(255, 232, 0, 0.15); }
        .shortcut-icon { font-size: 2rem; }
        .shortcut-title { font-weight: 900; font-size: 0.8rem; }

        /* NASZA EKIPA (Powiększone i spójne kolorystycznie) */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .team-card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .team-card:hover { background: #111; border-color: #ffe800; box-shadow: 0 5px 15px rgba(255, 232, 0, 0.05); }
        
        .team-avatar { width: 50px; height: 50px; border-radius: 50%; background: #1a1a1a; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.5rem; flex-shrink: 0; }
        
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-weight: 900; font-size: 1rem; color: #fff; letter-spacing: 0.5px; }
        .team-dept { font-size: 0.75rem; color: #ffe800; font-weight: 900; margin-top: 4px; }

    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link" style="color:#ffe800">Strona główna</a>
    <a href="plan.html" class="sidebar-link">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="content">
    
    <div class="greeting">
        <h1>Cześć, <span>Ekipa!</span></h1>
    </div>

    <div class="clock-container">
        <div class="time-box" id="box-hours">
            <div class="label">GODZINA</div>
            <div class="digits" id="hours">00</div>
        </div>
        <div class="time-box" id="box-minutes">
            <div class="label">MINUTA</div>
            <div class="digits" id="minutes">00</div>
        </div>
        <div class="time-box" id="box-seconds">
            <div class="label">SEKUNDA</div>
            <div class="digits" id="seconds">00</div>
        </div>
    </div>

    <div class="section-title">SZYBKIE SKRÓTY</div>
    <div class="shortcuts-grid">
        <a href="plan.html" class="shortcut-card">
            <div class="shortcut-icon">📅</div>
            <div class="shortcut-title">PLAN PRACY</div>
        </a>
        <a href="inwentury.html" class="shortcut-card">
            <div class="shortcut-icon">📦</div>
            <div class="shortcut-title">INWENTURY</div>
        </a>
        <a href="kodqr.html" class="shortcut-card">
            <div class="shortcut-icon">📱</div>
            <div class="shortcut-title">KOD QR</div>
        </a>
    </div>

    <div class="section-title">NASZA EKIPA</div>
    <div class="team-grid" id="teamContainer">
        </div>

</div>

<script>
    // --- OBSŁUGA ZEGARA Z ANIMACJĄ CAŁEGO KAFELKA ---
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        updateTile('hours', 'box-hours', h);
        updateTile('minutes', 'box-minutes', m);
        updateTile('seconds', 'box-seconds', s);
    }

    function updateTile(textId, boxId, newValue) {
        const textEl = document.getElementById(textId);
        const boxEl = document.getElementById(boxId);
        
        if (textEl.innerText !== newValue) {
            boxEl.classList.remove('flip-anim');
            void boxEl.offsetWidth; // Wymuszenie restartu animacji
            boxEl.classList.add('flip-anim');
            
            // Podmiana tekstu w połowie obrotu (po 250ms z 500ms), żeby cyfra zmieniła się, gdy kafelek jest "płaski" względem oczu
            setTimeout(() => {
                textEl.innerText = newValue;
            }, 250); 
        }
    }

    setInterval(updateClock, 1000);
    updateClock(); // Odpalenie od razu

    // --- OBSŁUGA MENU BOCZNEGO ---
    function toggleNav() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }

    // --- GENEROWANIE EKIPY (Wizytówka) ---
    const mockTeam = [
        { name: "PAWEŁ", initial: "P", dept: "KSS" },
        { name: "MICHAŁ", initial: "M", dept: "KSS" },
        { name: "NATALIA", initial: "N", dept: "POK" },
        { name: "MAGDA", initial: "M", dept: "POK" },
        { name: "JAKUB", initial: "J", dept: "IT" },
        { name: "ADRIAN", initial: "A", dept: "IT" },
        { name: "DAWID", initial: "D", dept: "IT" },
        { name: "DAREK", initial: "D", dept: "IT" },
        { name: "ŁUKASZ", initial: "Ł", dept: "AGD" },
        { name: "ILONA", initial: "I", dept: "AGD" },
        { name: "ARIEL", initial: "A", dept: "RTV" }
    ];

    const teamContainer = document.getElementById('teamContainer');
    
    mockTeam.forEach(member => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
            <div class="team-avatar">${member.initial}</div>
            <div class="team-info">
                <span class="team-name">${member.name}</span>
                <span class="team-dept">${member.dept}</span>
            </div>
        `;
        teamContainer.appendChild(card);
    });
</script>

</body>
</html>
