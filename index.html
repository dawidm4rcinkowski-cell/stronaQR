<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <div class="logo">MEDIA <span>EXPERT</span></div>
    </header>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <a href="index.html" class="sidebar-link">🏠 STRONA GŁÓWNA</a>
        <a href="plan.html" class="sidebar-link">📅 PLAN PRACY</a>
        <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
    </nav>

    <main style="padding: 20px;">
        <div id="currentDate" style="color: #888; font-size: 0.8rem; margin-bottom: 5px;"></div>
        <div class="flip-clock">
            <div class="flip-unit" id="hours">00</div>
            <div class="flip-unit" id="minutes">00</div>
            <div class="flip-unit" id="seconds">00</div>
        </div>

        <div class="dashboard-grid">
            <a href="plan.html" class="dash-card">
                <i>📅</i>
                <div class="card-info"><h3>Plan Pracy</h3><p>Sprawdź grafik i zadania</p></div>
            </a>
            <a href="qr.html" class="dash-card">
                <i>🖼️</i>
                <div class="card-info"><h3>Twój Kod QR</h3><p>Szybki dostęp do identyfikacji</p></div>
            </a>
            <div class="dash-card">
                <i>🕒</i>
                <div class="card-info"><h3>Twoja zmiana</h3><p id="shift-info">Ładowanie...</p></div>
            </div>
        </div>

        <div class="team-container">
            <h2 style="color: #ffe800; font-size: 1.1rem; margin-bottom: 15px;">NASZA EXPERTOWA EKIPA</h2>
            <div id="team-list" style="display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #ccc;">
                </div>
        </div>
    </main>
    <script src="java.js"></script>
</body>
</html>
