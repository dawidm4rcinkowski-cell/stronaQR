<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Panel Pracownika</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">NAWIGACJA</div>
    <a href="index.html" class="sidebar-link active">🏠 STRONA GŁÓWNA</a>
    <a href="plan.html" class="sidebar-link">📅 PLAN PRACY</a>
    <a href="inwa.html" class="sidebar-link">📝 INWENTURY</a>
    <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
</nav>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<main>
    <div class="clock-container">
        <div class="flip-card" id="hours">
            <div class="flip-inner">
                <div class="flip-front">00</div>
                <div class="flip-back">00</div>
            </div>
        </div>
        <div class="clock-sep">:</div>
        <div class="flip-card" id="minutes">
            <div class="flip-inner">
                <div class="flip-front">00</div>
                <div class="flip-back">00</div>
            </div>
        </div>
        <div class="clock-sep">:</div>
        <div class="flip-card" id="seconds">
            <div class="flip-inner">
                <div class="flip-front">00</div>
                <div class="flip-back">00</div>
            </div>
        </div>
    </div>

    <div class="dashboard-grid">
        <a href="plan.html" class="dash-card">
            <div class="icon-box">📅</div>
            <div class="card-info">
                <h3>PLAN PRACY</h3>
                <p>SPRAWDŹ GRAFIK</p>
            </div>
        </a>
        <a href="inwa.html" class="dash-card">
            <div class="icon-box">📝</div>
            <div class="card-info">
                <h3>INWENTURY</h3>
                <p>LISTA ZADAŃ</p>
            </div>
        </a>
        <a href="qr.html" class="dash-card">
            <div class="icon-box">🖼️</div>
            <div class="card-info">
                <h3>MOJE QR</h3>
                <p>TWOJE KODY</p>
            </div>
        </a>
    </div>

    <section class="team-wrapper">
        <h2 class="team-title">DZISIEJSZA <span>EKIPA</span></h2>
        <div class="team-grid" id="teamGrid">
            </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
