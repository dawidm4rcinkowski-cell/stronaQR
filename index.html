<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #000; color: white; overflow-x: hidden; }
        header { background: #ffe800; height: 60px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 2000; }
        .logo { color: #000; font-weight: 900; font-size: 1.6rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 4px; }
        .menu-btn { position: absolute; left: 20px; cursor: pointer; color: #000; font-size: 1.8rem; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.3s; z-index: 3000; }
        .sidebar.active { left: 0; }
        .sidebar-header { background: #1a1a1a; color: #777; padding: 25px; font-weight: 900; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #222; }
        .sidebar-link { display: block; color: white; padding: 18px 25px; text-decoration: none; font-weight: 700; border-bottom: 1px solid #1a1a1a; transition: 0.3s; }
        .sidebar-link:hover { background: #111; color: #ffe800; padding-left: 35px; }
        .sidebar-link.active { background: #111; color: #ffe800; border-left: 5px solid #ffe800; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 2500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }
        main { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .page-title { text-align: center; font-weight: 900; font-size: 2.5rem; margin-bottom: 50px; text-transform: uppercase; }
        .page-title span { color: #ffe800; }
        .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 60px; }
        .home-card { background: #111; border: 2px solid #222; border-radius: 20px; padding: 30px; display: flex; align-items: center; gap: 20px; text-decoration: none; color: white; transition: 0.3s; }
        .home-card:hover { border-color: #ffe800; background: #1a1a00; transform: translateY(-5px); }
        .home-card .icon { font-size: 2.2rem; background: #1a1a1a; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 15px; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .emp-card { background: #0a0a0a; border: 1px solid #222; border-radius: 15px; padding: 20px; text-align: center; }
        .emp-name { font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .emp-dept { font-size: 0.7rem; font-weight: 900; color: #ffe800; background: rgba(255,232,0,0.1); padding: 3px 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <div class="logo">MEDIA <span>EXPERT</span></div>
    </header>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">NAWIGACJA</div>
        <a href="index.html" class="sidebar-link active">🏠 STRONA GŁÓWNA</a>
        <a href="plan.html" class="sidebar-link">📅 PLAN PRACY</a>
        <a href="inwa.html" class="sidebar-link">📝 INWENTURY</a>
        <a href="kwt.html" class="sidebar-link">🔍 KWT</a>
        <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
        <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff4444; margin-top: 20px;">🚪 WYLOGUJ</a>
    </nav>
    <main>
        <h1 class="page-title">SYSTEM <span>ZARZĄDZANIA</span></h1>
        <div class="home-grid">
            <a href="plan.html" class="home-card"><div class="icon">📅</div><div><h3>PLAN PRACY</h3><p style="font-size:0.8rem; color:#666">GRAFIK ZESPOŁU</p></div></a>
            <a href="inwa.html" class="home-card"><div class="icon">📝</div><div><h3>INWENTURY</h3><p style="font-size:0.8rem; color:#666">LISTY KONTROLNE</p></div></a>
            <a href="kwt.html" class="home-card"><div class="icon">🔍</div><div><h3>KWT</h3><p style="font-size:0.8rem; color:#666">TOWAR NA WYSTAWIE</p></div></a>
            <a href="qr.html" class="home-card"><div class="icon">🖼️</div><div><h3>KOD QR</h3><p style="font-size:0.8rem; color:#666">DOSTĘP MOBILNY</p></div></a>
        </div>
        <h2 style="margin-bottom:20px; text-transform:uppercase; font-weight:900">TWÓJ <span>ZESPÓŁ</span></h2>
        <div class="team-grid" id="teamGrid"></div>
    </main>
    <script>
        const employees = [
            {n:"Pawel", d:"ME"}, {n:"Michal", d:"KSS"}, {n:"Kuba", d:"IT"}, {n:"Lukasz", d:"AGD"},
            {n:"Ariel", d:"RTV"}, {n:"Dawid", d:"IT"}, {n:"Adrian", d:"IT"}, {n:"Magdalena", d:"POK"},
            {n:"Ilona", d:"AGD"}, {n:"Dariusz", d:"IT"}, {n:"Natalia", d:"POK"}
        ];
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        function logout() { localStorage.removeItem('loggedCharID'); window.location.href = 'login.html'; }
        if(!localStorage.getItem('loggedCharID')) { window.location.href = 'login.html'; }
        window.onload = () => {
            const grid = document.getElementById('teamGrid');
            employees.forEach(e => {
                grid.innerHTML += `<div class="emp-card"><div class="emp-name">${e.n}</div><div class="emp-dept">${e.d}</div></div>`;
            });
        };
    </script>
</body>
</html>
