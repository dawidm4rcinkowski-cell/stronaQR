<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kodów - Media Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1c1c1c 0%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        header {
            background-color: #ffe800;
            color: #000;
            padding: 25px;
            text-align: center;
            border-bottom: 6px solid #000;
            text-transform: uppercase;
            font-size: 2.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        header span {
            background: #000;
            color: #ffe800;
            padding: 0 15px;
            border-radius: 6px;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 40px 20px;
            gap: 30px;
        }

        .json-box {
            background: #000;
            color: #ffe800;
            padding: 35px 55px;
            border-radius: 100px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            font-weight: bold;
            border: 3px solid #ffe800;
            box-shadow: 0 0 40px rgba(255, 232, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .json-input {
            background: #111;
            border: 2px solid #ffe800;
            color: #fff;
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            border-radius: 10px;
            outline: none;
            width: 180px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .json-input:focus {
            background: #222;
            box-shadow: 0 0 20px #ffe800;
            border-color: #fff;
        }

        .punc { color: #ffffff; }

        .copy-btn {
            background-color: #ffe800;
            color: #000;
            border: none;
            padding: 20px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 15px;
            border-bottom: 8px solid #ccba00;
            transition: all 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .copy-btn:disabled {
            background-color: #555;
            border-bottom-color: #333;
            color: #888;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: none;
        }

        .copy-btn:hover:not(:disabled) {
            background-color: #f7e000;
            transform: translateY(-2px);
        }

        .copy-btn:active:not(:disabled) {
            border-bottom-width: 0;
            transform: translateY(5px);
        }

        #status {
            color: #4caf50;
            font-size: 1.2rem;
            height: 20px;
            font-weight: bold;
        }

        /* Sekcja Historii */
        .history-container {
            width: 100%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
        }

        .history-title {
            color: #ffe800;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: #1a1a1a;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ffe800;
        }

        .history-time {
            color: #888;
            font-size: 0.8rem;
            margin-left: 15px;
            white-space: nowrap;
        }

        .history-code {
            color: #ddd;
            word-break: break-all;
        }

        /* Styl przewijania */
        .history-list::-webkit-scrollbar { width: 8px; }
        .history-list::-webkit-scrollbar-track { background: #000; }
        .history-list::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 10px; }

        @media (max-width: 1000px) {
            .json-box { font-size: 0.9rem; padding: 20px 30px; border-radius: 30px; white-space: normal; text-align: center; }
            .json-input { width: 120px; font-size: 1rem; }
            header { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        Media <span>EXPERT</span>
    </header>

    <main>
        <div class="json-box">
            <span class="punc">{</span>"type"<span class="punc">:</span>"npws_order_received_qr_code"<span class="punc">,</span>"order_number"<span class="punc">:</span>"<input type="tel" id="order_input" class="json-input" placeholder="cyfry" oninput="this.value = this.value.replace(/[^0-9]/g, '');">"<span class="punc">,</span>"pin"<span class="punc">:</span>"<input type="tel" id="pin_input" class="json-input" placeholder="cyfry" oninput="this.value = this.value.replace(/[^0-9]/g, '');">"<span class="punc">}</span>
        </div>

        <button id="copyBtn" class="copy-btn" onclick="copyAndLog()">Kopiuj całość</button>
        
        <div id="status"></div>

        <div class="history-container">
            <div class="history-title">
                Ostatnio skopiowane <span>HISTORIA</span>
            </div>
            <ul id="historyList" class="history-list">
                </ul>
        </div>
    </main>

    <script>
        function copyAndLog() {
            const order = document.getElementById('order_input').value;
            const pin = document.getElementById('pin_input').value;
            const btn = document.getElementById('copyBtn');
            const status = document.getElementById('status');
            const historyList = document.getElementById('historyList');

            if (!order || !pin) {
                alert("Wypełnij oba pola przed kopiowaniem!");
                return;
            }

            const finalJson = `{"type":"npws_order_received_qr_code","order_number":"${order}","pin":"${pin}"}`;

            // 1. Kopiowanie
            navigator.clipboard.writeText(finalJson).then(() => {
                status.innerText = "SKOPIOWANO!";
                
                // 2. Dodawanie do historii
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                               now.getMinutes().toString().padStart(2, '0') + ":" + 
                               now.getSeconds().toString().padStart(2, '0');

                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `<span class="history-code">${finalJson}</span><span class="history-time">${timeStr}</span>`;
                
                // Dodaj na początek listy
                historyList.insertBefore(li, historyList.firstChild);

                // 3. Blokada przycisku (Cooldown 3 sekundy)
                btn.disabled = true;
                let timeLeft = 3;
                btn.innerText = `CZEKAJ (${timeLeft}s)`;

                const timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.innerText = "Kopiuj całość";
                        status.innerText = "";
                    } else {
                        btn.innerText = `CZEKAJ (${timeLeft}s)`;
                    }
                }, 1000);

            }).catch(err => {
                alert("Błąd: " + err);
            });
        }
    </script>

</body>
</html>
