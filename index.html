<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER I MENU (Spójne z plan.html) */
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        /* DASHBOARD CONTENT */
        .dashboard-content { padding: 30px; overflow-y: auto; flex-grow: 1; }
        .welcome-box { background: #111; border: 1px solid #ffe800; padding: 25px; border-radius: 10px; margin-bottom: 30px; }
        .welcome-box h1 { color: #ffe800; font-size: 1.8rem; margin-bottom: 5px; }
        .welcome-box p { color: #888; font-size: 0.9rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #151515; border: 1px solid #222; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: #666; font-size: 0.8rem; margin-bottom: 10px; letter-spacing: 1px; }
        .stat-card .value { font-size: 2.5rem; font-weight: 900; color: #fff; }

        .btn-logout { background: transparent; color: #f44; border: 1px solid #f44; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-logout:hover { background: #f44; color: #000; }
    </style>
</head>
<body>

<script>
    const store = localStorage.getItem('currentStore');
    const isSetup = localStorage.getItem(`setupComplete_${store}`);
    if(!store || !isSetup) {
        window.location.href = 'login.html'; // Jak niezalogowany, wraca na login
    }
</script>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link" style="color:#ffe800">Strona główna</a>
    <a href="plan.html" class="sidebar-link">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="dashboard-content">
    <div class="welcome-box">
        <h1 id="welcomeText">Witaj, Kierowniku!</h1>
        <p>Centrum zarządzania sklepem <strong id="storeText" style="color:#fff;"></strong></p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>LICZBA PRACOWNIKÓW</h3>
            <div class="value" id="empCount">0</div>
        </div>
        <div class="stat-card">
            <h3>TWÓJ CHAR ID</h3>
            <div class="value" id="charIdText" style="color:#ffe800;">---</div>
        </div>
    </div>

    <button class="btn-logout" onclick="logout()">Wyloguj się z systemu</button>
</div>

<script>
    // Wczytywanie danych sklepu z pamięci
    window.onload = () => {
        const store = localStorage.getItem('currentStore');
        const name = localStorage.getItem(`managerName_${store}`) || "Kierowniku";
        const charId = localStorage.getItem('managerCharId');
        
        let employees = JSON.parse(localStorage.getItem(`db_employees_${store}`)) || [];

        document.getElementById('welcomeText').innerText = `Witaj, ${name}!`;
        document.getElementById('storeText').innerText = store;
        document.getElementById('empCount').innerText = employees.length;
        document.getElementById('charIdText').innerText = charId;
    };

    function toggleNav() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }

    function logout() {
        // Czyścimy "sesję", ale nie bazę pracowników (dzięki temu po ponownym wejściu do tego sklepu plan i ludzie zostaną)
        localStorage.removeItem('currentStore');
        localStorage.removeItem('managerCharId');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
