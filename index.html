<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER I MENU */
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        /* GŁÓWNA ZAWARTOŚĆ */
        .content { flex-grow: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }
        
        /* POWITANIE */
        .greeting { text-align: center; margin-bottom: 20px; }
        .greeting h1 { color: #fff; font-size: 1.5rem; }
        .greeting span { color: #ffe800; }

        /* ZEGAR KAFELKOWY */
        .clock-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .time-box { background: #151515; border: 2px solid #333; border-radius: 10px; padding: 15px 20px; display: flex; flex-direction: column; align-items: center; min-width: 80px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .time-box .label { font-size: 0.5rem; color: #888; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; }
        .time-box .digits { font-size: 2.5rem; font-weight: 900; color: #ffe800; overflow: hidden; height: 45px; display: flex; justify-content: center; align-items: center; }
        .digit { display: inline-block; }
        .flip { animation: slideDown 0.4s cubic-bezier(0.4, 0.0, 0.2, 1); }
        
        @keyframes slideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* SKRÓTY (KAFELKI) */
        .section-title { font-size: 0.8rem; color: #666; font-weight: 900; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        .shortcuts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .shortcut-card { background: linear-gradient(145deg, #1a1a1a, #111); border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; text-decoration: none; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .shortcut-card:hover { transform: translateY(-5px); border-color: #ffe800; box-shadow: 0 5px 15px rgba(255, 232, 0, 0.1); }
        .shortcut-icon { font-size: 2rem; }
        .shortcut-title { font-weight: 900; font-size: 0.8rem; }

        /* NASZA EKIPA */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .team-card { background: #0a0a0a; border: 1px solid #222; border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px; transition: 0.3s; }
        .team-card:hover { background: #111; border-color: #444; }
        .team-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1a1a1a; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0; }
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-weight: 900; font-size: 0.8rem; color: #fff; }
        .team-dept { font-size: 0.6rem; color: #888; font-weight: 700; margin-top: 2px; }
        
        /* Kolory działów */
        .dept-pok { color: #ff4757; }
        .dept-it { color: #2ed573; }
        .dept-agd { color: #1e90ff; }
        .dept-rtv { color: #ffa502; }
        .dept-kss { color: #a4b0be; }

    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link" style="color:#ffe800">Strona główna</a>
    <a href="plan.html" class="sidebar-link">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="content">
    
    <div class="greeting">
        <h1>Cześć, <span>Ekipa!</span></h1>
    </div>

    <div class="clock-container">
        <div class="time-box">
            <div class="label">GODZINA</div>
            <div class="digits"><span id="hours" class="digit">00</span></div>
        </div>
        <div class="time-box">
            <div class="label">MINUTA</div>
            <div class="digits"><span id="minutes" class="digit">00</span></div>
        </div>
        <div class="time-box">
            <div class="label">SEKUNDA</div>
            <div class="digits"><span id="seconds" class="digit">00</span></div>
        </div>
    </div>

    <div class="section-title">SZYBKIE SKRÓTY</div>
    <div class="shortcuts-grid">
        <a href="plan.html" class="shortcut-card">
            <div class="shortcut-icon">📅</div>
            <div class="shortcut-title">PLAN PRACY</div>
        </a>
        <a href="inwentury.html" class="shortcut-card">
            <div class="shortcut-icon">📦</div>
            <div class="shortcut-title">INWENTURY</div>
        </a>
        <a href="kodqr.html" class="shortcut-card">
            <div class="shortcut-icon">📱</div>
            <div class="shortcut-title">KOD QR</div>
        </a>
    </div>

    <div class="section-title">NASZA EKIPA</div>
    <div class="team-grid" id="teamContainer">
        </div>

</div>

<script>
    // --- OBSŁUGA ZEGARA Z ANIMACJĄ ---
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        updateDigit('hours', h);
        updateDigit('minutes', m);
        updateDigit('seconds', s);
    }

    function updateDigit(id, newValue) {
        const el = document.getElementById(id);
        if (el.innerText !== newValue) {
            el.classList.remove('flip');
            // Wymuszenie reflow dla restartu animacji
            void el.offsetWidth;
            el.innerText = newValue;
            el.classList.add('flip');
        }
    }

    setInterval(updateClock, 1000);
    updateClock(); // Odpalenie od razu

    // --- OBSŁUGA MENU BOZNEGO ---
    function toggleNav() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }

    // --- GENEROWANIE EKIPY (Wizytówka) ---
    // Twoja ekipa wzięta z "suchego" planu pracy:
    const mockTeam = [
        { name: "PAWEŁ", initial: "P", dept: "KSS", class: "dept-kss" },
        { name: "MICHAŁ", initial: "M", dept: "KSS", class: "dept-kss" },
        { name: "NATALIA", initial: "N", dept: "POK", class: "dept-pok" },
        { name: "MAGDA", initial: "M", dept: "POK", class: "dept-pok" },
        { name: "JAKUB", initial: "J", dept: "IT", class: "dept-it" },
        { name: "ADRIAN", initial: "A", dept: "IT", class: "dept-it" },
        { name: "DAWID", initial: "D", dept: "IT", class: "dept-it" },
        { name: "DAREK", initial: "D", dept: "IT", class: "dept-it" },
        { name: "ŁUKASZ", initial: "Ł", dept: "AGD", class: "dept-agd" },
        { name: "ILONA", initial: "I", dept: "AGD", class: "dept-agd" },
        { name: "ARIEL", initial: "A", dept: "RTV", class: "dept-rtv" }
    ];

    const teamContainer = document.getElementById('teamContainer');
    
    mockTeam.forEach(member => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
            <div class="team-avatar">${member.initial}</div>
            <div class="team-info">
                <span class="team-name">${member.name}</span>
                <span class="team-dept ${member.class}">${member.dept}</span>
            </div>
        `;
        teamContainer.appendChild(card);
    });
</script>

</body>
</html>
