<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Portal Kierownika</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .container { background: #111; border: 2px solid #ffe800; border-radius: 15px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(255, 232, 0, 0.1); transition: 0.3s; }
        .logo { color: #fff; font-weight: 900; font-size: 2rem; text-transform: uppercase; text-align: center; margin-bottom: 30px; }
        .logo span { background: #000; color: #ffe800; padding: 0 8px; border-radius: 3px; }
        
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; font-weight: 700; }
        input, select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; font-size: 1rem; margin-bottom: 20px; border-radius: 5px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: #ffe800; }
        
        .btn { width: 100%; background: #ffe800; color: #000; border: none; padding: 15px; font-weight: 900; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #e6d100; transform: scale(1.02); }
        .btn-small { background: #333; color: #ffe800; border: 1px solid #ffe800; padding: 8px 15px; font-size: 0.8rem; cursor: pointer; border-radius: 5px; width: auto; }

        .error { color: #f44; font-size: 0.8rem; margin-top: -15px; margin-bottom: 15px; display: none; font-weight: 700; }

        /* Tabela konfiguracji pracowników */
        .emp-row { display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; background: #0a0a0a; padding: 10px; border: 1px solid #222; border-radius: 5px; }
        .emp-row input, .emp-row select { margin-bottom: 0; padding: 8px; font-size: 0.8rem; }
        .checkbox-container { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.7rem; color: #ffe800; font-weight: 900;}
        .checkbox-container input { width: auto; margin: 0; cursor: pointer; }
        
        .emp-list { max-height: 300px; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;}
        .emp-list::-webkit-scrollbar { width: 5px; }
        .emp-list::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="logo">MEDIA <span>EXPERT</span></div>

    <div id="stepLogin" class="step active">
        <h2 style="text-align:center; margin-bottom:5px; font-size:1.2rem;">PORTAL KIEROWNIKA</h2>
        <p style="text-align:center; color:#888; font-size:0.8rem; margin-bottom:20px;">Logowanie do systemu grafików</p>
        
        <label>KOD SKLEPU (np. S878)</label>
        <input type="text" id="loginStore" placeholder="Wpisz kod sklepu..." value="S878">
        
        <label>TWÓJ CHAR ID</label>
        <input type="text" id="loginChar" placeholder="Wpisz CharID...">
        
        <label>HASŁO</label>
        <input type="password" id="loginPass" placeholder="Wpisz hasło...">
        
        <div class="error" id="loginError">Nieprawidłowe dane logowania!</div>
        
        <button class="btn" onclick="attemptLogin()">ZALOGUJ SIĘ</button>
    </div>

    <div id="stepName" class="step">
        <h2 style="text-align:center; margin-bottom:5px; font-size:1.2rem; color:#ffe800;">WITAJ W SYSTEMIE!</h2>
        <p style="text-align:center; color:#888; font-size:0.8rem; margin-bottom:20px;">Wygląda na to, że logujesz się po raz pierwszy. Skonfigurujmy Twój profil.</p>
        
        <label>JAK MASZ NA IMIĘ?</label>
        <input type="text" id="managerName" placeholder="Podaj swoje imię (np. Jan)">
        
        <button class="btn" onclick="saveName()">DALEJ ➔</button>
    </div>

    <div id="stepEmployees" class="step" style="max-width: 800px;"> <h2 style="text-align:center; margin-bottom:5px; font-size:1.2rem; color:#ffe800;">ZESPÓŁ SKLEPU <span id="displayStoreCode"></span></h2>
        <p style="text-align:center; color:#888; font-size:0.8rem; margin-bottom:20px;">Dodaj swoich pracowników i przypisz ich do działów.</p>
        
        <div class="emp-list" id="empList">
            </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
            <button class="btn-small" onclick="addEmployeeRow()">+ DODAJ PRACOWNIKA</button>
            <button class="btn" style="width:200px;" onclick="finishSetup()">ZAKOŃCZ I GENERUJ PLAN 🚀</button>
        </div>
    </div>
</div>

<script>
    // Konfiguracja do testów (Zastąpi to backend)
    const VALID_STORE = "S878";
    const DEFAULT_PASS = "Welcome1!";

    // Zmiana kroków
    function showStep(stepId) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
        
        if(stepId === 'stepEmployees') {
            document.getElementById('mainContainer').style.maxWidth = '800px';
        }
    }

    // --- KROK 1: Logowanie ---
    function attemptLogin() {
        const store = document.getElementById('loginStore').value.trim().toUpperCase();
        const charId = document.getElementById('loginChar').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if (store === VALID_STORE && pass === DEFAULT_PASS && charId !== "") {
            localStorage.setItem('currentStore', store);
            localStorage.setItem('managerCharId', charId);
            
            // Sprawdzamy czy sklep był już skonfigurowany
            if (localStorage.getItem(`setupComplete_${store}`) === 'true') {
                // Skonfigurowany -> idziemy prosto do planu
                window.location.href = 'plan.html';
            } else {
                // Nieskonfigurowany -> idziemy do konfiguracji
                showStep('stepName');
            }
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    // --- KROK 2: Imię ---
    function saveName() {
        const name = document.getElementById('managerName').value.trim().toUpperCase();
        if(name === "") return alert("Podaj imię!");
        
        localStorage.setItem(`managerName_${localStorage.getItem('currentStore')}`, name);
        document.getElementById('displayStoreCode').innerText = localStorage.getItem('currentStore');
        
        showStep('stepEmployees');
        addEmployeeRow(); // Dodajemy pierwszy pusty wiersz na start
    }

    // --- KROK 3: Pracownicy ---
    function addEmployeeRow() {
        const list = document.getElementById('empList');
        const rowId = Date.now();
        
        const row = document.createElement('div');
        row.className = 'emp-row';
        row.id = `row_${rowId}`;
        
        row.innerHTML = `
            <input type="text" placeholder="Imię (np. NATALIA)" class="inp-name">
            <input type="text" placeholder="CharID (np. C1234)" class="inp-char">
            <select class="inp-dept">
                <option value="POK">POK (Obsługa Kas)</option>
                <option value="AGD">AGD</option>
                <option value="RTV">RTV</option>
                <option value="IT">IT</option>
                <option value="MAGAZYN">MAGAZYN</option>
            </select>
            <div class="checkbox-container">
                <input type="checkbox" class="inp-rs"> +RS
                <button style="background:transparent; border:none; color:#f44; margin-left:15px; cursor:pointer;" onclick="document.getElementById('row_${rowId}').remove()">✖</button>
            </div>
        `;
        list.appendChild(row);
    }

    function finishSetup() {
        const rows = document.querySelectorAll('.emp-row');
        let employees = [];
        
        rows.forEach(row => {
            let name = row.querySelector('.inp-name').value.trim().toUpperCase();
            let char = row.querySelector('.inp-char').value.trim();
            let dept = row.querySelector('.inp-dept').value;
            let rs = row.querySelector('.inp-rs').checked;
            
            if(name !== "" && char !== "") {
                // Transformacja danych do formatu, który rozumie nasz generator z poprzednich kroków
                employees.push({
                    n: name, 
                    i: name.charAt(0), // Pierwsza litera do avatara
                    p: (dept === 'POK'), // Jeśli POK to flaga true
                    dept: dept,
                    charId: char,
                    rs: rs
                });
            }
        });

        if(employees.length < 3) {
            return alert("Dodaj przynajmniej 3 pracowników, aby generator zadziałał poprawnie!");
        }

        // Zapisujemy bazę pracowników dla konkretnego sklepu
        const store = localStorage.getItem('currentStore');
        localStorage.setItem(`db_employees_${store}`, JSON.stringify(employees));
        localStorage.setItem(`setupComplete_${store}`, 'true');

        // Przekierowanie do grafiku
        alert("Konfiguracja zakończona! Przenoszę do generatora...");
        window.location.href = 'plan.html';
    }
</script>
</body>
</html>
