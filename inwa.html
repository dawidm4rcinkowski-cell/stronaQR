<!DOCTYPE html>
<html lang="pl">

<header>

<nav class="sidebar" id="sidebar">

    <a href="index.html" class="sidebar-link">🏠 STRONA GŁÓWNA</a>
    <a href="plan.html" class="sidebar-link">📅 PLAN PRACY</a>

<main class="inwa-container">

    <div class="dept-tabs">

    <section class="inwa-section" id="secTwoWeeks">
        <h2 class="section-label">Inwentury 2-tygodniowe</h2>
        <div class="items-grid" id="grid2Weeks"></div>

    <section class="inwa-section" id="secMonthly">
        <h2 class="section-label">Inwentury Miesięczne</h2>
        <div class="items-grid" id="gridMonthly"></div>
