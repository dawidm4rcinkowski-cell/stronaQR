<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Inwentury</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const storeSetup = JSON.parse(localStorage.getItem('store_setup'));
        if (!currentUser || !storeSetup) { window.location.href = 'login.html'; }
        const isManagerOrKss = (currentUser.dept === 'ME' || currentUser.isKss);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 3px; }
        .store-badge { font-size: 0.7rem; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 20px; font-weight: 800; border: 1px solid #000; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-header { color: #ffe800; font-weight: 900; font-size: 1rem; padding: 0 25px 15px 25px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        
        .user-profile { padding: 15px 20px; border-top: 2px solid #1a1a1a; display: flex; align-items: center; gap: 15px; cursor: pointer; background: #0f0f0f; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0;}
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 900; font-size: 0.85rem; color: #fff; }
        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; }
        .logout-btn { display: block; width: 100%; text-align: center; background: transparent; color: #f44; border: none; border-top: 1px solid #1a1a1a; padding: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }
        
        .content { flex-grow: 1; overflow-y: auto; padding: 30px 20px; }
        .content-inner { max-width: 1400px; margin: 0 auto; }
        .page-title { font-size: 2rem; font-weight: 900; margin-bottom: 30px; } .page-title span { color: #ffe800; }
        
        .dept-tabs { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { background: #151515; border: 1px solid #333; color: #fff; padding: 12px 30px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 0.9rem; flex: 1; max-width: 200px;}
        .tab-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        
        .inwa-section { margin-bottom: 50px; } 
        .section-label { font-size: 1rem; color: #ffe800; text-transform: uppercase; margin-bottom: 20px; border-left: 4px solid #ffe800; padding-left: 10px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .item-card { background: #111; border: 1px solid #222; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .item-card h3 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; min-height: 2.5rem; }
        
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.75rem; font-weight: 800; color: #888; }
        .dot { width: 10px; height: 10px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 8px rgba(255, 68, 68, 0.6); }
        
        .status-waiting .dot { background: #ffa502; box-shadow: 0 0 8px rgba(255, 165, 2, 0.6); } .status-waiting { color: #ffa502; }
        .status-done .dot { background: #0a0; box-shadow: 0 0 8px rgba(0, 170, 0, 0.6); } .status-done { color: #0a0; }
        .status-rejected .dot { background: #f44; animation: blink 1s infinite; } .status-rejected { color: #f44; }
        
        .approve-btn { width: 100%; background: transparent; border: 2px solid #ffe800; color: #ffe800; padding: 10px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .approve-btn:hover { background: #ffe800; color: #000; }
        .approve-btn:disabled { border-color: #333; color: #555; background: transparent; cursor: not-allowed; }
        
        /* GLOBALNY MODAL POWIADOMIEŃ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0a0a; border: 3px solid #ffe800; padding: 30px; width: 100%; max-width: 450px; border-radius: 15px; text-align: center; box-shadow: 0 0 30px rgba(255, 232, 0, 0.2); }
        .btn-modal { background: #ffe800; color: #000; border: none; padding: 15px 20px; font-weight: 900; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;}
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .nav-alert { color: #f44; font-weight: 900; animation: blink 1s infinite; font-size: 1rem; margin-left: 5px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">EXPERT <span>TOOL</span> <div class="store-badge" id="headerStore">SXXX</div></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
        <div class="sidebar-header">Nawigacja</div>
        <a href="index.html" class="sidebar-link">Strona główna</a>
        <a href="plan.html" class="sidebar-link">Plan pracy</a>
        <a href="inwa.html" class="sidebar-link" style="color:#ffe800">Inwentury</a>
        <a href="inwak.html" class="sidebar-link" id="navInwaKSS">Inwentury (ME/KSS) <span id="kssAlertBadge"></span></a>
        <a href="azs.html" class="sidebar-link">AZS</a>
        <a href="kwt.html" class="sidebar-link">KWT</a>
        <a href="qr.html" class="sidebar-link">Kod QR</a>
    </div>
    <div class="user-profile" onclick="window.location.href='ustawienia.html'">
        <div class="user-avatar" id="sideAvatar">?</div>
        <div class="user-info">
            <span class="user-name" id="sideName">Wczytywanie...</span>
            <span class="user-settings">⚙️ Ustawienia konta</span>
        </div>
    </div>
    <button class="logout-btn" onclick="logout()">Wyloguj się</button>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="content">
    <div class="content-inner">
        <h1 class="page-title">LISTA <span>INWENTUR</span></h1>
        <div class="dept-tabs">
            <button class="tab-btn active" onclick="switchDept('IT')">DZIAŁ IT</button>
            <button class="tab-btn" onclick="switchDept('RTV')">DZIAŁ RTV</button>
            <button class="tab-btn" onclick="switchDept('AGD')">DZIAŁ AGD</button>
        </div>
        <section class="inwa-section" id="secWeekly"><h2 class="section-label">Tygodniowe</h2><div class="items-grid" id="gridWeekly"></div></section>
        <section class="inwa-section" id="secTwoWeeks"><h2 class="section-label">2-tygodniowe</h2><div class="items-grid" id="grid2Weeks"></div></section>
        <section class="inwa-section" id="secMonthly"><h2 class="section-label">Miesięczne</h2><div class="items-grid" id="gridMonthly"></div></section>
    </div>
</div>

<div class="modal" id="globalNotificationModal">
    <div class="modal-content" id="popupBox">
        <h3 id="globalPopupTitle" style="margin-bottom: 15px; font-size: 1.3rem;">POWIADOMIENIE</h3>
        <p id="globalPopupMsg" style="color: #fff; font-size: 1rem; margin-bottom: 25px; line-height: 1.5; font-weight: 700;"></p>
        <button class="btn-modal" onclick="closeGlobalPopup()">ZROZUMIAŁEM</button>
    </div>
</div>

<script>
    // --- BAZA DANYCH INWENTUR (Jeśli pusta, tworzymy) ---
    const defaultInventoryList = [
        { id: "it_w1", dept: "IT", period: "weekly", name: "Smartfony" }, { id: "it_w2", dept: "IT", period: "weekly", name: "Tablety" }, { id: "it_w3", dept: "IT", period: "weekly", name: "Słuchawki TWS i nauszne" }, { id: "it_w4", dept: "IT", period: "weekly", name: "Smartwatche" },
        { id: "it_2w1", dept: "IT", period: "twoWeeks", name: "Laptopy i komputery" }, { id: "it_2w2", dept: "IT", period: "twoWeeks", name: "Drukarki i skanery" }, { id: "it_2w3", dept: "IT", period: "twoWeeks", name: "Myszki i Klawiatury" }, { id: "it_2w4", dept: "IT", period: "twoWeeks", name: "Głośniki mobilne" },
        { id: "it_m1", dept: "IT", period: "monthly", name: "Tusze i Tonery" }, { id: "it_m2", dept: "IT", period: "monthly", name: "Kable GSM, ładowarki i powerbanki" }, { id: "it_m3", dept: "IT", period: "monthly", name: "Torby i Etui" },
        { id: "rtv_w1", dept: "RTV", period: "weekly", name: "Telewizory do 55 cali" }, { id: "rtv_w2", dept: "RTV", period: "weekly", name: "Klocki LEGO" },
        { id: "rtv_2w1", dept: "RTV", period: "twoWeeks", name: "Telewizory od 65 cali" }, { id: "rtv_2w2", dept: "RTV", period: "twoWeeks", name: "Konsole i Pady" }, { id: "rtv_2w3", dept: "RTV", period: "twoWeeks", name: "Gry fizyczne" },
        { id: "rtv_m1", dept: "RTV", period: "monthly", name: "Uchwyty TV" }, { id: "rtv_m2", dept: "RTV", period: "monthly", name: "Kable HDMI i Audio" }, { id: "rtv_m3", dept: "RTV", period: "monthly", name: "Soundbary i Hi-Fi" },
        { id: "agd_w1", dept: "AGD", period: "weekly", name: "Ekspresy Automatyczne" }, { id: "agd_w2", dept: "AGD", period: "weekly", name: "Odkurzacze Pionowe" }, { id: "agd_w3", dept: "AGD", period: "weekly", name: "Blendery i wyciskarki" },
        { id: "agd_2w1", dept: "AGD", period: "twoWeeks", name: "Szczoteczki Elektryczne" }, { id: "agd_2w2", dept: "AGD", period: "twoWeeks", name: "Golarki i Depilatory" }, { id: "agd_2w3", dept: "AGD", period: "twoWeeks", name: "Żelazka i generatory" },
        { id: "agd_m1", dept: "AGD", period: "monthly", name: "Garnki i Patelnie" }, { id: "agd_m2", dept: "AGD", period: "monthly", name: "Filtry do wody i dzbanki" }, { id: "agd_m3", dept: "AGD", period: "monthly", name: "Odkurzacze Tradycyjne" }
    ];

    function initDB() {
        let db = localStorage.getItem('inwa_db');
        if (!db) {
            let initialDb = defaultInventoryList.map(item => ({ ...item, status: 'do_zrobienia', submittedBy: null, submitterId: null }));
            localStorage.setItem('inwa_db', JSON.stringify(initialDb));
        }
    }
    initDB();

    // Inicjalizacja UI
    document.getElementById('headerStore').innerText = `${storeSetup.sNumber} ${storeSetup.city}`;
    document.getElementById('sideName').innerText = `${currentUser.name} (${currentUser.dept})`;
    document.getElementById('sideAvatar').innerText = currentUser.charId.charAt(0);
    if(!isManagerOrKss) document.getElementById('navInwaKSS').style.display = 'none';

    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    // RENDEROWANIE KART
    function switchDept(dept) {
        document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); if(btn.innerText.includes(dept)) btn.classList.add('active'); });
        let db = JSON.parse(localStorage.getItem('inwa_db')) || [];
        renderSection('gridWeekly', db.filter(i => i.dept === dept && i.period === 'weekly'), 'secWeekly');
        renderSection('grid2Weeks', db.filter(i => i.dept === dept && i.period === 'twoWeeks'), 'secTwoWeeks');
        renderSection('gridMonthly', db.filter(i => i.dept === dept && i.period === 'monthly'), 'secMonthly');
    }

    function renderSection(gridId, data, sectionId) {
        const grid = document.getElementById(gridId);
        if(data.length === 0) { document.getElementById(sectionId).style.display = 'none'; return; }
        document.getElementById(sectionId).style.display = 'block';
        
        grid.innerHTML = data.map((item) => {
            let stHtml, btnHtml, cardClass = '';
            if (item.status === 'do_zrobienia') {
                stHtml = `<div class="status-row"><div class="dot"></div><span>DO ZROBIENIA</span></div>`;
                btnHtml = `<button class="approve-btn" onclick="submitInventory('${item.id}')">ZGŁOŚ WYKONANIE</button>`;
            } else if (item.status === 'awaiting_kss') {
                stHtml = `<div class="status-row status-waiting"><div class="dot"></div><span>OCZEKUJE NA KIEROWNIKA</span></div>`;
                btnHtml = `<button class="approve-btn" disabled>W WERYFIKACJI</button>`;
            } else if (item.status === 'done') {
                stHtml = `<div class="status-row status-done"><div class="dot"></div><span>ZAAKCEPTOWANE (${item.submittedBy})</span></div>`;
                btnHtml = `<button class="approve-btn" disabled style="border-color:#0a0; color:#0a0;">GOTOWE</button>`;
                cardClass = 'card-done';
            } else if (item.status === 'rejected') {
                stHtml = `<div class="status-row status-rejected"><div class="dot"></div><span>DO POPRAWY!</span></div>`;
                btnHtml = `<button class="approve-btn" style="border-color:#f44; color:#f44;" onclick="submitInventory('${item.id}')">ZGŁOŚ POPRAWĘ</button>`;
                cardClass = 'card-rejected';
            }
            return `<div class="item-card ${cardClass}"><h3>${item.name}</h3>${stHtml}${btnHtml}</div>`;
        }).join('');
    }

    // AKCJA: PRACOWNIK ZGŁASZA INWENTURĘ
    function submitInventory(id) {
        let db = JSON.parse(localStorage.getItem('inwa_db'));
        let item = db.find(i => i.id === id);
        item.status = 'awaiting_kss';
        item.submittedBy = currentUser.name;
        item.submitterId = currentUser.charId;
        localStorage.setItem('inwa_db', JSON.stringify(db));
        
        // Tworzenie powiadomienia dla KSS
        let notifs = JSON.parse(localStorage.getItem('app_notifications')) || [];
        notifs.push({ id: Date.now(), to: 'KSS', title: 'NOWA INWENTURA', msg: `Pracownik ${currentUser.name} zakończył: ${item.name} (${item.dept}). Sprawdź to!`, type: 'warning', read: false });
        localStorage.setItem('app_notifications', JSON.stringify(notifs));
        
        // Trigerujemy zdarzenie storage ręcznie dla tego samego okna (inne zakładki łapią same)
        window.dispatchEvent(new Event('storage'));
        switchDept(item.dept); // Odśwież UI
    }

    // --- SYSTEM POWIADOMIEŃ GLOBALNYCH ---
    function checkNotifications() {
        if (isManagerOrKss) {
            let db = JSON.parse(localStorage.getItem('inwa_db')) || [];
            let awaiting = db.filter(item => item.status === 'awaiting_kss').length;
            let badge = document.getElementById('kssAlertBadge');
            if(badge) badge.innerHTML = awaiting > 0 ? `<span class="nav-alert">[!]</span>` : '';
        }

        let notifs = JSON.parse(localStorage.getItem('app_notifications')) || [];
        let myUnread = notifs.filter(n => !n.read && (n.to === currentUser.charId || (n.to === 'KSS' && isManagerOrKss)));
        
        if (myUnread.length > 0) {
            let n = myUnread[0];
            document.getElementById('globalPopupTitle').innerText = n.title;
            document.getElementById('globalPopupMsg').innerText = n.msg;
            document.getElementById('globalNotificationModal').style.display = 'flex';
            let box = document.getElementById('popupBox');
            if(n.type === 'success') { box.style.borderColor = '#0a0'; document.getElementById('globalPopupTitle').style.color = '#0a0'; }
            else if(n.type === 'error') { box.style.borderColor = '#f44'; document.getElementById('globalPopupTitle').style.color = '#f44'; }
            else { box.style.borderColor = '#ffe800'; document.getElementById('globalPopupTitle').style.color = '#ffe800'; }
            
            n.read = true; // Oznacz jako przeczytane
            localStorage.setItem('app_notifications', JSON.stringify(notifs));
        }
    }

    function closeGlobalPopup() { document.getElementById('globalNotificationModal').style.display = 'none'; }
    window.addEventListener('storage', () => { checkNotifications(); switchDept(document.querySelector('.tab-btn.active').innerText.replace('DZIAŁ ', '')); });
    
    window.onload = () => { switchDept('IT'); checkNotifications(); };
</script>
</body>
</html>
