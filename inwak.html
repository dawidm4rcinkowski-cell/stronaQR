    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0;}
        .user-info { display: flex; flex-direction: column; }

        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; }

        .check-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 165, 2, 0.4); }
        .btn-disabled { background: transparent; border: 2px solid #333; color: #555; cursor: not-allowed; width: 100%; padding: 10px; border-radius: 8px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px;}
        .undo-btn { background: transparent; border: 1px solid #f44; color: #f44; padding: 8px; border-radius: 8px; font-weight: 900; cursor: pointer; width: 100%; font-size: 0.7rem; text-transform: uppercase; transition: 0.2s;}
        .undo-btn:hover { background: #f44; color: #000; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px);}
        .modal-content { background: #0a0a0a; border: 3px solid #ffa502; padding: 30px; width: 100%; max-width: 500px; border-radius: 15px; text-align: center; }
        .modal-subtitle { color: #ffa502; font-size: 0.8rem; font-weight: 900; margin-bottom: 25px; }
        .mgr-buttons { display: flex; gap: 10px; }

        .btn-reject { flex: 1; background: transparent; color: #f44; border: 2px solid #f44; padding: 15px 10px; font-weight: 900; border-radius: 8px; cursor: pointer; transition:0.3s; } .btn-reject:hover { background: #f44; color:#000; }
        .btn-cancel { width: 100%; background: #151515; color: #888; border: 1px solid #333; padding: 12px 20px; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 15px; }
