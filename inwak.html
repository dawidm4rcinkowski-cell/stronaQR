<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Panel Kierownika</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const storeSetup = JSON.parse(localStorage.getItem('store_setup'));
        if (!currentUser || !storeSetup) { window.location.href = 'login.html'; }
        const isManagerOrKss = (currentUser.dept === 'ME' || currentUser.isKss);
        if(!isManagerOrKss) { window.location.href = 'index.html'; } // Twarda blokada! Zwykły nie wejdzie
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 3px; }
        .store-badge { font-size: 0.7rem; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 20px; font-weight: 800; border: 1px solid #000; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-header { color: #ffe800; font-weight: 900; font-size: 1rem; padding: 0 25px 15px 25px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        .user-profile { padding: 15px 20px; border-top: 2px solid #1a1a1a; display: flex; align-items: center; gap: 15px; cursor: pointer; background: #0f0f0f; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0;}
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 900; font-size: 0.85rem; color: #fff; }
        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; }
        .logout-btn { display: block; width: 100%; text-align: center; background: transparent; color: #f44; border: none; border-top: 1px solid #1a1a1a; padding: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }
        .content { flex-grow: 1; overflow-y: auto; padding: 30px 20px; }
        .content-inner { max-width: 1400px; margin: 0 auto; }
        .page-title { font-size: 2rem; font-weight: 900; margin-bottom: 30px; } .page-title span { color: #ffe800; } .mgr-badge { font-size: 1rem; color: #0a0; border: 2px solid #0a0; padding: 5px 10px; border-radius: 5px; vertical-align: middle; margin-left: 10px; }
        .dept-tabs { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { background: #151515; border: 1px solid #333; color: #fff; padding: 12px 30px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .tab-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .inwa-section { margin-bottom: 50px; } .section-label { font-size: 1rem; color: #ffe800; text-transform: uppercase; margin-bottom: 20px; border-left: 4px solid #ffe800; padding-left: 10px; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .item-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .item-card h3 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; color: #eee; }
        .status-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; font-size: 0.75rem; font-weight: 800; color: #888; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 2px; }
        .status-waiting .dot { background: #ffa502; } .status-waiting span { color: #ffa502; }
        .status-accepted .dot { background: #0a0; } .status-accepted span { color: #0a0; }
        .status-rejected .dot { background: #f44; } .status-rejected span { color: #f44; }
        .submitted-by { color: #888; font-size: 0.65rem; margin-top: 4px; display: block; }
        .check-btn { width: 100%; background: transparent; border: 2px solid #ffa502; color: #ffa502; padding: 10px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0a0a0a; border: 2px solid #ffa502; padding: 30px; width: 100%; max-width: 500px; border-radius: 15px; text-align: center; }
        .mgr-buttons { display: flex; gap: 10px; }
        .btn-accept { flex: 1; background: transparent; color: #0a0; border: 2px solid #0a0; padding: 15px 10px; font-weight: 900; border-radius: 8px; cursor: pointer; }
        .btn-reject { flex: 1; background: transparent; color: #f44; border: 2px solid #f44; padding: 15px 10px; font-weight: 900; border-radius: 8px; cursor: pointer; }
        .btn-cancel { width: 100%; background: #151515; color: #888; border: 1px solid #333; padding: 12px; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">EXPERT <span>TOOL</span> <div class="store-badge" id="headerStore">SXXX</div></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
        <div class="sidebar-header">Nawigacja</div>
        <a href="index.html" class="sidebar-link">Strona główna</a>
        <a href="plan.html" class="sidebar-link">Plan pracy</a>
        <a href="inwa.html" class="sidebar-link">Inwentury</a>
        <a href="inwak.html" class="sidebar-link" style="color:#ffe800" id="navInwaKSS">Inwentury (ME/KSS)</a>
        <a href="azs.html" class="sidebar-link">AZS</a>
        <a href="kwt.html" class="sidebar-link">KWT</a>
        <a href="qr.html" class="sidebar-link">Kod QR</a>
    </div>
    <div class="user-profile" onclick="window.location.href='ustawienia.html'">
        <div class="user-avatar" id="sideAvatar">?</div>
        <div class="user-info">
            <span class="user-name" id="sideName">Ladowanie...</span>
            <span class="user-settings">⚙️ Ustawienia konta</span>
        </div>
    </div>
    <button class="logout-btn" onclick="logout()">Wyloguj się</button>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="content">
    <div class="content-inner">
        <h1 class="page-title">WERYFIKACJA <span>INWENTUR</span> <span class="mgr-badge">ME/KSS</span></h1>
        <div class="dept-tabs">
            <button class="tab-btn active" onclick="switchDept('IT')">DZIAŁ IT</button>
            <button class="tab-btn" onclick="switchDept('RTV')">DZIAŁ RTV</button>
            <button class="tab-btn" onclick="switchDept('AGD')">DZIAŁ AGD</button>
        </div>
        <section class="inwa-section" id="secWeekly"><h2 class="section-label">Tygodniowe</h2><div class="items-grid" id="gridWeekly"></div></section>
        <section class="inwa-section" id="secTwoWeeks"><h2 class="section-label">2-tygodniowe</h2><div class="items-grid" id="grid2Weeks"></div></section>
        <section class="inwa-section" id="secMonthly"><h2 class="section-label">Miesięczne</h2><div class="items-grid" id="gridMonthly"></div></section>
    </div>
</div>

<div class="modal" id="reviewModal">
    <div class="modal-content">
        <h3 id="modalItemName" style="color:#fff; margin-bottom: 5px;">Nazwa</h3>
        <div style="color:#ffa502; font-size:0.8rem; font-weight:900; margin-bottom:25px;">Zgłoszenie czeka na weryfikację</div>
        <div class="mgr-buttons">
            <button class="btn-reject" onclick="submitDecision('reject')">✖ DO POPRAWY</button>
            <button class="btn-accept" onclick="submitDecision('accept')">✔ ZAAKCEPTUJ</button>
        </div>
        <button class="btn-cancel" onclick="closeReviewModal()">Wróć</button>
    </div>
</div>

<script>
    document.getElementById('headerStore').innerText = `${storeSetup.sNumber} ${storeSetup.city}`;
    document.getElementById('sideName').innerText = `${currentUser.name} (${currentUser.dept})`;
    document.getElementById('sideAvatar').innerText = currentUser.charId.charAt(0);
    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    let currentReviewId = null;
    const inventoryData = { IT: { weekly: ["Smartfony", "Słuchawki truewireless"], twoWeeks: ["Słuchawki nauszne"], monthly: ["Tusze"] }, RTV: { weekly: [], twoWeeks: ["Konsole"], monthly: ["Nawigacje"] }, AGD: { weekly: [], twoWeeks: [], monthly: ["Szczoteczki"] } };
    function switchDept(dept) { document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); if(btn.innerText.includes(dept)) btn.classList.add('active'); }); renderSection(document.getElementById('gridWeekly'), inventoryData[dept].weekly, 'secWeekly'); renderSection(document.getElementById('grid2Weeks'), inventoryData[dept].twoWeeks, 'secTwoWeeks'); renderSection(document.getElementById('gridMonthly'), inventoryData[dept].monthly, 'secMonthly'); }
    function renderSection(grid, data, sectionId) {
        if(data.length === 0) { document.getElementById(sectionId).style.display = 'none'; return; }
        document.getElementById(sectionId).style.display = 'block';
        grid.innerHTML = data.map((item, i) => { let uId = item.replace(/[^a-zA-Z]/g, '') + i; return `<div class="item-card" id="card-${uId}"><h3>${item}</h3><div class="status-row status-waiting" id="st-${uId}"><div class="dot"></div><div><span>OCZEKUJE NA DECYZJĘ</span><span class="submitted-by">Zgłosił: PRACOWNIK</span></div></div><button class="check-btn" id="btn-${uId}" onclick="openReviewModal('${uId}', '${item}')">🔍 Sprawdź</button></div>`; }).join('');
    }
    function openReviewModal(id, itemName) { currentReviewId = id; document.getElementById('modalItemName').innerText = itemName; document.getElementById('reviewModal').style.display = 'flex'; }
    function closeReviewModal() { document.getElementById('reviewModal').style.display = 'none'; }
    function submitDecision(dec) {
        let card = document.getElementById(`card-${currentReviewId}`); let st = document.getElementById(`st-${currentReviewId}`); let btn = document.getElementById(`btn-${currentReviewId}`);
        if(dec === 'accept') { card.style.borderColor='#0a0'; st.className='status-row status-accepted'; st.innerHTML='<div class="dot"></div><div><span>ZAAKCEPTOWANO</span></div>'; btn.innerText='✔ SPRAWDZONE'; btn.style.color='#0a0'; btn.style.borderColor='#0a0'; btn.style.pointerEvents='none'; }
        if(dec === 'reject') { card.style.borderColor='#f44'; st.className='status-row status-rejected'; st.innerHTML='<div class="dot"></div><div><span>DO POPRAWY</span></div>'; btn.innerText='✖ ODRZUCONO'; btn.style.color='#f44'; btn.style.borderColor='#f44'; btn.style.pointerEvents='none'; }
        closeReviewModal();
    }
    window.onload = () => switchDept('IT');
</script>
</body>
</html>
