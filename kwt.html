        { id: "kwt_agd_43", name: "Tostery", dept: "agd" }, 
        { id: "kwt_agd_44", name: "Urządzenia grzewcze", dept: "agd" },
        { id: "kwt_agd_45", name: "Maszynki do golenia", dept: "agd" }
    ];

    let currentKwtDept = 'it';
    let kwtLiveDb = {}; // Statusy (czy kliknięto)
    let kwtItemsDb = []; // Pełna lista produktów z bazy

    document.getElementById('loadingData').style.display = 'flex';

    // POBIERANIE LISTY TOWARÓW Z BAZY (LUB INICJALIZACJA)
    db.ref(`Stores/${myStore}/KWT_Items`).on('value', snap => {
        if (!snap.exists()) {
            let initData = {};
            defaultKwtData.forEach(item => { initData[item.id] = item; });
            db.ref(`Stores/${myStore}/KWT_Items`).set(initData);
        } else {
            const data = snap.val();
            kwtItemsDb = Object.keys(data).map(key => data[key]);
            
            kwtItemsDb.sort((a,b) => a.name.localeCompare(b.name, 'pl'));
            
            document.getElementById('loadingData').style.display = 'none';
            renderKWT();
            
            if(document.getElementById('manageKwtModal').style.display === 'flex') {
                renderManageList();
            }
        }
    });

    // POBIERANIE STATUSÓW KWT
    db.ref(`Stores/${myStore}/KWT`).on('value', snap => {
        kwtLiveDb = snap.val() || {};
        renderKWT();
    });

    function filterKwtDept(dept, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        currentKwtDept = dept; 
        renderKWT();
    }

    function renderKWT() {
        const container = document.getElementById('kwtList'); 
        if (!container) return; 
        
        container.innerHTML = '';
        
        let filteredItems = kwtItemsDb.filter(item => item.dept === currentKwtDept);
        
        if (filteredItems.length === 0) {
            container.innerHTML = '<div style="color:#666; font-size:0.9rem; grid-column:1/-1; text-align:center; margin-top:20px;">Brak towarów przypisanych do tego działu.</div>';
            return;
        }
        
        filteredItems.forEach(item => {
            const saved = kwtLiveDb[item.id] || { status: 'none', time: '', user: '' };
            const isDone = saved.status === 'done';
            
            const card = document.createElement('div'); 
            card.className = `item-card ${isDone ? 'card-done' : ''}`;
            
            card.innerHTML = `
                <h3>${item.name}</h3>
                <div class="status-row">
                    <div class="dot"></div>
                    <span>${isDone ? 'ZESKANOWANO: ' + saved.time + '<br><span style="color:#666; font-size:0.65rem; display:block; margin-top:3px;">(' + saved.user + ')</span>' : 'DO SPRAWDZENIA'}</span>
                </div>
                <button class="approve-btn" onclick="toggleKWT('${item.id}')">${isDone ? 'WYCOFAJ' : 'ZATWIERDŹ'}</button>
            `;
            container.appendChild(card);
        });
    }

    function toggleKWT(id) {
        const saved = kwtLiveDb[id] || { status: 'none', time: '' };
        
        if (saved.status === 'done') { 
            if (confirm("Na pewno chcesz wycofać potwiedzenie KWT?")) { db.ref(`Stores/${myStore}/KWT/${id}`).remove(); } 
            return; 
        }
        
        const now = new Date(); 
        const timeStr = now.toLocaleDateString('pl-PL') + ' | ' + now.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'});
        
        db.ref(`Stores/${myStore}/KWT/${id}`).set({ status: 'done', time: timeStr, user: currentUser.name });
    }

    // ==========================================
    // SYSTEM ZARZĄDZANIA (EDYCJI) TOWARAMI KWT (NAPRAWIONY!)
    // ==========================================
    function openManageKwtModal() {
        document.getElementById('manageKwtModal').style.display = 'flex';
        renderManageList();
    }

    function closeManageKwtModal() {
        document.getElementById('manageKwtModal').style.display = 'none';
    }

    function renderManageList() {
        const dept = document.getElementById('manageDeptSelect').value;
        const container = document.getElementById('manageKwtList');
        
        // Czyścimy starą zawartość
        container.innerHTML = '';
        
        let filtered = kwtItemsDb.filter(i => i.dept === dept);
        
        if(filtered.length === 0) {
            container.innerHTML = '<div style="color:#666; text-align:center; padding:10px;">Brak pozycji dla tego działu. Dodaj pierwszą.</div>';
            return;
        }

        // BARDZO BEZPIECZNE RENDEROWANIE - ODPORNE NA APOSTROFY I INNE ZNAKI
        filtered.forEach(item => {
            const row = document.createElement('div');
            row.className = 'manage-item-row';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'manage-item-name';
            nameDiv.innerText = item.name;
            
            const btnsDiv = document.createElement('div');
            btnsDiv.className = 'manage-btns';
            
            const btnEdit = document.createElement('button');
            btnEdit.className = 'btn-mini-edit';
            btnEdit.innerText = 'EDYTUJ';
            btnEdit.onclick = function() { editKwtItem(item.id, item.name); };
            
            const btnDel = document.createElement('button');
            btnDel.className = 'btn-mini-del';
            btnDel.innerText = 'USUŃ';
            btnDel.onclick = function() { deleteKwtItem(item.id); };
            
            btnsDiv.appendChild(btnEdit);
            btnsDiv.appendChild(btnDel);
            
            row.appendChild(nameDiv);
            row.appendChild(btnsDiv);
            
            container.appendChild(row);
        });
    }

    function addKwtItem() {
        const input = document.getElementById('newKwtItemName');
        const dept = document.getElementById('manageDeptSelect').value;
        const name = input.value.trim();
        
        if (!name) { alert("Wpisz nazwę towaru!"); return; }
        
        const newId = `kwt_${dept}_${Date.now()}`;
        
        db.ref(`Stores/${myStore}/KWT_Items/${newId}`).set({
            id: newId,
            name: name,
            dept: dept
        }).then(() => {
            input.value = '';
        });
    }

    function deleteKwtItem(id) {
        if(confirm("Czy na pewno chcesz na zawsze USUNĄĆ ten towar z listy KWT?")) {
            db.ref(`Stores/${myStore}/KWT_Items/${id}`).remove();
            db.ref(`Stores/${myStore}/KWT/${id}`).remove();
        }
    }

    function editKwtItem(id, currentName) {
        const newName = prompt("Wpisz nową nazwę dla tego towaru:", currentName);
        if (newName && newName.trim() !== "" && newName !== currentName) {
            db.ref(`Stores/${myStore}/KWT_Items/${id}`).update({
                name: newName.trim()
            });
        }
    }

    // ==========================================
    // INNE FUNKCJE
    // ==========================================
    function resetAllKWT() {
        if(confirm("🛑 OSTRZEŻENIE 🛑\n\nCzy na pewno chcesz bezpowrotnie usunąć i ZRESETOWAĆ wszystkie statusy KWT ze wszystkich działów?\nZrób to tylko, jeśli zaczynacie nowy tydzień kontroli!")) {
            document.getElementById('loadingData').style.display = 'flex';
            
            db.ref(`Stores/${myStore}/KWT`).remove().then(() => {
                document.getElementById('loadingData').style.display = 'none';
                document.getElementById('globalPopupTitle').innerText = "KWT ZRESETOWANE";
                document.getElementById('globalPopupMsg').innerText = "Wyczyszczono statusy KWT ze wszystkich działów. Możecie zaczynać nowy tydzień.";
                document.getElementById('popupBox').style.borderColor = '#0a0';
                document.getElementById('globalPopupTitle').style.color = '#0a0';
                document.getElementById('globalNotificationModal').style.display = 'flex';
            }).catch(err => {
                document.getElementById('loadingData').style.display = 'none';
                alert("Błąd podczas resetowania: " + err.message);
            });
        }
    }

    db.ref(`Stores/${myStore}/Notifications`).on('value', snap => {
        let notifsObj = snap.val() || {}; 
        let notifs = Object.keys(notifsObj).map(key => ({ keyId: key, ...notifsObj[key] }));
        let myUnread = notifs.filter(n => !n.read && (n.to === currentUser.charId || (n.to === 'KSS' && isManagerOrKss)));
        
        if (myUnread.length > 0) {
            let n = myUnread[0]; 
            document.getElementById('globalPopupTitle').innerText = n.title; 
            document.getElementById('globalPopupMsg').innerText = n.msg; 
            document.getElementById('globalNotificationModal').style.display = 'flex';
            
            let box = document.getElementById('popupBox');
            if(n.type === 'success') { box.style.borderColor = '#0a0'; document.getElementById('globalPopupTitle').style.color = '#0a0'; } 
            else if(n.type === 'error') { box.style.borderColor = '#f44'; document.getElementById('globalPopupTitle').style.color = '#f44'; } 
            else { box.style.borderColor = '#ffe800'; document.getElementById('globalPopupTitle').style.color = '#ffe800'; }
            
            db.ref(`Stores/${myStore}/Notifications/${n.keyId}`).update({ read: true });
        }
    });

    if(isManagerOrKss) {
        const d = new Date();
        const yearNow = 2026;
        const monthNow = d.getMonth();
        
        db.ref(`Stores/${myStore}/Inwentury/${yearNow}_${monthNow}`).on('value', snap => {
            let hasAwaiting = false;
            snap.forEach(item => {
                if(item.val().status === 'awaiting_kss') {
                    hasAwaiting = true;
                }
            });
            let badge = document.getElementById('kssAlertBadge'); 
            if(badge) badge.innerHTML = hasAwaiting ? `<span class="nav-alert">[!]</span>` : '';
        });
    }

    function closeGlobalPopup() { document.getElementById('globalNotificationModal').style.display = 'none'; }

    // Ustaw czas bezczynności w minutach
    const minutyBezczynnosci = 5; 
    const limitCzasu = minutyBezczynnosci * 60 * 1000; 
    let timerBezczynnosci;

    function resetujTimer() {
        clearTimeout(timerBezczynnosci);
        timerBezczynnosci = setTimeout(wylogujZPowoduBezczynnosci, limitCzasu);
    }

    function wylogujZPowoduBezczynnosci() {
        localStorage.removeItem('currentUser');
        sessionStorage.setItem('powodWylogowania', 'bezczynnosc');
        window.location.href = 'login.html';
    }

    const akcjeUzytkownika = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
    akcjeUzytkownika.forEach(akcja => { document.addEventListener(akcja, resetujTimer, { passive: true }); });
    resetujTimer();
</script>
</body>
</html>
