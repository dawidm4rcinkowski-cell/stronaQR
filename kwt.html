<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - KWT</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const storeSetup = JSON.parse(localStorage.getItem('store_setup'));
        if (!currentUser || !storeSetup) { window.location.href = 'login.html'; }
        const isManagerOrKss = (currentUser.dept === 'ME' || currentUser.isKss);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 3px; }
        .store-badge { font-size: 0.7rem; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 20px; font-weight: 800; border: 1px solid #000; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-header { color: #ffe800; font-weight: 900; font-size: 1rem; padding: 0 25px 15px 25px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        .user-profile { padding: 15px 20px; border-top: 2px solid #1a1a1a; display: flex; align-items: center; gap: 15px; cursor: pointer; background: #0f0f0f; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0;}
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 900; font-size: 0.85rem; color: #fff; }
        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; }
        .logout-btn { display: block; width: 100%; text-align: center; background: transparent; color: #f44; border: none; border-top: 1px solid #1a1a1a; padding: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }
        .content { flex-grow: 1; overflow-y: auto; padding: 30px 20px; }
        .content-inner { max-width: 1400px; margin: 0 auto; }
        .page-title { font-size: 2rem; font-weight: 900; margin-bottom: 30px; text-transform: uppercase; }
        .page-title span { color: #ffe800; }
        .dept-tabs { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { background: #151515; border: 1px solid #333; color: #fff; padding: 12px 30px; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 0.9rem; flex: 1; max-width: 200px; }
        .tab-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .item-card { background: #111; border: 1px solid #222; border-radius: 15px; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .item-card h3 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; min-height: 2.5rem; color: #eee; }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.75rem; font-weight: 800; color: #888; }
        .dot { width: 10px; height: 10px; background: #ff4444; border-radius: 50%; }
        .card-done { border-color: #0a0; background: #0a110a; } .card-done .dot { background: #0a0; } .card-done .status-row span { color: #0a0; }
        .approve-btn { width: 100%; background: transparent; border: 2px solid #ffe800; color: #ffe800; padding: 10px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .card-done .approve-btn { border-color: #0a0; color: #0a0; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">EXPERT <span>TOOL</span> <div class="store-badge" id="headerStore">SXXX</div></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
        <div class="sidebar-header">Nawigacja</div>
        <a href="index.html" class="sidebar-link">Strona główna</a>
        <a href="plan.html" class="sidebar-link">Plan pracy</a>
        <a href="inwa.html" class="sidebar-link">Inwentury</a>
        <a href="inwak.html" class="sidebar-link" id="navInwaKSS">Inwentury (ME/KSS)</a>
        <a href="azs.html" class="sidebar-link">AZS</a>
        <a href="kwt.html" class="sidebar-link" style="color:#ffe800">KWT</a>
        <a href="qr.html" class="sidebar-link">Kod QR</a>
    </div>
    <div class="user-profile" onclick="window.location.href='ustawienia.html'">
        <div class="user-avatar" id="sideAvatar">?</div>
        <div class="user-info">
            <span class="user-name" id="sideName">Ladowanie...</span>
            <span class="user-settings">⚙️ Ustawienia konta</span>
        </div>
    </div>
    <button class="logout-btn" onclick="logout()">Wyloguj się</button>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="content">
    <div class="content-inner">
        <h1 class="page-title">KONTROLA WYSTAWIONYCH <span>TOWARÓW (KWT)</span></h1>
        <div class="dept-tabs">
            <button class="tab-btn active" onclick="filterKwtDept('it', this)">DZIAŁ IT</button>
            <button class="tab-btn" onclick="filterKwtDept('rtv', this)">DZIAŁ RTV</button>
            <button class="tab-btn" onclick="filterKwtDept('agd', this)">DZIAŁ AGD</button>
        </div>
        <div id="kwtList" class="items-grid"></div>
    </div>
</div>

<script>
    document.getElementById('headerStore').innerText = `${storeSetup.sNumber} ${storeSetup.city}`;
    document.getElementById('sideName').innerText = `${currentUser.name} (${currentUser.dept})`;
    document.getElementById('sideAvatar').innerText = currentUser.charId.charAt(0);
    if(!isManagerOrKss) { document.getElementById('navInwaKSS').style.display = 'none'; }
    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    const kwtData = [
        { id: "kwt_it_1", name: "Drukarki atramentowe", dept: "it" }, { id: "kwt_it_2", name: "Słuchawki Douszne", dept: "it" },
        { id: "kwt_it_3", name: "Słuchawki Truewirless", dept: "it" }, { id: "kwt_it_4", name: "Głośniki mobilne", dept: "it" },
        { id: "kwt_it_5", name: "Smartfony", dept: "it" }, { id: "kwt_it_6", name: "Smartwatche i smartbandy", dept: "it" },
        { id: "kwt_it_7", name: "Ładowarki sieciowe", dept: "it" }, { id: "kwt_it_8", name: "Słuchawki nauszne i uniwersalne", dept: "it" },
        { id: "kwt_it_9", name: "Urządzenia wielofunkcyjne atramentowe", dept: "it" }, { id: "kwt_it_10", name: "Notebooki uniwersalne", dept: "it" },
        { id: "kwt_rtv_1", name: "Klocki", dept: "rtv" }, { id: "kwt_rtv_2", name: "Akcesoria do konsol", dept: "rtv" },
        { id: "kwt_agd_1", name: "Ekspresy Automatyczne", dept: "agd" }, { id: "kwt_agd_2", name: "Depilatory Świetlne", dept: "agd" }
    ];

    let currentKwtDept = 'it';
    function filterKwtDept(dept, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentKwtDept = dept; renderKWT();
    }
    function renderKWT() {
        const container = document.getElementById('kwtList'); if (!container) return; container.innerHTML = '';
        kwtData.filter(item => item.dept === currentKwtDept).forEach(item => {
            const saved = JSON.parse(localStorage.getItem(item.id)) || { status: 'none', time: '' };
            const isDone = saved.status === 'done';
            const card = document.createElement('div'); card.className = `item-card ${isDone ? 'card-done' : ''}`;
            card.innerHTML = `<h3>${item.name}</h3><div class="status-row"><div class="dot"></div><span>${isDone ? 'ZESKANOWANO: ' + saved.time : 'DO SPRAWDZENIA'}</span></div><button class="approve-btn" onclick="toggleKWT('${item.id}')">${isDone ? 'WYCOFAJ' : 'ZATWIERDŹ'}</button>`;
            container.appendChild(card);
        });
    }
    function toggleKWT(id) {
        const saved = JSON.parse(localStorage.getItem(id)) || { status: 'none', time: '' };
        if (saved.status === 'done') { if (confirm("Wycofać potwiedzenie?")) { localStorage.removeItem(id); renderKWT(); } return; }
        const now = new Date(); const timeStr = now.toLocaleDateString('pl-PL') + ' | ' + now.toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'});
        localStorage.setItem(id, JSON.stringify({ status: 'done', time: timeStr })); renderKWT();
    }
    window.onload = renderKWT;
</script>
</body>
</html>
