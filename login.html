<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Logowanie</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23ffe800'/><path d='M75.6,24.4c-9.1-9.1-23.9-9.1-33,0c-7.3,7.3-8.8,17.7-4.7,26.5L12.4,76.4c-1.6,1.6-1.6,4.1,0,5.7l5.5,5.5c1.6,1.6,4.1,1.6,5.7,0l25.5-25.5c8.8,4.1,19.2,2.6,26.5-4.7C84.7,48.3,84.7,33.5,75.6,24.4z M66.8,41.2c-3.1,3.1-8.2,3.1-11.3,0s-3.1-8.2,0-11.3s8.2-3.1,11.3,0S69.9,38.1,66.8,41.2z' fill='%23000'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0N6Bjyzs34piOoujEn9mxKir8LDGdD2k",
            authDomain: "expert-tool.firebaseapp.com",
            databaseURL: "https://expert-tool-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "expert-tool",
            storageBucket: "expert-tool.firebasestorage.app",
            messagingSenderId: "880843997228",
            appId: "1:880843997228:web:fa37aa80b7f9f017705189"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        
        body {
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 232, 0, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-position: center center;
            color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; flex-direction: column;
        }

        .login-wrapper { width: 100%; max-width: 400px; padding: 20px; z-index: 10; }
        .login-box { background: #0a0a0a; border: 2px solid #222; padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,232,0,0.02); position: relative; text-align: center; transition: 0.3s; }
        .login-box:hover { border-color: #ffe800; box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255,232,0,0.1); }

        .logo { color: #fff; font-weight: 900; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .logo span { background: #ffe800; color: #000; padding: 2px 10px; border-radius: 5px; user-select: none; cursor: default; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 0.75rem; color: #888; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .form-input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 10px; font-size: 1rem; font-weight: bold; outline: none; transition: 0.3s; text-transform: uppercase; }
        .form-input:focus { border-color: #ffe800; background: #151515; }
        .form-input::placeholder { color: #444; font-weight: normal; text-transform: none; }

        .btn-login { width: 100%; background: #ffe800; color: #000; border: none; padding: 16px; font-weight: 900; border-radius: 10px; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; font-size: 1rem; letter-spacing: 1px; }
        .btn-login:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 232, 0, 0.3); }
        .btn-login:disabled { background: #333; color: #666; cursor: not-allowed; }

        .msg-box { padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; text-align: center; display: none; margin-top: 20px; }
        .msg-error { background: rgba(255, 68, 68, 0.1); border: 1px solid #f44; color: #f44; }
        .msg-success { background: rgba(0, 170, 0, 0.1); border: 1px solid #0a0; color: #0a0; }

        .footer-text { margin-top: 30px; font-size: 0.65rem; color: #555; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo">EXPERT <span onclick="triggerSecretAdmin()">TOOL</span></div>
            
            <div class="input-group">
                <label>Numer Sklepu</label>
                <input type="text" class="form-input" id="storeNum" placeholder="np. S255" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>Twój CharID</label>
                <input type="text" class="form-input" id="charId" placeholder="" autocomplete="off">
            </div>
            
            <div class="input-group" style="margin-bottom: 10px;">
                <label>Hasło</label>
                <input type="password" class="form-input" id="password" placeholder="Wpisz hasło" style="text-transform: none;">
            </div>

            <div id="loginMsg" class="msg-box"></div>

            <button class="btn-login" id="loginBtn" onclick="attemptLogin()">ZALOGUJ SIĘ</button>
        </div>
        
        <div class="footer-text">System Zarządzania Sklepem &copy; 2026</div>
    </div>

    <script>
        window.onload = () => {
            if(localStorage.getItem('currentUser') && localStorage.getItem('myStore')) {
                window.location.href = 'index.html';
            }
        };

        let secretClicks = 0;
        let secretTimer = null;

        function triggerSecretAdmin() {
            secretClicks++;
            clearTimeout(secretTimer);
            if (secretClicks >= 5) {
                window.location.href = 'superadmin.html';
            } else {
                secretTimer = setTimeout(() => { secretClicks = 0; }, 1000);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") { attemptLogin(); }
        });

        async function attemptLogin() {
            let storeNum = document.getElementById('storeNum').value.trim().toUpperCase().replace(/\s+/g, '');
            let inputCharId = document.getElementById('charId').value.trim().toUpperCase().replace(/\s+/g, '');
            let password = document.getElementById('password').value.trim();
            let msgBox = document.getElementById('loginMsg');
            let btn = document.getElementById('loginBtn');

            msgBox.style.display = 'block';
            msgBox.className = 'msg-box';

            if (!storeNum || !inputCharId || !password) {
                msgBox.classList.add('msg-error');
                msgBox.innerText = "Uzupełnij wszystkie pola!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "WERYFIKACJA...";

            try {
                const storeSnap = await db.ref(`Stores/${storeNum}`).once('value');
                if (!storeSnap.exists()) {
                    msgBox.classList.add('msg-error');
                    msgBox.innerText = "Taki sklep nie istnieje w bazie!";
                    btn.disabled = false; btn.innerText = "ZALOGUJ SIĘ"; return;
                }

                const userSnap = await db.ref(`Stores/${storeNum}/Users/${inputCharId}`).once('value');
                if (!userSnap.exists()) {
                    msgBox.classList.add('msg-error');
                    msgBox.innerText = "Błędny Kod Logowania (CharID)!";
                    btn.disabled = false; btn.innerText = "ZALOGUJ SIĘ"; return;
                }

                const userData = userSnap.val();

                if (userData.password !== password) {
                    msgBox.classList.add('msg-error');
                    msgBox.innerText = "Podano błędne hasło!";
                    btn.disabled = false; btn.innerText = "ZALOGUJ SIĘ"; return;
                }

                msgBox.classList.add('msg-success');
                msgBox.innerText = "Logowanie poprawne!";
                
                // TU BYŁ BŁĄD. Bierzemy charId z wpisanego okienka (inputCharId), a nie z bazy!
                const secureUserData = {
                    charId: inputCharId, 
                    name: userData.name || "Nieznany",
                    dept: userData.dept || "ME",
                    isKss: userData.isKss || false,
                    avatar: userData.avatar || ""
                };

                localStorage.setItem('myStore', storeNum);
                localStorage.setItem('currentUser', JSON.stringify(secureUserData));

                setTimeout(() => { window.location.href = 'index.html'; }, 500);

            } catch (error) {
                msgBox.classList.add('msg-error');
                msgBox.innerText = "Błąd połączenia z bazą danych!";
                btn.disabled = false; btn.innerText = "ZALOGUJ SIĘ";
            }
        }
    </script>
</body>
</html>
