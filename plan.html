<script>
    // INICJALIZACJA PODSTAWOWYCH INFORMACJI O UŻYTKOWNIKU
    document.getElementById('headerStore').innerText = myStore;
    
    let finalDept = currentUser.dept;
    if (currentUser.isKss && currentUser.dept !== 'ME') {
        finalDept = 'KSS';
    }
    
    document.getElementById('sideName').innerText = `${currentUser.name} (${finalDept})`;
    document.getElementById('sideAvatar').innerText = currentUser.charId.charAt(0);

    if (!isManagerOrKss) {
        document.getElementById('navInwaKSS').style.display = 'none';
        document.getElementById('adminControlsPanel').style.display = 'none';
        document.getElementById('employeeControlsPanel').style.display = 'flex';
    }

    const year = 2026;
    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    let curM = new Date().getMonth(); 
    
    // USTAWIENIA DNI WOLNYCH I NIEDZIEL HANDLOWYCH
    const holidays2026 = ["1-1", "1-6", "4-5", "4-6", "5-1", "5-3", "5-24", "6-4", "8-15", "11-1", "11-11", "12-25", "12-26"];
    const tradingSundays2026 = ["1-25", "3-29", "4-26", "6-28", "8-30", "12-13", "12-20"]; 

    // BAZA DANYCH W PAMIĘCI RAM (Kopie z Firebase)
    let localPlanData = {};
    let localPlanMeta = { norm: 160, locked: false, globalShifts: "10-18, 12-20, 10-20" };
    let employees = [];
    let planListener = null;
    let metaListener = null;

    // 1. ZACIĄGANIE EKIPY Z FIREBASE I PODWÓJNE SORTOWANIE (Dział -> Alfabetycznie)
    db.ref(`Stores/${myStore}/Users`).on('value', snap => {
        const usersObj = snap.val() || {};
        
        let rawUsers = Object.keys(usersObj).map(key => ({
            charId: key, 
            ...usersObj[key] 
        })).filter(u => u.charId !== 'ADMIN');
        
        const deptRank = { 'ME': 1, 'KSS': 2, 'POK': 3, 'IT': 4, 'AGD': 5, 'RTV': 6 };
        
        rawUsers.forEach(u => {
            if (u.isKss && u.dept !== 'ME') {
                u.displayDept = 'KSS';
            } else {
                u.displayDept = u.dept;
            }
        });

        // DWUPOZIOMOWE SORTOWANIE
        rawUsers.sort((a, b) => {
            let rankA = deptRank[a.displayDept] || 99;
            let rankB = deptRank[b.displayDept] || 99;
            
            // Jeśli mają ten sam dział, sortujemy alfabetycznie po imieniu
            if (rankA === rankB) {
                return a.name.localeCompare(b.name, 'pl');
            }
            // W przeciwnym razie sortujemy według hierarchii działów
            return rankA - rankB;
        });

        employees = rawUsers.map(u => ({
            n: u.name, 
            i: u.charId.charAt(0), 
            p: u.dept === 'POK', 
            dept: u.dept, 
            displayDept: u.displayDept,
            charId: u.charId 
        }));
        
        render(); 
    });

    // 2. FUNKCJA ZMIANY MIESIĄCA (ODŚWIEŻENIE FIREBASE LISENERS)
    function setMonth(i) { 
        curM = i; 
        document.getElementById('loadingData').style.display = 'flex';
        renderMonths(); 
        
        // Odepnij stare nasłuchiwanie z poprzedniego miesiąca, żeby nie zżerało danych transferowych
        if (planListener) {
            db.ref(`Stores/${myStore}/Plan/${year}_${curM}`).off('value', planListener);
        }
        if (metaListener) {
            db.ref(`Stores/${myStore}/PlanMeta/${year}_${curM}`).off('value', metaListener);
        }

        // Podepnij nasłuch na nowy miesiąc
        planListener = db.ref(`Stores/${myStore}/Plan/${year}_${curM}`).on('value', snap => {
            localPlanData = snap.val() || {};
            document.getElementById('loadingData').style.display = 'none';
            render();
        });

        metaListener = db.ref(`Stores/${myStore}/PlanMeta/${year}_${curM}`).on('value', snap => {
            const meta = snap.val() || {};
            localPlanMeta.norm = meta.norm || 160;
            localPlanMeta.locked = meta.locked || false;
            localPlanMeta.globalShifts = meta.globalShifts || "10-18, 12-20, 10-20";
            
            if (document.getElementById('hourNormInput')) {
                document.getElementById('hourNormInput').value = localPlanMeta.norm;
            }
            if (document.getElementById('globalShifts')) {
                document.getElementById('globalShifts').value = localPlanMeta.globalShifts;
            }
            
            employees.forEach(e => {
                localPlanMeta[`set_z_${e.charId}`] = meta[`set_z_${e.charId}`] || "";
                localPlanMeta[`set_u1_${e.charId}`] = meta[`set_u1_${e.charId}`] || "";
                localPlanMeta[`set_u2_${e.charId}`] = meta[`set_u2_${e.charId}`] || "";
            });
            
            render();
        });
    }

    function renderMonths() { 
        const div = document.getElementById('monthSelector'); 
        div.innerHTML = ""; 
        months.forEach((m, i) => { 
            const b = document.createElement('button'); 
            b.className = `month-btn ${i === curM ? 'active' : ''}`; 
            b.innerText = m; 
            b.onclick = () => setMonth(i); 
            div.appendChild(b); 
        }); 
    }

    // NARZĘDZIA DO OPERACJI NA DNACH I TABELACH
    function isWorkDay(d) { 
        let ds = `${curM+1}-${d}`; 
        if (holidays2026.includes(ds)) return false; 
        if (new Date(year, curM, d).getDay() === 0 && !tradingSundays2026.includes(ds)) return false; 
        return true; 
    }

    function getShiftOnly(charId, d) { 
        return (localPlanData[`${charId}_${d}`] || "").split('|')[0] || ""; 
    }

    function getRolesOnly(charId, d) { 
        let v = localPlanData[`${charId}_${d}`] || ""; 
        return v.split('|')[1] ? v.split('|')[1].split(',') : []; 
    }
    
    function saveToFirebase(updates) { 
        db.ref(`Stores/${myStore}/Plan/${year}_${curM}`).update(updates); 
    }

    // LOGIKA MODALU EDYCJI KOMÓRKI
    let currentEditCharId = null; 
    let currentEditName = null; 
    let currentEditDay = null;

    function openEditModal(empName, charId, day) {
        if (!isManagerOrKss) return; 
        if (localPlanMeta.locked === true) return;
        
        currentEditName = empName; 
        currentEditCharId = charId; 
        currentEditDay = day;
        
        let shift = getShiftOnly(charId, day); 
        let roles = getRolesOnly(charId, day);
        
        document.getElementById('cellModalTitle').innerText = `${empName} - DZIEŃ ${day}`;
        document.getElementById('modalCustomShift').value = shift;
        
        document.querySelectorAll('.btn-shift').forEach(b => { 
            b.classList.remove('active'); 
            if (b.innerText === shift) {
                b.classList.add('active'); 
            }
        });
        
        document.getElementById('modalRoleK').checked = roles.includes('K'); 
        document.getElementById('modalRoleD').checked = roles.includes('D'); 
        document.getElementById('modalRoleS').checked = roles.includes('S');
        
        document.getElementById('cellEditModal').style.display = 'flex';
    }

    function setModalShift(val, btn) { 
        document.getElementById('modalCustomShift').value = val; 
        document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
    }

    function clearShiftButtons() { 
        document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); 
    }

    function closeCellModal() { 
        document.getElementById('cellEditModal').style.display = 'none'; 
    }

    function clearCell() { 
        saveToFirebase({ [`${currentEditCharId}_${currentEditDay}`]: null }); 
        closeCellModal(); 
    }
    
    function saveCellModal() {
        let shift = document.getElementById('modalCustomShift').value.trim().toUpperCase(); 
        let roles = [];
        
        if (document.getElementById('modalRoleK').checked) roles.push('K'); 
        if (document.getElementById('modalRoleD').checked) roles.push('D'); 
        if (document.getElementById('modalRoleS').checked) roles.push('S');
        
        let finalVal = shift; 
        if (roles.length > 0 && shift !== "" && shift !== "WOLNE" && shift !== "URLOP" && shift !== "Ż" && shift !== "SZK") {
            finalVal += '|' + roles.join(',');
        }
        
        saveToFirebase({ [`${currentEditCharId}_${currentEditDay}`]: finalVal || null });
        closeCellModal();
    }

    // GLOBALNE AKCJE ADMINA
    function saveNorm(v) { 
        db.ref(`Stores/${myStore}/PlanMeta/${year}_${curM}`).update({ norm: parseInt(v) }); 
    }

    function toggleApprove() { 
        let locked = localPlanMeta.locked === true; 
        db.ref(`Stores/${myStore}/PlanMeta/${year}_${curM}`).update({ locked: !locked }); 
    }
    
    function clearMonth() { 
        if (localPlanMeta.locked === true) return; 
        if (confirm("Wyczyścić z chmury cały wygenerowany grafik? (Urlopy, szkolenia i życzenia zostaną nienaruszone!)")) { 
            const daysInMonth = new Date(year, curM + 1, 0).getDate(); 
            let updates = {};
            
            employees.forEach(e => { 
                if (e.dept === 'ME') return; 
                for (let d = 1; d <= daysInMonth; d++) { 
                    let s = getShiftOnly(e.charId, d); 
                    if (s !== "URLOP" && s !== "Ż" && s !== "SZK") {
                        updates[`${e.charId}_${d}`] = null; 
                    }
                } 
            }); 
            
            saveToFirebase(updates);
        } 
    }

    // ALGORYTM GENERATORA (ROZSZERZONY, CZYTELNY)
    function calcRealH(charId) { 
        let h = 0; 
        for (let d = 1; d <= 31; d++) { 
            let s = getShiftOnly(charId, d); 
            if (s.includes('-')) { 
                let p = s.split('-'); 
                h += (parseInt(p[1]) || 0) - (parseInt(p[0]) || 0); 
            } else if (s === "URLOP" || s === "SZK") {
                h += 8; 
            } 
        } 
        return h; 
    }

    function getStreak(charId, day) { 
        let s = 0; 
        for (let d = day - 1; d >= 1; d--) { 
            let st = getShiftOnly(charId, d); 
            if (st.includes('-') || st === "URLOP" || st === "SZK") {
                s++; 
            } else {
                break;
            }
        } 
        for (let d = day + 1; d <= 31; d++) { 
            let st = getShiftOnly(charId, d); 
            if (st.includes('-') || st === "URLOP" || st === "SZK") {
                s++; 
            } else {
                break;
            }
        } 
        return s; 
    }

    function shuffle(array) { 
        for (let i = array.length - 1; i > 0; i--) { 
            const j = Math.floor(Math.random() * (i + 1)); 
            [array[i], array[j]] = [array[j], array[i]]; 
        } 
        return array; 
    }

    function startGeneration() {
        if (localPlanMeta.locked === true) return;
        
        const baseNorm = parseInt(document.getElementById('hourNormInput').value);
        const shifts = document.getElementById('globalShifts').value.split(',').map(s => s.trim());
        const openShift = shifts[0] || "10-18"; 
        const closeShift = shifts[1] || "12-20"; 
        const fullShift = shifts[2] || "10-20"; 
        const satShift = "10-20";
        const daysInMonth = new Date(year, curM + 1, 0).getDate();

        let genUpdates = {};
        
        // Funkcja pomocnicza symulująca zapis w pamięci, by generator czytał swoje własne zmiany z poprzedniego kroku
        function setTemp(charId, d, v) { 
            genUpdates[`${charId}_${d}`] = v; 
            localPlanData[`${charId}_${d}`] = v; 
        }

        // 1. CZYSZCZENIE STARYCH ZMIAN (Oprócz urlopów)
        employees.forEach(e => { 
            if (e.dept !== 'ME') { 
                for (let d = 1; d <= daysInMonth; d++) { 
                    let s = getShiftOnly(e.charId, d); 
                    if (s.includes('-') || s === "WOLNE") {
                        setTemp(e.charId, d, ""); 
                    }
                } 
            } 
        });
        
        // 2. OBSADZANIE SOBÓT I NIEDZIEL HANDLOWYCH
        let sats = []; 
        for (let d = 1; d <= daysInMonth; d++) { 
            if (new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) {
                sats.push(d); 
            }
        }
        
        sats.forEach(d => {
            let available = employees.filter(e => getShiftOnly(e.charId, d) === "" && e.dept !== 'ME'); 
            shuffle(available);
            
            let toWork = []; 
            let poks = available.filter(e => e.p); 
            let sales = available.filter(e => !e.p); 
            let totalNeeded = 6;
            
            if (poks.length > 0) { 
                toWork.push({ e: poks[0], shift: satShift }); 
                if (poks.length > 1) {
                    sales.push(poks[1]); 
                }
                totalNeeded--; 
            }
            
            let it = sales.find(e => e.dept === 'IT'); 
            if (it) { 
                toWork.push({ e: it, shift: satShift }); 
                sales = sales.filter(e => e.charId !== it.charId); 
                totalNeeded--; 
            }
            
            let agd = sales.find(e => e.dept === 'AGD'); 
            if (agd) { 
                toWork.push({ e: agd, shift: satShift }); 
                sales = sales.filter(e => e.charId !== agd.charId); 
                totalNeeded--; 
            }
            
            for (let i = 0; i < totalNeeded && sales.length > 0; i++) { 
                toWork.push({ e: sales[0], shift: satShift }); 
                sales.shift(); 
            }
            
            toWork.forEach(w => setTemp(w.e.charId, d, w.shift));
        });

        // 3. OBSADZANIE DNI POWSZEDNICH (PON-PT)
        for (let d = 1; d <= daysInMonth; d++) {
            if (new Date(year, curM, d).getDay() === 6 || !isWorkDay(d)) continue;
            
            let available = employees.filter(e => getShiftOnly(e.charId, d) === "" && getStreak(e.charId, d) < 5 && e.dept !== 'ME'); 
            shuffle(available);
            
            let poks = available.filter(e => e.p); 
            let sales = available.filter(e => !e.p);
            
            if (poks.length === 1) { 
                setTemp(poks[0].charId, d, fullShift); 
            } else if (poks.length > 1) { 
                setTemp(poks[0].charId, d, openShift); 
                setTemp(poks[1].charId, d, closeShift); 
            }
            
            let otwNeeded = 3; 
            let zamNeeded = 3;
            
            let assignSale = (emp, isOtw) => { 
                if (isOtw) { 
                    setTemp(emp.charId, d, openShift); 
                    otwNeeded--; 
                } else { 
                    setTemp(emp.charId, d, closeShift); 
                    zamNeeded--; 
                } 
                sales = sales.filter(e => e.charId !== emp.charId); 
            };
            
            let it = sales.find(e => e.dept === 'IT'); 
            if (it) assignSale(it, true); 
            
            let agd = sales.find(e => e.dept === 'AGD'); 
            if (agd) assignSale(agd, false); 
            
            for (let i = 0; i < sales.length && (otwNeeded > 0 || zamNeeded > 0); i++) { 
                if (otwNeeded > 0) { 
                    assignSale(sales[i], true); 
                    i--; 
                } else if (zamNeeded > 0) { 
                    assignSale(sales[i], false); 
                    i--; 
                } 
            }
        }

        // 4. BALANSOWANIE GODZIN DO NORMY
        let allBalanced = false; 
        let iterations = 0;
        
        while (!allBalanced && iterations < 3000) {
            allBalanced = true; 
            let status = employees.map(e => ({ 
                e: e, 
                target: baseNorm, 
                current: calcRealH(e.charId), 
                diff: baseNorm - calcRealH(e.charId) 
            }));
            
            shuffle(status); 
            status.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));

            for (let st of status) {
                if (st.diff === 0 || st.e.dept === 'ME') continue; 
                
                allBalanced = false; 
                let emp = st.e; 
                let done = false;
                
                if (st.diff > 0) {
                    // Pracownik ma za mało godzin - szukamy wolnego dnia na dołożenie zmiany Open
                    for (let d = 1; d <= daysInMonth; d++) { 
                        if (isWorkDay(d) && getShiftOnly(emp.charId, d) === "" && getStreak(emp.charId, d) < 5) { 
                            setTemp(emp.charId, d, openShift); 
                            done = true; 
                            break; 
                        } 
                    }
                } else if (st.diff < 0) {
                    // Pracownik ma za dużo godzin - usuwamy jakąś zmianę
                    for (let d = 1; d <= daysInMonth; d++) { 
                        let s = getShiftOnly(emp.charId, d); 
                        if (s === openShift || s === closeShift || s === fullShift) { 
                            setTemp(emp.charId, d, ""); 
                            done = true; 
                            break; 
                        } 
                    }
                }
                
                if (done) break;
            } 
            iterations++;
        }
        
        // ZAPIS W CHMURZE FIREBASE
        saveToFirebase(genUpdates);
    }

    // GŁÓWNA FUNKCJA RENDERUJĄCA TABELĘ
    function render() {
        if (employees.length === 0) return; 
        
        const daysInMonth = new Date(year, curM + 1, 0).getDate(); 
        const body = document.getElementById('daysBody'); 
        const head = document.getElementById('workerRow');
        const baseNorm = localPlanMeta.norm;
        const isLocked = localPlanMeta.locked === true;
        
        if (isManagerOrKss) {
            const genBtn = document.getElementById('genBtn'); 
            const clrBtn = document.getElementById('clearBtn'); 
            const appBtn = document.getElementById('approveBtn');
            
            genBtn.disabled = isLocked; 
            clrBtn.disabled = isLocked; 
            genBtn.style.opacity = isLocked ? '0.3' : '1'; 
            clrBtn.style.opacity = isLocked ? '0.3' : '1';
            
            appBtn.innerText = isLocked ? '🔓 ODBLOKUJ CHMURĘ' : '✅ ZATWIERDŹ'; 
            appBtn.style.background = isLocked ? '#a00' : '#0a0'; 
            appBtn.style.borderColor = isLocked ? '#a00' : '#0a0';
        }

        head.innerHTML = '<th class="date-col">DATA</th>';
        employees.forEach(e => { 
            let deptClass = e.dept === 'ME' ? 'dept-me' : '';
            head.innerHTML += `<th><div class="avatar">${e.i}</div><div class="worker-name">${e.n}<br><span class="dept-tag ${deptClass}">${e.displayDept}</span></div></th>`; 
        });
        head.innerHTML += '<th class="obsada-col">OTW - SUMA - ZAM</th>';
        
        body.innerHTML = ""; 
        const today = new Date(); 
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === curM;

        for (let d = 1; d <= daysInMonth; d++) {
            let date = new Date(year, curM, d); 
            let tr = document.createElement('tr');
            
            let ds = `${curM+1}-${d}`; 
            let isHol = holidays2026.includes(ds); 
            let isSun = date.getDay() === 0; 
            let isSat = date.getDay() === 6;
            
            if (isSun || isHol) {
                tr.className = 'sun'; 
            } else if (isSat) {
                tr.className = 'sat';
            }
            
            if (isCurrentMonth && today.getDate() === d) {
                tr.classList.add('today-row');
            }
            
            let dayName = ['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()];
            let html = `<td class="date-col" style="line-height:1.2;">${d} ${dayName}${(isHol && !isSun) ? `<br><span style="font-size:0.45rem;color:#f99;">(ŚWIĘTO)</span>` : ''}</td>`; 
            let o = 0, z = 0, suma = 0;
            
            employees.forEach(e => {
                let shift = getShiftOnly(e.charId, d); 
                let roles = getRolesOnly(e.charId, d); 
                let cellClass = (shift === "Ż") ? 'wish-cell' : '';
                
                if (shift.includes('-')) { 
                    suma++; 
                    let p = shift.split('-'); 
                    if (parseInt(p[0]) <= 10) o++; 
                    if (parseInt(p[1]) >= 20) z++; 
                }
                
                let ic = ''; 
                if (roles.includes('K')) ic += '🔑'; 
                if (roles.includes('D')) ic += '📦'; 
                if (roles.includes('S')) ic += '☕';
                
                let displayHtml = `<div class="cell-shift">${shift}</div>`; 
                if (ic) {
                    displayHtml += `<div class="cell-icons">${ic}</div>`;
                }
                
                let clickAttr = (!isLocked && isManagerOrKss) ? `onclick="openEditModal('${e.n}', '${e.charId}', ${d})"` : '';
                html += `<td class="${cellClass}" ${clickAttr}>${displayHtml}</td>`;
            });
            
            html += `<td class="obsada-col">${o} - ${suma} - ${z}</td>`; 
            tr.innerHTML = html; 
            body.appendChild(tr);
        }

        const fSum = document.getElementById('sumRow'); 
        fSum.innerHTML = '<td class="date-col">GODZINY</td>';
        
        employees.forEach(e => { 
            let h = calcRealH(e.charId); 
            fSum.innerHTML += `<td style="color:${h == baseNorm ? '#0f0' : '#f44'}; font-size: 0.55rem;">${h} / ${baseNorm}</td>`; 
        });
        fSum.innerHTML += '<td class="obsada-col"></td>';

        const fSat = document.getElementById('satCountRow'); 
        fSat.innerHTML = '<td class="date-col">WOLNE SB</td>';
        
        employees.forEach(e => {
            let count = 0; 
            if (e.dept !== 'ME') { 
                for (let d = 1; d <= daysInMonth; d++) { 
                    if (new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) { 
                        let s = getShiftOnly(e.charId, d); 
                        if (s === "" || s === "URLOP" || s === "Ż" || s === "SZK") {
                            count++; 
                        }
                    } 
                } 
            }
            fSat.innerHTML += `<td style="color:${count >= 1 && count <= 2 ? '#ffe800' : '#888'}">${e.dept === 'ME' ? '-' : count}</td>`;
        });
        
        fSat.innerHTML += '<td class="obsada-col"></td>';
    }

    // RENDEROWANIE USTAWIEN DLA PRACOWNIKOW
    function renderSettings() {
        const grid = document.getElementById('workerGrid'); 
        grid.innerHTML = "";
        
        employees.forEach(e => {
            let savedZ = localPlanMeta[`set_z_${e.charId}`] || ""; 
            let savedU1 = localPlanMeta[`set_u1_${e.charId}`] || ""; 
            let savedU2 = localPlanMeta[`set_u2_${e.charId}`] || "";
            
            grid.innerHTML += `
                <div class="worker-card">
                    <div style="color:#ffe800; font-weight:900; font-size:0.7rem;">${e.n} <span style="color:#666; font-size:0.5rem">(${e.displayDept})</span></div>
                    <label>ŻYCZENIA (Dni np. 5,12):</label>
                    <input id="z_${e.charId}" value="${savedZ}">
                    <label>URLOP (Od-Do np. 1-7):</label>
                    <div style="display:flex; gap:2px">
                        <input id="u1_${e.charId}" placeholder="Od" value="${savedU1}">
                        <input id="u2_${e.charId}" placeholder="Do" value="${savedU2}">
                    </div>
                </div>`;
        });
    }

    // ZAPISYWANIE URLOPÓW I ZMIAN
    function saveSettings() {
        const daysInMonth = new Date(year, curM + 1, 0).getDate();
        let planUpdates = {}; 
        let metaUpdates = {};
        
        metaUpdates['globalShifts'] = document.getElementById('globalShifts').value;

        // Czyszczenie starych życzeń i urlopów
        employees.forEach(e => { 
            for (let d = 1; d <= daysInMonth; d++) { 
                let s = getShiftOnly(e.charId, d); 
                if (s === "URLOP" || s === "Ż") {
                    planUpdates[`${e.charId}_${d}`] = null; 
                }
            } 
        });

        // Wprowadzanie nowych życzeń i urlopów
        employees.forEach(e => {
            let z = document.getElementById(`z_${e.charId}`)?.value.trim() || ""; 
            let u1 = document.getElementById(`u1_${e.charId}`)?.value.trim() || ""; 
            let u2 = document.getElementById(`u2_${e.charId}`)?.value.trim() || "";
            
            metaUpdates[`set_z_${e.charId}`] = z; 
            metaUpdates[`set_u1_${e.charId}`] = u1; 
            metaUpdates[`set_u2_${e.charId}`] = u2;

            if (z) { 
                z.split(',').forEach(d => { 
                    let dayNum = parseInt(d.trim()); 
                    if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= daysInMonth) {
                        planUpdates[`${e.charId}_${dayNum}`] = "Ż"; 
                    }
                }); 
            }
            if (u1 && u2) { 
                let start = parseInt(u1); 
                let end = parseInt(u2); 
                if (!isNaN(start) && !isNaN(end)) { 
                    for (let d = start; d <= end; d++) { 
                        if (d >= 1 && d <= daysInMonth && isWorkDay(d)) {
                            planUpdates[`${e.charId}_${d}`] = "URLOP"; 
                        }
                    } 
                } 
            }
        });
        
        db.ref(`Stores/${myStore}/PlanMeta/${year}_${curM}`).update(metaUpdates);
        db.ref(`Stores/${myStore}/Plan/${year}_${curM}`).update(planUpdates);
        
        toggleModal(false); 
    }

    // EXPORT EXCEL
    function exportToExcel() {
        const daysInMonth = new Date(year, curM + 1, 0).getDate(); 
        
        let data = []; 
        let header = ["DATA"]; 
        employees.forEach(e => header.push(e.n)); 
        header.push("OTW-SUM-ZAM"); 
        data.push(header);
        
        for (let d = 1; d <= daysInMonth; d++) {
            let row = [`${d} ${['ND','PN','WT','ŚR','CZ','PT','SB'][new Date(year, curM, d).getDay()]}`]; 
            let o = 0, z = 0, suma = 0;
            
            employees.forEach(e => {
                let shift = getShiftOnly(e.charId, d); 
                let roles = getRolesOnly(e.charId, d);
                
                if (shift.includes('-')) { 
                    suma++; 
                    let p = shift.split('-'); 
                    if (parseInt(p[0]) <= 10) o++; 
                    if (parseInt(p[1]) >= 20) z++; 
                }
                
                row.push(shift ? `${shift}${roles.includes('K')?'🔑':''}${roles.includes('D')?'📦':''}${roles.includes('S')?'☕':''}` : "");
            });
            
            row.push(`${o} - ${suma} - ${z}`); 
            data.push(row);
        }
        
        let ws = XLSX.utils.aoa_to_sheet(data); 
        let wb = XLSX.utils.book_new(); 
        XLSX.utils.book_append_sheet(wb, ws, "Grafik"); 
        XLSX.writeFile(wb, `Grafik_ME_${months[curM]}.xlsx`);
    }

    // NAWIGACJA
    function toggleNav() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('overlay').classList.toggle('active'); 
    }
    
    function toggleModal(s) { 
        document.getElementById('settingsModal').style.display = s ? 'flex' : 'none'; 
        if (s) renderSettings(); 
    }
    
    function logout() { 
        localStorage.removeItem('currentUser'); 
        window.location.href = 'login.html'; 
    }

    window.onload = () => { 
        setMonth(curM); 
    };
