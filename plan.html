<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        html, body { background: #080808; color: white; display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #111; border-left: 1px solid #222; border-top: 1px solid #222; }
        ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #e6d100; }
        
        /* WSPÓLNY HEADER I MENU */
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; box-shadow: 0 2px 10px rgba(255, 232, 0, 0.2); }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; transition: 0.2s; }
        .menu-btn:hover { transform: scale(1.1); }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-header { color: #ffe800; font-weight: 900; font-size: 1rem; padding: 0 25px 15px 25px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        
        .user-profile { padding: 15px 20px; border-top: 2px solid #1a1a1a; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; background: #0f0f0f; }
        .user-profile:hover { background: #151515; }
        .user-profile:hover .user-settings { color: #ffe800; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 900; font-size: 0.85rem; color: #fff; letter-spacing: 0.5px; }
        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; transition: 0.2s; }
        .logout-btn { display: block; width: 100%; text-align: center; background: transparent; color: #f44; border: none; border-top: 1px solid #1a1a1a; padding: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .logout-btn:hover { background: #f44; color: #000; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        /* ZAWARTOŚĆ PLANU */
        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 800; width: 100%; }
        .month-row { display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-wrap: wrap; }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-grow: 1; padding-bottom: 2px; }
        .month-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #333; background: #000; color: #666; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; box-shadow: 0 0 10px rgba(255, 232, 0, 0.4); }
        .admin-controls { display: flex; align-items: center; gap: 8px; border-left: 1px solid #333; padding-left: 10px; }
        .norm-input { width: 55px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; border-radius: 4px; outline: none; }
        .table-container { flex: 1; overflow: auto; background: #080808; width: 100vw; max-width: 100%; display: block; }
        table { border-collapse: collapse; width: 100%; min-width: max-content; background: #080808; }
        thead th { background: #151515; position: sticky; top: 0; z-index: 500; padding: 10px 2px; border-bottom: 3px solid #ffe800; border-right: 1px solid #222; min-width: 75px; }
        thead th:last-child { border-right: none; min-width: 130px; } 
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.65rem; background: #000; box-shadow: 0 0 5px rgba(255, 232, 0, 0.3); }
        .worker-name { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; line-height: 1.2; color: #fff; letter-spacing: 0.5px; }
        .dept-tag { font-size: 0.45rem; font-weight: 900; color: #888; }
        .dept-me { color: #f44 !important; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
        .date-col { position: sticky; left: 0; background: #111; z-index: 600; min-width: 90px; font-size: 0.65rem; font-weight: 900; color: #ccc; text-align: center; border-right: 2px solid #ffe800; border-left: 2px solid #ffe800; }
        .obsada-col { min-width: 130px; color: #ffe800; font-weight: 900; font-size: 0.65rem; background: #111; text-align: center; border-left: 2px solid #ffe800; border-right: none !important; } 
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        td { border-bottom: 1px solid #222; border-right: 1px solid #222; height: 48px; text-align: center; vertical-align: middle; transition: background-color 0.2s; cursor: pointer; }
        td:hover { background-color: rgba(255, 255, 255, 0.08); }
        .cell-shift { font-weight: 900; font-size: 0.8rem; color: #fff; }
        .cell-icons { font-size: 0.7rem; letter-spacing: 2px; margin-top: 3px; }
        .sun { background-color: #4a1111 !important; } 
        .sun .date-col { background-color: #5c1616 !important; color: #ff9999; border-right-color: #ff4d4d; }
        .sun td { border-bottom-color: #330b0b; border-right-color: #330b0b; }
        .sun .obsada-col { background-color: #5c1616 !important; border-left-color: #ff4d4d; color: #ff9999; }
        .sat { background-color: #8c7311 !important; }
        .sat .date-col { background-color: #a68814 !important; color: #fff; border-right-color: #ffe800; }
        .sat td { border-bottom-color: #6b580d; border-right-color: #6b580d; }
        .sat .obsada-col { background-color: #a68814 !important; color: #fff; border-left-color: #ffe800; }
        .wish-cell { background: rgba(221, 0, 170, 0.15); }
        .today-row { position: relative; background-color: rgba(0, 255, 0, 0.1) !important; }
        .today-row::after { content: ''; position: absolute; inset: 0; border: 2px solid #0f0; pointer-events: none; z-index: 100; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2) inset; }
        .today-row .date-col { color: #0f0; background-color: #0a150a !important; border-right-color: #0f0; }
        tfoot { position: sticky; bottom: 0; z-index: 700; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.65rem; text-align: center; border-top: 2px solid #ffe800; height: 35px; border-right: 1px solid #222; }
        .legend-bar { display: flex; justify-content: center; gap: 20px; background: #0a0a0a; padding: 10px; border-top: 1px solid #222; font-size: 0.7rem; font-weight: bold; color: #888; flex-shrink: 0; z-index: 800; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 800px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 232, 0, 0.15); }
        .btn-shift { background: #151515; border: 1px solid #444; color: #fff; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-shift:hover, .btn-shift.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .role-checkboxes { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; max-height: 60vh; overflow-y: auto; }
        .worker-card { background: #151515; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .worker-card input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 3px; outline: none; }
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; transition: 0.3s; }
        .btn-gen:hover { transform: scale(1.05); }
        .btn-settings { background: #333; color: #ffe800; border: 1px solid #ffe800; padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; transition: 0.3s; }
        .btn-settings:hover { background: #ffe800; color: #000; }
        .btn-excel { background: #1d6f42; color: #fff; border: 1px solid #1d6f42; padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; transition: 0.3s; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">EXPERT <span>TOOL</span></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
        <div class="sidebar-header">Nawigacja</div>
        <a href="index.html" class="sidebar-link">Strona główna</a>
        <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
        <a href="inwa.html" class="sidebar-link">Inwentury</a>
        <a href="inwak.html" class="sidebar-link">Inwentury (ME/KSS)</a>
        <a href="azs.html" class="sidebar-link">AZS</a>
        <a href="kwt.html" class="sidebar-link">KWT</a>

    </div>
    <div class="user-profile" onclick="window.location.href='ustawienia.html'">
        <div class="user-avatar">P</div>
        <div class="user-info">
            <span class="user-name">PAWEŁ (ME)</span>
            <span class="user-settings">⚙️ Ustawienia konta</span>
        </div>
    </div>
    <button class="logout-btn" onclick="alert('System wylogowywania aktywny.')">Wyloguj się</button>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="navigation-area">
    <div class="month-row">
        <div class="month-selector" id="monthSelector"></div>
        <div class="admin-controls">
            <span style="font-size:0.55rem; font-weight:900; color:#888;">NORMA H:</span>
            <input type="number" id="hourNormInput" class="norm-input" value="160" onchange="saveNorm(this.value)">
            <button class="btn-settings" onclick="toggleModal(true)">⚙️ USTAWIENIA</button>
            <button class="btn-settings" style="background:#a00; color:#fff; border-color:#a00;" onclick="clearMonth()" id="clearBtn">🗑️ WYCZYŚĆ</button>
            <button class="btn-gen" onclick="startGeneration()" id="genBtn">🚀 GENERUJ PLAN</button>
            <button class="btn-settings" id="approveBtn" style="background:#0a0; color:#fff; border-color:#0a0;" onclick="toggleApprove()">✅ ZATWIERDŹ</button>
            <button class="btn-excel" onclick="exportToExcel()" id="excelBtn">📊 EXPORT EXCEL</button>
        </div>

</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot>
            <tr id="sumRow"></tr>
            <tr id="satCountRow"></tr>
        </tfoot>
    </table>
</div>

<div class="legend-bar">
    <span><span style="font-size:1rem;">🔑</span> KLUCZE</span>
    <span><span style="font-size:1rem;">📦</span> DOSTAWA</span>

</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="color:#ffe800; margin-bottom:10px; font-size:1rem;">USTAWIENIA SKLEPU</h3>
        <label style="font-size:0.6rem; color:#888;">DOSTĘPNE ZMIANY DLA DNI ROBOCZYCH:</label>
        <input id="globalShifts" style="width:100%; background:#000; border:1px solid #ffe800; color:#fff; padding:8px; margin-bottom:15px;" value="10-18, 12-20, 10-20">
        <div class="worker-grid" id="workerGrid"></div>
        <button class="btn-gen" style="width:100%; margin-top:20px; height:45px;" onclick="saveSettings()">ZAPISZ I ZAMKNIJ</button>
    </div>
</div>

<div class="modal" id="cellEditModal">
    <div class="modal-content" style="max-width: 450px;">
        <h3 id="cellModalTitle" style="color:#ffe800; margin-bottom:15px; text-align:center;">EDYTUJ DZIEŃ</h3>
        <div class="edit-grid" id="modalShiftButtons" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:15px;">
            <button class="btn-shift" onclick="setModalShift('10-18', this)">10-18</button>
            <button class="btn-shift" onclick="setModalShift('12-20', this)">12-20</button>
            <button class="btn-shift" onclick="setModalShift('10-20', this)">10-20</button>
            <button class="btn-shift" onclick="setModalShift('WOLNE', this)">WOLNE</button>
            <button class="btn-shift" onclick="setModalShift('URLOP', this)">URLOP</button>
            <button class="btn-shift" onclick="setModalShift('Ż', this)">ŻYCZENIE</button>
        </div>
        <input type="text" id="modalCustomShift" style="width:100%; background:#000; color:#fff; border:1px solid #444; padding:10px; text-align:center; font-weight:bold; margin-bottom:15px; border-radius:5px;" placeholder="Lub wpisz ręcznie (np. 8-16)" oninput="clearShiftButtons()">
        <div class="role-checkboxes">
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleK"> 🔑 Zamyka</label>
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleD"> 📦 Dostawa</label>
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleS"> ☕ Socjalny</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-settings" style="flex:1;" onclick="closeCellModal()">ANULUJ</button>
            <button class="btn-settings" style="background:#a00; color:white; border-color:#a00; flex:1;" onclick="clearCell()">WYCZYŚĆ</button>
            <button class="btn-gen" style="flex:2;" onclick="saveCellModal()">ZAPISZ ZMIANY</button>
        </div>
    </div>
</div>

<script>
const employees = [ {n:"PAWEŁ", i:"P", p:false, dept:"ME"}, {n:"MICHAŁ", i:"M", p:false, dept:"KSS"}, {n:"NATALIA", i:"N", p:true, dept:"POK"}, {n:"MAGDA", i:"M", p:true, dept:"POK"}, {n:"JAKUB", i:"J", p:false, dept:"IT"}, {n:"ADRIAN", i:"A", p:false, dept:"IT"}, {n:"DAWID", i:"D", p:false, dept:"IT"}, {n:"DAREK", i:"D", p:false, dept:"IT"}, {n:"ŁUKASZ", i:"Ł", p:false, dept:"AGD"}, {n:"ILONA", i:"I", p:false, dept:"AGD"}, {n:"ARIEL", i:"A", p:false, dept:"RTV"} ];
const months = ["STYCZEŃ","LUTY","MARZEC","KWIECIEŃ","MAJ","CZERWIEC","LIPIEC","SIERPIEŃ","WRZESIEŃ","PAŹDZIERNIK","LISTOPAD","GRUDZIEŃ"];
let curM = new Date().getMonth(); const year = 2026;
const holidays2026 = ["1-1","1-6","4-5","4-6","5-1","5-3","5-24","6-4","8-15","11-1","11-11","12-25","12-26"];
const tradingSundays2026 = ["1-25","3-29","4-26","6-28","8-30","12-13","12-20"]; 

function isWorkDay(d) { let ds = `${curM+1}-${d}`; if(holidays2026.includes(ds)) return false; if(new Date(year,curM,d).getDay()===0 && !tradingSundays2026.includes(ds)) return false; return true; }
function getVRaw(n, d) { return localStorage.getItem(`pl_${year}_${curM}_${n}_${d}`) || ""; }
function saveVRaw(n, d, v) { localStorage.setItem(`pl_${year}_${curM}_${n}_${d}`, v.toUpperCase()); }
function getShiftOnly(n, d) { let v = getVRaw(n,d); return v.split('|')[0] || ""; }
function getRolesOnly(n, d) { let v = getVRaw(n,d); return v.split('|')[1] ? v.split('|')[1].split(',') : []; }

let currentEditEmp = null, currentEditDay = null;
function openEditModal(emp, day) { if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return; currentEditEmp = emp; currentEditDay = day; let shift = getShiftOnly(emp, day); let roles = getRolesOnly(emp, day); document.getElementById('cellModalTitle').innerText = `${emp} - DZIEŃ ${day}`; document.getElementById('modalCustomShift').value = shift; document.querySelectorAll('.btn-shift').forEach(b => { b.classList.remove('active'); if(b.innerText === shift) b.classList.add('active'); }); document.getElementById('modalRoleK').checked = roles.includes('K'); document.getElementById('modalRoleD').checked = roles.includes('D'); document.getElementById('modalRoleS').checked = roles.includes('S'); document.getElementById('cellEditModal').style.display = 'flex'; }
function setModalShift(val, btn) { document.getElementById('modalCustomShift').value = val; document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
function clearShiftButtons() { document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); }
function clearCell() { saveVRaw(currentEditEmp, currentEditDay, ""); closeCellModal(); render(); }
function closeCellModal() { document.getElementById('cellEditModal').style.display = 'none'; }
function saveCellModal() { let shift = document.getElementById('modalCustomShift').value.trim().toUpperCase(); let roles = []; if(document.getElementById('modalRoleK').checked) roles.push('K'); if(document.getElementById('modalRoleD').checked) roles.push('D'); if(document.getElementById('modalRoleS').checked) roles.push('S'); let finalVal = shift; if(roles.length > 0 && shift !== "" && shift !== "WOLNE" && shift !== "URLOP" && shift !== "Ż") finalVal += '|' + roles.join(','); saveVRaw(currentEditEmp, currentEditDay, finalVal); closeCellModal(); render(); }
function saveNorm(v) { localStorage.setItem(`norm_${year}_${curM}`, v); render(); }
function loadNorm() { let v = localStorage.getItem(`norm_${year}_${curM}`); document.getElementById('hourNormInput').value = v ? v : 160; }
function toggleApprove() { let locked = localStorage.getItem(`locked_${year}_${curM}`) === 'true'; localStorage.setItem(`locked_${year}_${curM}`, !locked); render(); }
function clearMonth() { if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return; if(confirm("Wyczyścić grafik?")) { const days = new Date(year, curM + 1, 0).getDate(); employees.forEach(e => { if(e.dept === 'ME') return; for(let d=1; d<=days; d++) { let s = getShiftOnly(e.n, d); if(s !== "URLOP" && s !== "Ż") saveVRaw(e.n, d, ""); } }); render(); } }

function exportToExcel() {
    let data = []; let header = ["DATA"]; employees.forEach(e => header.push(e.n)); header.push("OTW-SUM-ZAM"); data.push(header);
    const days = new Date(year, curM + 1, 0).getDate();
    for(let d=1; d<=days; d++) {
        let date = new Date(year, curM, d); let dayName = ['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()];
        let row = [`${d} ${dayName}`]; let o=0, z=0, suma=0;
        employees.forEach(e => {
            let shift = getShiftOnly(e.n, d); let roles = getRolesOnly(e.n, d);
            if(shift.includes('-')) { suma++; let p = shift.split('-'); if(parseInt(p[0]) <= 10) o++; if(parseInt(p[1]) >= 20) z++; }
            let ic = ''; if(roles.includes('K')) ic += ' 🔑'; if(roles.includes('D')) ic += ' 📦'; if(roles.includes('S')) ic += ' ☕';
            row.push(shift ? `${shift}${ic}` : "");
        });
        row.push(`${o} - ${suma} - ${z}`); data.push(row);
    }
    let ws = XLSX.utils.aoa_to_sheet(data);
    let wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Grafik");
    XLSX.writeFile(wb, `Grafik_${months[curM]}_${year}.xlsx`);
}

function calcRealH(name) { let h=0; for(let d=1; d<=31; d++) { let s=getShiftOnly(name,d); if(s.includes('-')) { let p=s.split('-'); h+=(parseInt(p[1])||0)-(parseInt(p[0])||0); } } return h; }
function getStreak(name, day) { return 0; } // Skrócone dla czytelności
function shuffle(array) { for(let i=array.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [array[i], array[j]]=[array[j], array[i]]; } return array; }

function startGeneration() {
    if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return;
    const days = new Date(year, curM + 1, 0).getDate();
    employees.forEach(e => { if(e.dept !== 'ME') { for(let d=1; d<=days; d++) { let s=getShiftOnly(e.n,d); if(s!=="URLOP"&&s!=="Ż") saveVRaw(e.n,d,"10-18"); } } });
    render(); alert("Prosty wzór nałożony - algorytm uproszczony.");
}

function render() {
    const days = new Date(year, curM + 1, 0).getDate(); const baseNorm = parseInt(document.getElementById('hourNormInput').value);
    const body = document.getElementById('daysBody'); const head = document.getElementById('workerRow');
    head.innerHTML = '<th class="date-col">DATA</th>'; employees.forEach(e => { head.innerHTML += `<th><div class="avatar">${e.i}</div><div class="worker-name">${e.n}<br><span class="dept-tag ${e.dept==='ME'?'dept-me':''}">${e.dept}</span></div></th>`; }); head.innerHTML += '<th class="obsada-col">OTW - SUMA - ZAM</th>';
    body.innerHTML = "";
    for(let d=1; d<=days; d++) {
        let date = new Date(year, curM, d); let tr = document.createElement('tr');
        if(date.getDay()===0) tr.className='sun'; else if(date.getDay()===6) tr.className='sat';
        let dayName = ['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()];
        let html = `<td class="date-col">${d} ${dayName}</td>`; let o=0, z=0, suma=0;
        employees.forEach(e => {
            let shift = getShiftOnly(e.n, d); let roles = getRolesOnly(e.n, d);
            if(shift.includes('-')) { suma++; let p=shift.split('-'); if(parseInt(p[0])<=10) o++; if(parseInt(p[1])>=20) z++; }
            let ic = ''; if(roles.includes('K')) ic += '🔑'; if(roles.includes('D')) ic += '📦'; if(roles.includes('S')) ic += '☕';
            html += `<td onclick="openEditModal('${e.n}', ${d})"><div class="cell-shift">${shift}</div><div class="cell-icons">${ic}</div></td>`;
        });
        html += `<td class="obsada-col">${o} - ${suma} - ${z}</td>`; tr.innerHTML = html; body.appendChild(tr);
    }
    const fSum = document.getElementById('sumRow'); fSum.innerHTML = '<td class="date-col">GODZINY</td>';
    employees.forEach(e => { let h = calcRealH(e.n); fSum.innerHTML += `<td style="color:${h==baseNorm?'#0f0':'#f44'}; font-size:0.55rem;">${h} / ${baseNorm}</td>`; }); fSum.innerHTML += '<td></td>';
}

function renderSettings() { const grid=document.getElementById('workerGrid'); grid.innerHTML=""; employees.forEach(e=>{ grid.innerHTML+=`<div class="worker-card"><div style="color:#ffe800;font-size:0.7rem;">${e.n}</div><input id="z_${e.n}" placeholder="Życzenia (np. 5,12)"></div>`; }); }
function saveSettings() { toggleModal(false); render(); }
function setMonth(i) { curM = i; loadNorm(); renderMonths(); render(); }
function renderMonths() { const div=document.getElementById('monthSelector'); div.innerHTML=""; months.forEach((m,i)=>{ const b=document.createElement('button'); b.className=`month-btn ${i===curM?'active':''}`; b.innerText=m; b.onclick=()=>setMonth(i); div.appendChild(b); }); }
function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
function toggleModal(s) { document.getElementById('settingsModal').style.display = s ? 'flex' : 'none'; if(s) renderSettings(); }
window.onload = () => { setMonth(curM); };
</script>
</body>
</html>
