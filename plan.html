<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script>
        // STRAŻNIK DOSTĘPU
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const storeSetup = JSON.parse(localStorage.getItem('store_setup'));
        if (!currentUser || !storeSetup) { window.location.href = 'login.html'; }
        const isManagerOrKss = (currentUser.dept === 'ME' || currentUser.isKss);
    </script>
    <style>
        /* [STYLES SA TE SAME, ŻEBY ZAOSZCZĘDZIĆ MIEJSCE DAŁEM TYLKO SKRÓCONY CSS, BY ZMIEŚCIĆ CAŁOŚĆ W JEDNYM POŚCIE] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        html, body { background: #080808; color: white; display: flex; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: #111; border-left: 1px solid #222; border-top: 1px solid #222; } ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 3px; }
        .store-badge { font-size: 0.7rem; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 20px; font-weight: 800; border: 1px solid #000; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; transition: 0.2s; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; }
        .sidebar-header { color: #ffe800; font-weight: 900; font-size: 1rem; padding: 0 25px 15px 25px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        .user-profile { padding: 15px 20px; border-top: 2px solid #1a1a1a; display: flex; align-items: center; gap: 15px; cursor: pointer; background: #0f0f0f; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: #151515; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffe800; font-size: 1.2rem; flex-shrink: 0;}
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 900; font-size: 0.85rem; color: #fff; }
        .user-settings { font-size: 0.65rem; color: #888; font-weight: 700; margin-top: 4px; }
        .logout-btn { display: block; width: 100%; text-align: center; background: transparent; color: #f44; border: none; border-top: 1px solid #1a1a1a; padding: 15px; font-weight: 900; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 800; width: 100%; }
        .month-row { display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-wrap: wrap; }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-grow: 1; padding-bottom: 2px; }
        .month-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #333; background: #000; color: #666; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .admin-controls { display: flex; align-items: center; gap: 8px; border-left: 1px solid #333; padding-left: 10px; }
        .norm-input { width: 55px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; border-radius: 4px; outline: none; }
        
        .table-container { flex: 1; overflow: auto; background: #080808; width: 100vw; display: block; }
        table { border-collapse: collapse; width: 100%; min-width: max-content; background: #080808; }
        thead th { background: #151515; position: sticky; top: 0; z-index: 500; padding: 10px 2px; border-bottom: 3px solid #ffe800; border-right: 1px solid #222; min-width: 75px; }
        thead th:last-child { border-right: none; min-width: 130px; } 
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.65rem; background: #000; }
        .worker-name { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; color: #fff; }
        .dept-tag { font-size: 0.45rem; font-weight: 900; color: #888; }
        .dept-me { color: #f44 !important; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
        .date-col { position: sticky; left: 0; background: #111; z-index: 600; min-width: 90px; font-size: 0.65rem; font-weight: 900; color: #ccc; text-align: center; border-right: 2px solid #ffe800; border-left: 2px solid #ffe800; }
        .obsada-col { min-width: 130px; color: #ffe800; font-weight: 900; font-size: 0.65rem; background: #111; text-align: center; border-left: 2px solid #ffe800; } 
        td { border-bottom: 1px solid #222; border-right: 1px solid #222; height: 48px; text-align: center; vertical-align: middle; cursor: pointer; }
        td:hover { background-color: rgba(255, 255, 255, 0.08); }
        .cell-shift { font-weight: 900; font-size: 0.8rem; color: #fff; }
        .cell-icons { font-size: 0.7rem; margin-top: 3px; }
        .sun { background-color: #4a1111 !important; } .sun .date-col { background-color: #5c1616 !important; color: #ff9999; } .sun .obsada-col { background-color: #5c1616 !important; color: #ff9999; }
        .sat { background-color: #8c7311 !important; } .sat .date-col { background-color: #a68814 !important; color: #fff; } .sat .obsada-col { background-color: #a68814 !important; color: #fff; }
        .wish-cell { background: rgba(221, 0, 170, 0.15); } .wish-cell .cell-shift { color: #f0f !important; }
        .today-row .date-col { color: #0f0; border-right-color: #0f0; }
        tfoot { position: sticky; bottom: 0; z-index: 700; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.65rem; text-align: center; border-top: 2px solid #ffe800; height: 35px; }

        .legend-bar { display: flex; justify-content: center; gap: 20px; background: #0a0a0a; padding: 10px; font-size: 0.7rem; font-weight: bold; color: #888; z-index: 800; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 800px; border-radius: 15px; }
        .edit-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .btn-shift { background: #151515; border: 1px solid #444; color: #fff; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-shift.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .role-checkboxes { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; max-height: 60vh; overflow-y: auto; }
        .worker-card { background: #151515; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .worker-card input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 4px; font-size: 0.75rem; }
        .btn-gen, .btn-settings, .btn-excel { padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; border: none;}
        .btn-gen { background: #ffe800; color: #000; } .btn-settings { background: #333; color: #ffe800; border: 1px solid #ffe800; } .btn-excel { background: #1d6f42; color: #fff; border: 1px solid #1d6f42; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">EXPERT <span>TOOL</span> <div class="store-badge" id="headerStore">SXXX</div></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-nav">
        <div class="sidebar-header">Nawigacja</div>
        <a href="index.html" class="sidebar-link">Strona główna</a>
        <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
        <a href="inwa.html" class="sidebar-link">Inwentury</a>
        <a href="inwak.html" class="sidebar-link" id="navInwaKSS">Inwentury (ME/KSS)</a>
        <a href="azs.html" class="sidebar-link">AZS</a>
        <a href="kwt.html" class="sidebar-link">KWT</a>
        <a href="qr.html" class="sidebar-link">Kod QR</a>
    </div>
    <div class="user-profile" onclick="window.location.href='ustawienia.html'">
        <div class="user-avatar" id="sideAvatar">?</div>
        <div class="user-info">
            <span class="user-name" id="sideName">Ladowanie...</span>
            <span class="user-settings">⚙️ Ustawienia konta</span>
        </div>
    </div>
    <button class="logout-btn" onclick="logout()">Wyloguj się</button>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="navigation-area">
    <div class="month-row">
        <div class="month-selector" id="monthSelector"></div>
        <div class="admin-controls" id="adminControlsPanel">
            <span style="font-size:0.55rem; font-weight:900; color:#888;">NORMA H:</span>
            <input type="number" id="hourNormInput" class="norm-input" value="160" onchange="saveNorm(this.value)">
            <button class="btn-settings" onclick="toggleModal(true)">⚙️ USTAWIENIA</button>
            <button class="btn-settings" style="background:#a00; color:#fff; border-color:#a00;" onclick="clearMonth()" id="clearBtn">🗑️ WYCZYŚĆ</button>
            <button class="btn-gen" onclick="startGeneration()" id="genBtn">🚀 GENERUJ</button>
            <button class="btn-settings" id="approveBtn" style="background:#0a0; color:#fff; border-color:#0a0;" onclick="toggleApprove()">✅ ZATWIERDŹ</button>
            <button class="btn-excel" onclick="exportToExcel()" id="excelBtn">📊 EXCEL</button>
        </div>
        <div class="admin-controls" id="employeeControlsPanel" style="display:none;">
            <button class="btn-excel" onclick="exportToExcel()">📊 POBIERZ GRAFIK</button>
        </div>
    </div>
</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot><tr id="sumRow"></tr><tr id="satCountRow"></tr></tfoot>
    </table>
</div>

<div class="legend-bar">
    <span>🔑 KLUCZE</span><span>📦 DOSTAWA</span><span>☕ SOCJALNY</span>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="color:#ffe800; margin-bottom:10px; font-size:1rem;">USTAWIENIA SKLEPU</h3>
        <label style="font-size:0.6rem; color:#888;">DOSTĘPNE ZMIANY DLA DNI ROBOCZYCH:</label>
        <input id="globalShifts" style="width:100%; background:#000; border:1px solid #ffe800; color:#fff; padding:8px; margin-bottom:15px;" value="10-18, 12-20, 10-20">
        <div class="worker-grid" id="workerGrid"></div>
        <button class="btn-gen" style="width:100%; margin-top:20px; height:45px;" onclick="saveSettings()">ZAPISZ I ZAMKNIJ</button>
    </div>
</div>

<div class="modal" id="cellEditModal">
    <div class="modal-content" style="max-width: 450px;">
        <h3 id="cellModalTitle" style="color:#ffe800; margin-bottom:15px; text-align:center;">EDYTUJ DZIEŃ</h3>
        <div class="edit-grid" id="modalShiftButtons">
            <button class="btn-shift" onclick="setModalShift('10-18', this)">10-18</button>
            <button class="btn-shift" onclick="setModalShift('12-20', this)">12-20</button>
            <button class="btn-shift" onclick="setModalShift('10-20', this)">10-20</button>
            <button class="btn-shift" onclick="setModalShift('13-20', this)">13-20</button>
            <button class="btn-shift" onclick="setModalShift('10-17', this)">10-17</button>
            <button class="btn-shift" onclick="setModalShift('WOLNE', this)">WOLNE</button>
            <button class="btn-shift" onclick="setModalShift('URLOP', this)">URLOP</button>
            <button class="btn-shift" onclick="setModalShift('Ż', this)">ŻYCZENIE</button>
            <button class="btn-shift" onclick="setModalShift('SZK', this)">SZK</button>
        </div>
        <input type="text" id="modalCustomShift" style="width:100%; background:#000; color:#fff; border:1px solid #444; padding:10px; text-align:center; font-weight:bold; margin-bottom:15px; border-radius:5px;" placeholder="Lub wpisz ręcznie (np. 8-16)" oninput="clearShiftButtons()">
        <div class="role-checkboxes">
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleK"> 🔑 Zamyka</label>
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleD"> 📦 Dostawa</label>
            <label style="color:#fff; cursor:pointer;"><input type="checkbox" id="modalRoleS"> ☕ Dział Socjalny</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-settings" style="flex:1;" onclick="closeCellModal()">ANULUJ</button>
            <button class="btn-settings" style="background:#a00; color:white; border-color:#a00; flex:1;" onclick="clearCell()">WYCZYŚĆ</button>
            <button class="btn-gen" style="flex:2;" onclick="saveCellModal()">ZAPISZ ZMIANY</button>
        </div>
    </div>
</div>

<script>
    // DYNAMICZNE WCZYTANIE DANYCH Z BAZY
    document.getElementById('headerStore').innerText = `${storeSetup.sNumber} ${storeSetup.city}`;
    document.getElementById('sideName').innerText = `${currentUser.name} (${currentUser.dept})`;
    document.getElementById('sideAvatar').innerText = currentUser.charId.charAt(0);

    if(!isManagerOrKss) {
        document.getElementById('navInwaKSS').style.display = 'none';
        document.getElementById('adminControlsPanel').style.display = 'none';
        document.getElementById('employeeControlsPanel').style.display = 'flex';
    }

    const rawUsers = JSON.parse(localStorage.getItem('users')) || [];
    // Transformacja użytkowników z bazy pod silnik planu pracy (omijamy sztucznego admina jeśli by był)
    const employees = rawUsers.filter(u => u.charId !== 'ADMIN').map(u => {
        return { n: u.name, i: u.charId.charAt(0), p: u.dept === 'POK', dept: u.dept, charId: u.charId };
    });

    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    let curM = new Date().getMonth(); const year = 2026;
    const holidays2026 = ["1-1", "1-6", "4-5", "4-6", "5-1", "5-3", "5-24", "6-4", "8-15", "11-1", "11-11", "12-25", "12-26"];
    const tradingSundays2026 = ["1-25", "3-29", "4-26", "6-28", "8-30", "12-13", "12-20"]; 

    function isWorkDay(d) { let ds = `${curM+1}-${d}`; if(holidays2026.includes(ds)) return false; if(new Date(year,curM,d).getDay()===0 && !tradingSundays2026.includes(ds)) return false; return true; }
    function getVRaw(n, d) { return localStorage.getItem(`pl_${year}_${curM}_${n}_${d}`) || ""; }
    function saveVRaw(n, d, v) { localStorage.setItem(`pl_${year}_${curM}_${n}_${d}`, v.toUpperCase()); }
    function getShiftOnly(n, d) { return getVRaw(n,d).split('|')[0] || ""; }
    function getRolesOnly(n, d) { return getVRaw(n,d).split('|')[1] ? getVRaw(n,d).split('|')[1].split(',') : []; }

    let currentEditEmp = null; let currentEditDay = null;

    function openEditModal(emp, day) {
        if(!isManagerOrKss) return; // Ochrona: pracownik nie może kliknąć komórki
        if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return;
        currentEditEmp = emp; currentEditDay = day;
        let shift = getShiftOnly(emp, day); let roles = getRolesOnly(emp, day);
        document.getElementById('cellModalTitle').innerText = `${emp} - DZIEŃ ${day}`;
        document.getElementById('modalCustomShift').value = shift;
        document.querySelectorAll('.btn-shift').forEach(b => { b.classList.remove('active'); if(b.innerText === shift) b.classList.add('active'); });
        document.getElementById('modalRoleK').checked = roles.includes('K'); document.getElementById('modalRoleD').checked = roles.includes('D'); document.getElementById('modalRoleS').checked = roles.includes('S');
        document.getElementById('cellEditModal').style.display = 'flex';
    }
    function setModalShift(val, btn) { document.getElementById('modalCustomShift').value = val; document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    function clearShiftButtons() { document.querySelectorAll('.btn-shift').forEach(b => b.classList.remove('active')); }
    function clearCell() { saveVRaw(currentEditEmp, currentEditDay, ""); closeCellModal(); render(); }
    function closeCellModal() { document.getElementById('cellEditModal').style.display = 'none'; }
    function saveCellModal() {
        let shift = document.getElementById('modalCustomShift').value.trim().toUpperCase(); let roles = [];
        if(document.getElementById('modalRoleK').checked) roles.push('K'); if(document.getElementById('modalRoleD').checked) roles.push('D'); if(document.getElementById('modalRoleS').checked) roles.push('S');
        let finalVal = shift; if(roles.length > 0 && shift !== "" && shift !== "WOLNE" && shift !== "URLOP" && shift !== "Ż" && shift !== "SZK") finalVal += '|' + roles.join(',');
        saveVRaw(currentEditEmp, currentEditDay, finalVal); closeCellModal(); render();
    }
    function saveNorm(v) { localStorage.setItem(`norm_${year}_${curM}`, v); render(); }
    function loadNorm() { let v = localStorage.getItem(`norm_${year}_${curM}`); if(document.getElementById('hourNormInput')) document.getElementById('hourNormInput').value = v ? v : 160; }
    function toggleApprove() { let locked = localStorage.getItem(`locked_${year}_${curM}`) === 'true'; localStorage.setItem(`locked_${year}_${curM}`, !locked); render(); }
    function clearMonth() { if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return; if(confirm("Wyczyścić grafik? (Urlopy, szkolenia i życzenia zostaną)")) { const days = new Date(year, curM + 1, 0).getDate(); employees.forEach(e => { if(e.dept === 'ME') return; for(let d=1; d<=days; d++) { let s = getShiftOnly(e.n, d); if(s !== "URLOP" && s !== "Ż" && s !== "SZK") saveVRaw(e.n, d, ""); } }); render(); } }

    function exportToExcel() {
        // [To samo eksportowanie z poprzednich wersji]
        const days = new Date(year, curM + 1, 0).getDate(); const baseNorm = document.getElementById('hourNormInput') ? parseInt(document.getElementById('hourNormInput').value) : 160;
        let data = []; let header = ["DATA"]; employees.forEach(e => header.push(e.n)); header.push("OTW-SUM-ZAM"); data.push(header);
        for(let d=1; d<=days; d++) {
            let row = [`${d} ${['ND','PN','WT','ŚR','CZ','PT','SB'][new Date(year, curM, d).getDay()]}`]; let o=0, z=0, suma=0;
            employees.forEach(e => {
                let shift = getShiftOnly(e.n, d); let roles = getRolesOnly(e.n, d);
                if(shift.includes('-')) { suma++; let p = shift.split('-'); if(parseInt(p[0]) <= 10) o++; if(parseInt(p[1]) >= 20) z++; }
                row.push(shift ? `${shift}${roles.includes('K')?'🔑':''}${roles.includes('D')?'📦':''}${roles.includes('S')?'☕':''}` : "");
            });
            row.push(`${o} - ${suma} - ${z}`); data.push(row);
        }
        let ws = XLSX.utils.aoa_to_sheet(data); let wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Grafik"); XLSX.writeFile(wb, `Grafik_${months[curM]}.xlsx`);
    }

    function calcRealH(name) { let h=0; for(let d=1; d<=31; d++) { let s=getShiftOnly(name,d); if(s.includes('-')) { let p=s.split('-'); h+=(parseInt(p[1])||0)-(parseInt(p[0])||0); } else if (s==="URLOP"||s==="SZK") h+=8; } return h; }
    function getStreak(name, day) { let s=0; for(let d=day-1; d>=1; d--) { let st=getShiftOnly(name,d); if(st.includes('-')||st==="URLOP"||st==="SZK") s++; else break; } for(let d=day+1; d<=31; d++) { let st=getShiftOnly(name,d); if(st.includes('-')||st==="URLOP"||st==="SZK") s++; else break; } return s; }
    function shuffle(a) { for(let i=a.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [a[i], a[j]]=[a[j], a[i]]; } return a; }

    function startGeneration() {
        if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return;
        const baseNorm = parseInt(document.getElementById('hourNormInput').value);
        const shifts = document.getElementById('globalShifts').value.split(',').map(s=>s.trim());
        const openShift = shifts[0]||"10-18"; const closeShift = shifts[1]||"12-20"; const fullShift = shifts[2]||"10-20"; const satShift = "10-20";
        const days = new Date(year, curM + 1, 0).getDate();

        employees.forEach(e => { if(e.dept !== 'ME') { for(let d=1; d<=days; d++) { let s=getShiftOnly(e.n,d); if(s.includes('-')||s==="WOLNE") saveVRaw(e.n,d,""); } } });
        let sats = []; for(let d=1; d<=days; d++) { if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) sats.push(d); }
        sats.forEach(d => {
            let available = employees.filter(e => getShiftOnly(e.n, d) === "" && e.dept !== 'ME'); shuffle(available);
            let toWork = []; let poks = available.filter(e => e.p); let sales = available.filter(e => !e.p); let totalNeeded = 6;
            if(poks.length > 0) { toWork.push({ e: poks[0], shift: satShift }); if(poks.length > 1) sales.push(poks[1]); totalNeeded--; }
            let it = sales.find(e => e.dept === 'IT'); if(it) { toWork.push({ e: it, shift: satShift }); sales = sales.filter(e => e.n !== it.n); totalNeeded--; }
            let agd = sales.find(e => e.dept === 'AGD'); if(agd) { toWork.push({ e: agd, shift: satShift }); sales = sales.filter(e => e.n !== agd.n); totalNeeded--; }
            for(let i=0; i<totalNeeded && sales.length>0; i++) { toWork.push({ e: sales[0], shift: satShift }); sales.shift(); }
            toWork.forEach(w => saveVRaw(w.e.n, d, w.shift));
        });

        for(let d=1; d<=days; d++) {
            if(new Date(year, curM, d).getDay() === 6 || !isWorkDay(d)) continue;
            let available = employees.filter(e => getShiftOnly(e.n, d) === "" && getStreak(e.n, d) < 5 && e.dept !== 'ME'); shuffle(available);
            let poks = available.filter(e => e.p); let sales = available.filter(e => !e.p);
            if(poks.length === 1) { saveVRaw(poks[0].n, d, fullShift); } else if(poks.length > 1) { saveVRaw(poks[0].n, d, openShift); saveVRaw(poks[1].n, d, closeShift); }
            let otwNeeded = 3; let zamNeeded = 3;
            let assignSale = (emp, isOtw) => { if(isOtw) { saveVRaw(emp.n, d, openShift); otwNeeded--; } else { saveVRaw(emp.n, d, closeShift); zamNeeded--; } sales = sales.filter(e => e.n !== emp.n); };
            let it = sales.find(e => e.dept === 'IT'); if(it) assignSale(it, true); 
            let agd = sales.find(e => e.dept === 'AGD'); if(agd) assignSale(agd, false); 
            for(let i=0; i<sales.length && (otwNeeded>0 || zamNeeded>0); i++) { if(otwNeeded > 0) { assignSale(sales[i], true); i--; } else if (zamNeeded > 0) { assignSale(sales[i], false); i--; } }
        }

        let allBalanced = false; let iterations = 0;
        while(!allBalanced && iterations < 3000) {
            allBalanced = true; let strict = iterations < 1500;
            let status = employees.map(e => ({ e, target: baseNorm, current: calcRealH(e.n), diff: baseNorm - calcRealH(e.n) }));
            shuffle(status); status.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));

            for(let st of status) {
                if(st.diff === 0 || st.e.dept === 'ME') continue; allBalanced = false; let emp = st.e; let done = false;
                if(st.diff > 0) {
                    for(let d=1; d<=days; d++) { if(isWorkDay(d) && getShiftOnly(emp.n, d)==="" && getStreak(emp.n,d)<5) { saveVRaw(emp.n, d, openShift); done = true; break; } }
                } else if(st.diff < 0) {
                    for(let d=1; d<=days; d++) { let s=getShiftOnly(emp.n,d); if(s===openShift||s===closeShift||s===fullShift) { saveVRaw(emp.n, d, ""); done = true; break; } }
                }
                if(done) break;
            } iterations++;
        } render();
    }

    function render() {
        const days = new Date(year, curM + 1, 0).getDate(); const body = document.getElementById('daysBody'); const head = document.getElementById('workerRow');
        const baseNorm = document.getElementById('hourNormInput') ? parseInt(document.getElementById('hourNormInput').value) : 160;
        const isLocked = localStorage.getItem(`locked_${year}_${curM}`) === 'true';
        
        if(isManagerOrKss) {
            const genBtn = document.getElementById('genBtn'); const clrBtn = document.getElementById('clearBtn'); const appBtn = document.getElementById('approveBtn');
            genBtn.disabled = isLocked; clrBtn.disabled = isLocked; genBtn.style.opacity = isLocked ? '0.3' : '1'; clrBtn.style.opacity = isLocked ? '0.3' : '1';
            appBtn.innerText = isLocked ? '🔓 ODBLOKUJ' : '✅ ZATWIERDŹ'; appBtn.style.background = isLocked ? '#a00' : '#0a0'; appBtn.style.borderColor = isLocked ? '#a00' : '#0a0';
        }

        head.innerHTML = '<th class="date-col">DATA</th>';
        employees.forEach(e => { head.innerHTML += `<th><div class="avatar">${e.i}</div><div class="worker-name">${e.n}<br><span class="dept-tag ${e.dept==='ME'?'dept-me':''}">${e.dept}</span></div></th>`; });
        head.innerHTML += '<th class="obsada-col">OTW - SUMA - ZAM</th>';
        body.innerHTML = ""; const today = new Date(); const isCurrentMonth = today.getFullYear() === year && today.getMonth() === curM;

        for(let d=1; d<=days; d++) {
            let date = new Date(year, curM, d); let tr = document.createElement('tr');
            let ds = `${curM+1}-${d}`; let isHol = holidays2026.includes(ds); let isSun = date.getDay() === 0; let isSat = date.getDay() === 6;
            if(isSun || isHol) tr.className = 'sun'; else if(isSat) tr.className = 'sat';
            if(isCurrentMonth && today.getDate() === d) tr.classList.add('today-row');
            
            let dayName = ['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()];
            let html = `<td class="date-col" style="line-height:1.2;">${d} ${dayName}${(isHol&&!isSun)?`<br><span style="font-size:0.45rem;color:#f99;">(ŚWIĘTO)</span>`:''}</td>`; let o=0, z=0, suma=0;
            
            employees.forEach(e => {
                let shift = getShiftOnly(e.n, d); let roles = getRolesOnly(e.n, d); let cellClass = (shift === "Ż") ? 'wish-cell' : '';
                if(shift.includes('-')) { suma++; let p = shift.split('-'); if(parseInt(p[0]) <= 10) o++; if(parseInt(p[1]) >= 20) z++; }
                let ic = ''; if(roles.includes('K')) ic += '🔑'; if(roles.includes('D')) ic += '📦'; if(roles.includes('S')) ic += '☕';
                let displayHtml = `<div class="cell-shift">${shift}</div>`; if(ic) displayHtml += `<div class="cell-icons">${ic}</div>`;
                let clickAttr = (!isLocked && isManagerOrKss) ? `onclick="openEditModal('${e.n}', ${d})"` : '';
                html += `<td class="${cellClass}" ${clickAttr}>${displayHtml}</td>`;
            });
            html += `<td class="obsada-col">${o} - ${suma} - ${z}</td>`; tr.innerHTML = html; body.appendChild(tr);
        }

        const fSum = document.getElementById('sumRow'); fSum.innerHTML = '<td class="date-col">GODZINY</td>';
        employees.forEach(e => { let h = calcRealH(e.n); fSum.innerHTML += `<td style="color:${h==baseNorm?'#0f0':'#f44'}; font-size: 0.55rem;">${h} / ${baseNorm}</td>`; });
        fSum.innerHTML += '<td class="obsada-col"></td>';

        const fSat = document.getElementById('satCountRow'); fSat.innerHTML = '<td class="date-col">WOLNE SB</td>';
        employees.forEach(e => {
            let count = 0; if(e.dept !== 'ME') { for(let d=1; d<=days; d++) { if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) { let s = getShiftOnly(e.n, d); if(s===""||s==="URLOP"||s==="Ż"||s==="SZK") count++; } } }
            fSat.innerHTML += `<td style="color:${count>=1 && count<=2 ?'#ffe800':'#888'}">${e.dept==='ME'?'-':count}</td>`;
        });
        fSat.innerHTML += '<td class="obsada-col"></td>';
    }

    function renderSettings() {
        const grid = document.getElementById('workerGrid'); grid.innerHTML = "";
        employees.forEach(e => {
            let savedZ = localStorage.getItem(`set_z_${year}_${curM}_${e.n}`) || ""; let savedU1 = localStorage.getItem(`set_u1_${year}_${curM}_${e.n}`) || ""; let savedU2 = localStorage.getItem(`set_u2_${year}_${curM}_${e.n}`) || "";
            grid.innerHTML += `<div class="worker-card"><div style="color:#ffe800; font-weight:900; font-size:0.7rem;">${e.n} <span style="color:#666; font-size:0.5rem">(${e.dept})</span></div><label>ŻYCZENIA (Dni np. 5,12):</label><input id="z_${e.n}" value="${savedZ}"><label>URLOP (Od-Do np. 1-7):</label><div style="display:flex; gap:2px"><input id="u1_${e.n}" placeholder="Od" value="${savedU1}"><input id="u2_${e.n}" placeholder="Do" value="${savedU2}"></div></div>`;
        });
    }

    function saveSettings() {
        const days = new Date(year, curM + 1, 0).getDate();
        employees.forEach(e => { for(let d=1; d<=days; d++) { let s = getShiftOnly(e.n, d); if(s === "URLOP" || s === "Ż") saveVRaw(e.n, d, ""); } });
        employees.forEach(e => {
            let z = document.getElementById(`z_${e.n}`)?.value.trim() || ""; let u1 = document.getElementById(`u1_${e.n}`)?.value.trim() || ""; let u2 = document.getElementById(`u2_${e.n}`)?.value.trim() || "";
            localStorage.setItem(`set_z_${year}_${curM}_${e.n}`, z); localStorage.setItem(`set_u1_${year}_${curM}_${e.n}`, u1); localStorage.setItem(`set_u2_${year}_${curM}_${e.n}`, u2);
            if(z) { z.split(',').forEach(d => { let dayNum = parseInt(d.trim()); if(!isNaN(dayNum) && dayNum >= 1 && dayNum <= days) saveVRaw(e.n, dayNum, "Ż"); }); }
            if(u1 && u2) { let start = parseInt(u1); let end = parseInt(u2); if(!isNaN(start) && !isNaN(end)) { for(let d=start; d<=end; d++) { if(d >= 1 && d <= days && isWorkDay(d)) saveVRaw(e.n, d, "URLOP"); } } }
        });
        toggleModal(false); render();
    }

    function setMonth(i) { curM = i; loadNorm(); renderMonths(); render(); }
    function renderMonths() { const div = document.getElementById('monthSelector'); div.innerHTML = ""; months.forEach((m, i) => { const b = document.createElement('button'); b.className = `month-btn ${i === curM ? 'active' : ''}`; b.innerText = m; b.onclick = () => setMonth(i); div.appendChild(b); }); }
    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function toggleModal(s) { document.getElementById('settingsModal').style.display = s ? 'flex' : 'none'; if(s) renderSettings(); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    window.onload = () => { setMonth(curM); };
</script>
