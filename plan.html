<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; overflow-x: hidden; }

        header { 
            background: #ffe800; height: 50px; display: flex; 
            align-items: center; justify-content: center; position: sticky; 
            top: 0; z-index: 2000; 
        }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }

        /* PASEK NAD TABELĄ */
        .top-controls {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #080808; border-bottom: 1px solid #222;
        }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; }
        .month-btn {
            padding: 8px 15px; border-radius: 20px; border: 1px solid #222;
            background: #111; color: #555; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer;
        }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }

        .gear-btn { font-size: 1.8rem; cursor: pointer; color: #ffe800; }

        /* ADMIN BAR */
        .admin-bar {
            background: #111; padding: 10px; border-bottom: 1px solid #ffe800;
            display: flex; justify-content: center; gap: 15px; align-items: center;
        }
        .btn-gen {
            background: #ffe800; color: #000; border: none; padding: 8px 15px;
            font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.7rem;
        }

        /* TABLE STYLES */
        .table-wrapper { overflow: auto; height: calc(100vh - 230px); }
        table { border-collapse: collapse; width: 100%; }
        thead th { background: #080808; position: sticky; top: 0; z-index: 100; padding: 10px 5px; min-width: 90px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.8rem; }
        .worker-name { font-size: 0.6rem; font-weight: 900; text-transform: uppercase; }

        .date-col { position: sticky; left: 0; background: #080808; z-index: 150; width: 110px; font-size: 0.7rem; font-weight: 700; color: #777; text-align: center; border-right: 2px solid #ffe800; }

        /* NIEDZIELE */
        .sunday-red { background: #550000 !important; }
        .sunday-red input { visibility: hidden; }
        .sunday-handlowa { background: #004400 !important; }

        td, th { border-bottom: 1px solid #151515; border-right: 1px solid #151515; height: 45px; }
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.8rem; outline: none; }
        
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.85rem; text-align: center; position: sticky; bottom: 0; z-index: 100; border-top: 2px solid #ffe800; height: 50px; }

        /* MODAL ŻYCZEŃ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #111; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 600px; border-radius: 15px; max-height: 85vh; overflow-y: auto; }
        .wish-table { width: 100%; color: white; border-collapse: collapse; margin-top: 15px; }
        .wish-table th { color: #ffe800; font-size: 0.7rem; text-align: left; padding: 10px; border-bottom: 1px solid #222; }
        .wish-table td { padding: 10px; border-bottom: 1px solid #222; font-size: 0.75rem; }
        .btn-wish { padding: 5px 10px; border-radius: 5px; border: none; font-weight: 900; cursor: pointer; font-size: 0.6rem; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="admin-bar" id="adminBar" style="display:none;">
    <button class="btn-gen" onclick="generateAutoPlan()">🚀 Generuj Autoplan</button>
    <button class="btn-gen" style="background:#444; color:white;" onclick="clearCurrentMonth()">Czyść Miesiąc</button>
    <span style="font-size:0.6rem; margin-left:10px;">LIMIT H:</span>
    <input type="number" id="hourNorm" style="width:55px; background:#000; color:#ffe800; border:1px solid #ffe800; text-align:center;" value="160">
</div>

<div class="top-controls">
    <div class="month-selector" id="monthSelector"></div>
    <div class="gear-btn" id="gearBtn" style="display:none;" onclick="toggleModal(true)">⚙️</div>
</div>

<div class="table-wrapper">
    <table id="planTable">
        <thead><tr id="workerRow"><th class="date-col">DATA</th></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot><tr id="sumRow"><td class="date-col">SUMA H</td></tr></tfoot>
    </table>
</div>

<div class="modal" id="wishModal">
    <div class="modal-content">
        <h2 style="color:#ffe800; font-size:1rem;">PANEL ZARZĄDZANIA WOLNYM</h2>
        <input type="number" id="wishDay" placeholder="Wybierz dzień miesiąca" style="width:100%; padding:12px; background:#000; color:white; border:1px solid #333; margin: 15px 0;">
        
        <table class="wish-table">
            <thead>
                <tr><th>PRACOWNIK</th><th>AKCJA</th></tr>
            </thead>
            <tbody id="wishListBody"></tbody>
        </table>
        
        <button class="btn-gen" style="width:100%; margin-top:20px;" onclick="toggleModal(false)">ZAMKNIJ</button>
    </div>
</div>

<script>
    const employees = [
        {n: "PAWEŁ", d: "KE", i: "P", id: "03060", dept: "ADM"},
        {n: "MICHAŁ", d: "KSS", i: "M", id: "300100965", dept: "DZI"},
        {n: "NATALIA", d: "POK", i: "N", id: "300101555", dept: "POK"},
        {n: "MAGDA", d: "POK", i: "M", id: "39544", dept: "POK"},
        {n: "JAKUB", d: "IT", i: "J", id: "300101019", dept: "DZI"},
        {n: "ADRIAN", d: "IT", i: "A", id: "30662", dept: "DZI"},
        {n: "DAWID", d: "IT", i: "D", id: "300101107", dept: "DZI"},
        {n: "DAREK", d: "IT", i: "D", id: "40556", dept: "DZI"},
        {n: "ŁUKASZ", d: "AGD", i: "Ł", id: "30378", dept: "DZI"},
        {n: "ILONA", d: "AGD", i: "I", id: "300101413", dept: "DZI"},
        {n: "ARIEL", d: "RTV", i: "A", id: "31020", dept: "DZI"}
    ];

    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    let currentMonthIdx = 1; 
    const handlowe2026 = ["2026-01-25", "2026-03-29", "2026-04-26"];

    const loggedID = localStorage.getItem('loggedCharID');
    const isAdmin = (loggedID === "03060" || loggedID === "300101107");

    function init() {
        if(isAdmin) {
            document.getElementById('adminBar').style.display = 'flex';
            document.getElementById('gearBtn').style.display = 'block';
        }
        renderMonths();
        renderTable();
        renderWishList();
    }

    function renderMonths() {
        const container = document.getElementById('monthSelector');
        container.innerHTML = "";
        months.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.className = `month-btn ${idx === currentMonthIdx ? 'active' : ''}`;
            btn.innerText = m;
            btn.onclick = () => { currentMonthIdx = idx; renderMonths(); renderTable(); };
            container.appendChild(btn);
        });
    }

    function renderTable() {
        const workerRow = document.getElementById('workerRow');
        const daysBody = document.getElementById('daysBody');
        const sumRow = document.getElementById('sumRow');

        workerRow.innerHTML = '<th class="date-col">DATA</th>';
        daysBody.innerHTML = '';
        sumRow.innerHTML = '<td class="date-col">SUMA H</td>';

        employees.forEach(emp => {
            workerRow.innerHTML += `<th><span class="dept-code">${emp.d}</span><div class="avatar">${emp.i}</div><div class="worker-name">${emp.n}</div></th>`;
            sumRow.innerHTML += `<td id="sum-${emp.n}" style="color:#ffe800">0h</td>`;
        });

        const daysInMonth = new Date(2026, currentMonthIdx + 1, 0).getDate();

        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(2026, currentMonthIdx, d);
            const isSun = date.getDay() === 0;
            const dateStr = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isHandlowa = handlowe2026.includes(dateStr);

            const tr = document.createElement('tr');
            if(isSun) tr.className = isHandlowa ? 'sunday-handlowa' : 'sunday-red';

            let rowHtml = `<td class="date-col">${d} ${["NIEDZ.", "PON.", "WT.", "ŚR.", "CZW.", "PT.", "SOB."][date.getDay()]}</td>`;
            employees.forEach(emp => {
                const key = `plan_${months[currentMonthIdx]}_${emp.n}_d${d}`;
                const val = localStorage.getItem(key) || "";
                const isDisabled = (emp.n === "PAWEŁ" && loggedID !== "03060") || !isAdmin;
                rowHtml += `<td><input type="text" id="input_${emp.n}_${d}" value="${val}" ${isDisabled ? 'disabled' : ''} onchange="saveVal('${emp.n}', ${d}, this.value)"></td>`;
            });
            tr.innerHTML = rowHtml;
            daysBody.appendChild(tr);
        }
        updateAllSums();
    }

    function renderWishList() {
        const body = document.getElementById('wishListBody');
        body.innerHTML = "";
        employees.filter(e => e.n !== "PAWEŁ").forEach(emp => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${emp.n}</td>
                <td>
                    <button class="btn-wish" style="background:#ffe800; color:#000;" onclick="setWish('${emp.n}', 'W')">ŻYCZENIE</button>
                    <button class="btn-wish" style="background:#00aaff; color:#fff;" onclick="setWish('${emp.n}', 'URLOP')">URLOP</button>
                </td>
            `;
            body.appendChild(tr);
        });
    }

    function setWish(name, type) {
        const d = document.getElementById('wishDay').value;
        if(!d) return alert("Wpisz dzień!");
        saveVal(name, d, type);
        renderTable();
    }

    function saveVal(name, day, val) {
        localStorage.setItem(`plan_${months[currentMonthIdx]}_${name}_d${day}`, val);
        updateAllSums();
    }

    function updateAllSums() {
        employees.forEach(emp => {
            let total = 0;
            const daysInMonth = new Date(2026, currentMonthIdx + 1, 0).getDate();
            for(let d=1; d<=daysInMonth; d++) {
                const val = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`) || "";
                if(val.includes('-')) {
                    const times = val.split('-');
                    const s = parseInt(times[0]);
                    const e = parseInt(times[1]);
                    if(!isNaN(s) && !isNaN(e)) total += (e - s);
                }
            }
            const el = document.getElementById(`sum-${emp.n}`);
            if(el) el.innerText = total + "h";
        });
    }

    function generateAutoPlan() {
        const daysInMonth = new Date(2026, currentMonthIdx + 1, 0).getDate();
        const norm = parseInt(document.getElementById('hourNorm').value);
        
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            let currentHours = 0;
            let streak = 0;

            for(let d = 1; d <= daysInMonth; d++) {
                const date = new Date(2026, currentMonthIdx, d);
                const isSun = date.getDay() === 0;
                const isSat = date.getDay() === 6;
                const dateStr = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

                if(isSun && !handlowe2026.includes(dateStr)) { streak = 0; continue; }

                const existing = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`);
                if(existing === "W" || existing === "URLOP") { streak = 0; continue; }

                if(streak < 5 && currentHours < norm) {
                    let shift = isSat ? "10-20" : "10-18";
                    let h = isSat ? 10 : 8;
                    
                    // PROSTA LOGIKA POK (Przykładowa rotacja zmian rano/wieczór)
                    if(emp.dept === "POK" && d % 2 === 0) shift = "12-20";

                    saveVal(emp, d, shift);
                    currentHours += h;
                    streak++;
                } else {
                    saveVal(emp, d, "W");
                    streak = 0;
                }
            }
        });
        renderTable();
        alert("Autoplan wygenerowany!");
    }

    function toggleModal(show) { document.getElementById('wishModal').style.display = show ? 'flex' : 'none'; }
    function clearCurrentMonth() { if(confirm("Czyścić?")) { localStorage.clear(); location.reload(); } }
    function toggleSidebar() { /* Tu Twój kod sidebar */ }

    window.onload = init;
</script>
</body>
</html>
