<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; overflow-x: hidden; }

        header { 
            background: #ffe800; height: 50px; display: flex; 
            align-items: center; justify-content: center; position: sticky; 
            top: 0; z-index: 9999; 
        }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }

        /* PASEK NARZĘDZI - PRZYKLEJONY */
        .top-nav-bar { 
            background: #111; 
            border-bottom: 2px solid #ffe800; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 15px; 
            position: sticky;
            top: 50px; 
            z-index: 9998;
        }

        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; max-width: 60%; }
        .month-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid #222; background: #111; color: #555; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }

        .admin-tools { display: flex; align-items: center; gap: 15px; }
        .norm-input { width: 55px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; }
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 15px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.7rem; }
        .gear-btn { font-size: 1.8rem; cursor: pointer; color: #ffe800; }

        /* TABELA - PRZYWRÓCONY WYGLĄD PRACOWNIKÓW */
        .table-wrapper { overflow: auto; height: calc(100vh - 120px); width: 100vw; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        thead th { background: #080808; position: sticky; top: 0; z-index: 100; padding: 10px 5px; border-bottom: 2px solid #222; }
        
        .avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.7rem; }
        .worker-name { font-size: 0.55rem; font-weight: 900; text-transform: uppercase; }
        
        .date-col { position: sticky; left: 0; background: #080808; z-index: 150; width: 90px; font-size: 0.65rem; font-weight: 700; color: #777; text-align: center; border-right: 2px solid #ffe800; }

        td { border-bottom: 1px solid #151515; border-right: 1px solid #151515; height: 40px; }
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.75rem; outline: none; }
        
        .sunday-red { background: #440000 !important; }
        .sunday-handlowa { background: #003300 !important; }
        .sat-yellow { background: #222200; }
        .val-w { color: #ffe800 !important; font-style: italic; }
        .val-urlop { color: #00aaff !important; font-weight: 900; }

        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.8rem; text-align: center; position: sticky; bottom: 0; z-index: 100; border-top: 2px solid #ffe800; height: 50px; }

        /* SIDEBAR & MODAL */
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9999; }
        .overlay.active { display: block; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 11000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 600px; border-radius: 15px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link">Strona główna</a>
    <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="top-nav-bar">
    <div class="month-selector" id="monthSelector"></div>
    <div class="admin-tools" id="adminTools">
        <div style="display:flex; align-items:center; gap:5px;">
            <span style="font-size:0.6rem; font-weight:900; color:#ffe800;">NORMA:</span>
            <input type="number" id="hourNormInput" class="norm-input">
        </div>
        <button class="btn-gen" onclick="generateAutoPlan()">🚀 AUTO</button>
        <div class="gear-btn" onclick="toggleModal(true)">⚙️</div>
    </div>
</div>

<div class="table-wrapper">
    <table id="planTable">
        <thead><tr id="workerRow"><th class="date-col">DATA</th></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot><tr id="sumRow"><td class="date-col">SUMA H</td></tr></tfoot>
    </table>
</div>

<div class="modal" id="wishModal">
    <div class="modal-content">
        <h3 style="color:#ffe800; text-align:center; margin-bottom:15px; font-size:1rem;">USTAWIENIA MIESIĘCZNE</h3>
        <div id="wishGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 350px; overflow-y: auto;"></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-gen" style="flex:1" onclick="applySettings()">ZAPISZ I ZASTOSUJ</button>
            <button class="btn-gen" style="flex:1; background:#333; color:white;" onclick="toggleModal(false)">ZAMKNIJ</button>
        </div>
    </div>
</div>

<script>
    const employees = [
        {n: "PAWEŁ", i: "P", id: "03060"}, {n: "MICHAŁ", i: "M", id: "300100965"},
        {n: "NATALIA", i: "N", id: "300101555"}, {n: "MAGDA", i: "M", id: "39544"},
        {n: "JAKUB", i: "J", id: "300101019"}, {n: "ADRIAN", i: "A", id: "30662"},
        {n: "DAWID", i: "D", id: "300101107"}, {n: "DAREK", i: "D", id: "40556"},
        {n: "ŁUKASZ", i: "Ł", id: "30378"}, {n: "ILONA", i: "I", id: "300101413"},
        {n: "ARIEL", i: "A", id: "31020"}
    ];

    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    let currentMonthIdx = 2; // Marzec 2026
    const handlowe2026 = ["2026-01-25", "2026-04-26", "2026-06-28", "2026-08-30", "2026-12-13", "2026-12-20"];
    
    const loggedID = localStorage.getItem('loggedCharID');
    const isAdmin = (loggedID === "03060" || loggedID === "300101107");

    function init() {
        if(!isAdmin) document.getElementById('adminTools').style.display = 'none';
        renderMonths(); renderTable(); renderWishForm();
    }

    function renderMonths() {
        const container = document.getElementById('monthSelector');
        container.innerHTML = "";
        months.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.className = `month-btn ${idx === currentMonthIdx ? 'active' : ''}`;
            btn.innerText = m;
            btn.onclick = () => { 
                currentMonthIdx = idx; 
                document.getElementById('hourNormInput').value = localStorage.getItem(`norma_${months[idx]}`) || "176";
                renderMonths(); renderTable(); 
            };
            container.appendChild(btn);
        });
        document.getElementById('hourNormInput').value = localStorage.getItem(`norma_${months[currentMonthIdx]}`) || "176";
    }

    function renderTable() {
        const workerRow = document.getElementById('workerRow');
        const daysBody = document.getElementById('daysBody');
        const sumRow = document.getElementById('sumRow');
        workerRow.innerHTML = '<th class="date-col">DATA</th>';
        daysBody.innerHTML = '';
        sumRow.innerHTML = '<td class="date-col">SUMA H</td>';

        employees.forEach(emp => {
            workerRow.innerHTML += `<th><div class="avatar">${emp.i}</div><div class="worker-name">${emp.n}</div></th>`;
            sumRow.innerHTML += `<td id="sum-${emp.n}">0h</td>`;
        });

        const days = new Date(2026, currentMonthIdx + 1, 0).getDate();
        for (let d = 1; d <= days; d++) {
            const date = new Date(2026, currentMonthIdx, d);
            const isSun = date.getDay() === 0;
            const dateStr = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tr = document.createElement('tr');
            if(isSun) tr.className = handlowe2026.includes(dateStr) ? 'sunday-handlowa' : 'sunday-red';
            else if(date.getDay() === 6) tr.className = 'sat-yellow';

            let html = `<td class="date-col">${d} ${["ND", "PN", "WT", "ŚR", "CZ", "PT", "SB"][date.getDay()]}</td>`;
            employees.forEach(emp => {
                const val = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`) || "";
                let cls = val === "W" ? "val-w" : (val === "URLOP" ? "val-urlop" : "");
                html += `<td><input type="text" class="${cls}" value="${val}" ${!isAdmin ? 'disabled' : ''} onchange="saveVal('${emp.n}', ${d}, this.value)"></td>`;
            });
            tr.innerHTML = html;
            daysBody.appendChild(tr);
        }
        updateSums();
    }

    function saveVal(name, d, v) {
        localStorage.setItem(`plan_${months[currentMonthIdx]}_${name}_d${d}`, v.toUpperCase());
        updateSums();
    }

    function updateSums() {
        employees.forEach(emp => {
            let total = 0;
            const days = new Date(2026, currentMonthIdx + 1, 0).getDate();
            for(let d=1; d<=days; d++){
                const v = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`) || "";
                if(v.includes('-')) {
                    const t = v.split('-'); total += (parseInt(t[1]) - parseInt(t[0]));
                } else if(v === "URLOP") total += 8;
            }
            document.getElementById(`sum-${emp.n}`).innerText = total + "h";
        });
    }

    function renderWishForm() {
        const grid = document.getElementById('wishGrid');
        grid.innerHTML = "";
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            grid.innerHTML += `<div style="background:#111; padding:10px; border-radius:8px; border:1px solid #222;">
                <label style="font-size:0.7rem; color:#ffe800; font-weight:900;">${emp.n}</label>
                <input type="text" id="w_${emp.n}" placeholder="Dni wolne" style="width:100%; background:#000; color:white; border:1px solid #333; margin:5px 0; padding:4px;">
                <input type="text" id="u_${emp.n}" placeholder="Urlop" style="width:100%; background:#000; color:white; border:1px solid #333; padding:4px;">
            </div>`;
        });
    }

    function applySettings() {
        localStorage.setItem(`norma_${months[currentMonthIdx]}`, document.getElementById('hourNormInput').value);
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            const w = document.getElementById(`w_${emp.n}`).value.split(',');
            const u = document.getElementById(`u_${emp.n}`).value.split(',');
            w.forEach(d => { if(d.trim()) saveVal(emp.n, d.trim(), "W"); });
            u.forEach(d => { if(d.trim()) saveVal(emp.n, d.trim(), "URLOP"); });
        });
        renderTable(); toggleModal(false);
    }

    function generateAutoPlan() {
        const norm = parseInt(document.getElementById('hourNormInput').value) || 176;
        const days = new Date(2026, currentMonthIdx + 1, 0).getDate();
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            let curH = 0; let streak = 0;
            for(let d=1; d<=days; d++) {
                const date = new Date(2026, currentMonthIdx, d);
                const isSun = date.getDay() === 0;
                const isSat = date.getDay() === 6;
                const dateStr = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const exists = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`);
                if(exists === "URLOP") { curH += 8; streak++; continue; }
                if(exists === "W" || (isSun && !handlowe2026.includes(dateStr))) { streak = 0; continue; }
                if(exists && exists.includes('-')) { 
                    const t = exists.split('-'); curH += (parseInt(t[1]) - parseInt(t[0])); streak++; continue; 
                }
                if(curH < norm && streak < 5) {
                    let s = isSat ? "10-20" : (Math.random() > 0.5 ? "10-18" : "12-20");
                    saveVal(emp.n, d, s); curH += (isSat ? 10 : 8); streak++;
                } else { saveVal(emp.n, d, "W"); streak = 0; }
            }
        });
        renderTable();
    }

    function toggleModal(s) { document.getElementById('wishModal').style.display = s ? 'flex' : 'none'; }
    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    window.onload = init;
</script>
</body>
</html>
