<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; z-index: 9000; display: flex; flex-direction: column; }
        .month-row { display: flex; align-items: center; padding: 10px 15px; gap: 10px; }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-grow: 1; }
        .month-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid #222; background: #111; color: #666; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        
        .admin-controls { display: flex; align-items: center; gap: 12px; padding-left: 15px; border-left: 1px solid #333; }
        .norm-input { width: 65px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; }
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 15px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.7rem; white-space: nowrap; }
        .btn-clear { background: #333; color: #ff4444; border: 1px solid #ff4444; }
        .gear-btn { font-size: 1.8rem; cursor: pointer; color: #ffe800; line-height: 1; }

        .table-container { flex-grow: 1; overflow: auto; position: relative; z-index: 100; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        thead th { background: #080808; position: sticky; top: 0; z-index: 500; padding: 12px 5px; border-bottom: 2px solid #222; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.75rem; }
        .worker-name { font-size: 0.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .date-col { position: sticky; left: 0; background: #080808; z-index: 600; width: 85px; font-size: 0.7rem; font-weight: 700; color: #777; text-align: center; border-right: 2px solid #ffe800; }
        td { border-bottom: 1px solid #151515; border-right: 1px solid #151515; height: 42px; }
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.8rem; outline: none; }
        
        .val-z { color: #ffe800 !important; font-weight: 900; }
        .val-urlop { color: #00aaff !important; font-weight: 900; }
        .sunday-red { background: #330000 !important; }
        .sunday-handlowa { background: #002200 !important; }
        .sat-yellow { background: #1a1a00 !important; }
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.85rem; text-align: center; position: sticky; bottom: 0; z-index: 500; border-top: 2px solid #ffe800; height: 50px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 11000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 850px; border-radius: 15px; max-height: 90vh; overflow-y: auto; }
        .section-title { color: #ffe800; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; margin: 15px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .shop-settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #151515; padding: 15px; border-radius: 8px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .worker-card { background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; }
        .card-input { width: 100%; background: #000; border: 1px solid #444; color: white; padding: 6px; font-size: 0.7rem; margin-top: 4px; border-radius: 4px; }
        .label-text { font-size: 0.55rem; color: #888; display: block; margin-top: 5px; font-weight: 700; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link">Strona główna</a>
    <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="navigation-area">
    <div class="month-row">
        <div class="month-selector" id="monthSelector"></div>
        <div class="admin-controls" id="adminTools">
            <div style="display:flex; align-items:center; gap:5px;">
                <span style="font-size:0.6rem; font-weight:900; color:#ffe800;">NORMA:</span>
                <input type="number" id="hourNormInput" class="norm-input" value="160">
            </div>
            <button class="btn-gen" onclick="generateAutoPlan()">🚀 AUTOPLAN</button>
            <button class="btn-gen btn-clear" onclick="clearFullMonth()">🗑️ WYCZYŚĆ</button>
            <div class="gear-btn" onclick="toggleModal(true)">⚙️</div>
        </div>
    </div>
</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot><tr id="sumRow"></tr></tfoot>
    </table>
</div>

<div class="modal" id="wishModal">
    <div class="modal-content">
        <div class="section-title">ZAKRESY PRACY I SKLEP (GLOBALNE)</div>
        <div class="shop-settings">
            <div>
                <span class="label-text">OTWARCIE:</span>
                <input type="text" id="shopOpen" class="card-input" value="10:00">
            </div>
            <div>
                <span class="label-text">ZAMKNIĘCIE:</span>
                <input type="text" id="shopClose" class="card-input" value="20:00">
            </div>
            <div>
                <span class="label-text">ZAKRESY PRACY (OD-DO):</span>
                <input type="text" id="globalShifts" class="card-input" value="10-20, 10-18, 12-20, 13-20">
            </div>
        </div>

        <div class="section-title">ŻYCZENIA I URLOPY (PRACOWNICY)</div>
        <div class="worker-grid" id="workerGrid"></div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-gen" style="flex:1; height:45px;" onclick="applySettings()">ZAPISZ I ODŚWIEŻ</button>
            <button class="btn-gen" style="flex:1; height:45px; background:#333; color:white;" onclick="toggleModal(false)">ANULUJ</button>
        </div>
    </div>
</div>

<script>
    const employees = [
        {n: "PAWEŁ", i: "P"}, {n: "MICHAŁ", i: "M"}, {n: "NATALIA", i: "N"}, 
        {n: "MAGDA", i: "M"}, {n: "JAKUB", i: "J"}, {n: "ADRIAN", i: "A"}, 
        {n: "DAWID", i: "D"}, {n: "DAREK", i: "D"}, {n: "ŁUKASZ", i: "Ł"}, 
        {n: "ILONA", i: "I"}, {n: "ARIEL", i: "A"}
    ];

    const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
    let currentMonthIdx = 1; 
    const handlowe2026 = ["2026-01-25", "2026-04-26", "2026-06-28", "2026-08-30", "2026-12-13", "2026-12-20"];

    function init() {
        renderMonths(); renderTable(); renderWishForm();
    }

    function getEmpHours(name) {
        let total = 0;
        const daysCount = new Date(2026, currentMonthIdx + 1, 0).getDate();
        for(let d = 1; d <= daysCount; d++) {
            const v = localStorage.getItem(`plan_${months[currentMonthIdx]}_${name}_d${d}`) || "";
            if(v.includes('-')) {
                const parts = v.split('-');
                total += (parseInt(parts[1]) - parseInt(parts[0]));
            } else if(v === "URLOP") total += 8;
        }
        return total;
    }

    function generateAutoPlan() {
        const norm = parseInt(document.getElementById('hourNormInput').value) || 160;
        const shifts = (localStorage.getItem(`global_shifts_${months[currentMonthIdx]}`) || "10-20, 10-18, 12-20, 13-20").split(',').map(s => s.trim());
        const daysCount = new Date(2026, currentMonthIdx + 1, 0).getDate();

        // 1. Czyścimy stare wpisy (zostawiamy Ż i URLOP)
        employees.forEach(emp => {
            for(let d=1; d<=daysCount; d++) {
                const v = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`) || "";
                if(v !== "Ż" && v !== "URLOP") localStorage.removeItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`);
            }
        });

        // 2. Najpierw POK i Soboty (obowiązkowe)
        for(let d=1; d<=daysCount; d++) {
            const date = new Date(2026, currentMonthIdx, d);
            const isSat = date.getDay() === 6;
            const ds = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            if(date.getDay() === 0 && !handlowe2026.includes(ds)) continue;

            const nV = localStorage.getItem(`plan_${months[currentMonthIdx]}_NATALIA_d${d}`);
            const mV = localStorage.getItem(`plan_${months[currentMonthIdx]}_MAGDA_d${d}`);
            if(!nV && !mV) {
                if(isSat) { saveVal("NATALIA", d, "10-20"); saveVal("MAGDA", d, "10-20"); }
                else { saveVal("NATALIA", d, "10-18"); saveVal("MAGDA", d, "13-20"); }
            }
            // Soboty dla reszty
            if(isSat) {
                employees.forEach(emp => {
                    if(emp.n!=="PAWEŁ" && !localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`)) saveVal(emp.n, d, "10-20");
                });
            }
        }

        // 3. Dopełnianie do NORMY (bezwzględne)
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            let currentH = getEmpHours(emp.n);
            let attempts = 0;

            while(currentH < norm - 4 && attempts < 100) {
                let randomDay = Math.floor(Math.random() * daysCount) + 1;
                const date = new Date(2026, currentMonthIdx, randomDay);
                const ds = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(randomDay).padStart(2,'0')}`;
                
                // Nie pracujemy w niedziele niehandlowe
                if(date.getDay() === 0 && !handlowe2026.includes(ds)) { attempts++; continue; }

                if(!localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${randomDay}`)) {
                    let rs = shifts[Math.floor(Math.random() * shifts.length)];
                    let h = parseInt(rs.split('-')[1]) - parseInt(rs.split('-')[0]);
                    
                    if(currentH + h <= norm + 4) {
                        saveVal(emp.n, randomDay, rs);
                        currentH += h;
                    }
                }
                attempts++;
            }
        });
        renderTable();
    }

    function saveVal(name, d, v) {
        localStorage.setItem(`plan_${months[currentMonthIdx]}_${name}_d${d}`, v.toUpperCase());
        updateSums();
    }

    function updateSums() {
        employees.forEach(emp => {
            const h = getEmpHours(emp.n);
            const el = document.getElementById(`sum-${emp.n}`);
            if(el) el.innerText = h + "h";
        });
    }

    function renderTable() {
        const workerRow = document.getElementById('workerRow');
        const sumRow = document.getElementById('sumRow');
        const daysBody = document.getElementById('daysBody');
        workerRow.innerHTML = '<th class="date-col">DATA</th>';
        sumRow.innerHTML = '<td class="date-col">SUMA H</td>';
        employees.forEach(emp => {
            workerRow.innerHTML += `<th><div class="avatar">${emp.i}</div><div class="worker-name">${emp.n}</div></th>`;
            sumRow.innerHTML += `<td id="sum-${emp.n}">0h</td>`;
        });
        const daysCount = new Date(2026, currentMonthIdx + 1, 0).getDate();
        daysBody.innerHTML = '';
        for (let d = 1; d <= daysCount; d++) {
            const date = new Date(2026, currentMonthIdx, d);
            const isSun = date.getDay() === 0;
            const isSat = date.getDay() === 6;
            const ds = `2026-${String(currentMonthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const tr = document.createElement('tr');
            if(isSun) tr.className = handlowe2026.includes(ds) ? 'sunday-handlowa' : 'sunday-red';
            else if(isSat) tr.className = 'sat-yellow';
            let html = `<td class="date-col">${d} ${["ND", "PN", "WT", "ŚR", "CZ", "PT", "SB"][date.getDay()]}</td>`;
            employees.forEach(emp => {
                const val = localStorage.getItem(`plan_${months[currentMonthIdx]}_${emp.n}_d${d}`) || "";
                let cls = (val === "Ż") ? "val-z" : (val === "URLOP" ? "val-urlop" : "");
                html += `<td><input type="text" class="${cls}" value="${val}" onchange="saveVal('${emp.n}', ${d}, this.value)"></td>`;
            });
            tr.innerHTML = html;
            daysBody.appendChild(tr);
        }
        updateSums();
    }

    function renderWishForm() {
        const grid = document.getElementById('workerGrid');
        grid.innerHTML = "";
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            grid.innerHTML += `
                <div class="worker-card">
                    <h4>${emp.n}</h4>
                    <span class="label-text">ŻYCZENIA (DNI):</span>
                    <div style="display:flex; gap:4px;"><input type="number" id="z1_${emp.n}" class="card-input" placeholder="1"><input type="number" id="z2_${emp.n}" class="card-input" placeholder="2"></div>
                    <span class="label-text">URLOP (OD-DO):</span>
                    <div style="display:flex; gap:4px;"><input type="number" id="u_od_${emp.n}" class="card-input" placeholder="Od"><input type="number" id="u_do_${emp.n}" class="card-input" placeholder="Do"></div>
                </div>`;
        });
    }

    function applySettings() {
        localStorage.setItem(`global_shifts_${months[currentMonthIdx]}`, document.getElementById('globalShifts').value);
        employees.forEach(emp => {
            if(emp.n === "PAWEŁ") return;
            const z1 = document.getElementById(`z1_${emp.n}`).value;
            const z2 = document.getElementById(`z2_${emp.n}`).value;
            const uOd = parseInt(document.getElementById(`u_od_${emp.n}`).value);
            const uDo = parseInt(document.getElementById(`u_do_${emp.n}`).value);
            if(z1) saveVal(emp.n, z1, "Ż"); if(z2) saveVal(emp.n, z2, "Ż");
            if(uOd && uDo) for(let i=uOd; i<=uDo; i++) saveVal(emp.n, i, "URLOP");
        });
        renderTable(); toggleModal(false);
    }

    function renderMonths() {
        const container = document.getElementById('monthSelector');
        container.innerHTML = "";
        months.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.className = `month-btn ${idx === currentMonthIdx ? 'active' : ''}`;
            btn.innerText = m;
            btn.onclick = () => { currentMonthIdx = idx; renderMonths(); renderTable(); };
            container.appendChild(btn);
        });
    }

    function clearFullMonth() {
        if(confirm("Wyczyścić?")) {
            employees.forEach(e => { for(let d=1; d<=31; d++) localStorage.removeItem(`plan_${months[currentMonthIdx]}_${e.n}_d${d}`); });
            renderTable();
        }
    }

    function toggleModal(s) { document.getElementById('wishModal').style.display = s ? 'flex' : 'none'; }
    function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    window.onload = init;
</script>
</body>
</html>
