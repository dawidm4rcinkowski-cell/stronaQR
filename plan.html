<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="menu-btn" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
        <div class="logo">MEDIA <span>EXPERT</span></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">MENU</div>
        <a href="index.html" class="sidebar-link">STRONA GŁÓWNA</a>
        <a href="plan.html" class="sidebar-link">PLAN PRACY</a>
        <a href="qr.html" class="sidebar-link">KOD QR</a>
    </nav>

    <main class="main-dashboard">
        <div style="text-align: center; margin-bottom: 20px;">
            <select id="monthSelect" onchange="generateTable()" style="background: #000; color: #ffe800; border: 2px solid #ffe800; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer;">
                </select>
        </div>

        <div class="legend-container">
            <div class="legend-item"><div class="dot dot-socjal"></div> SOCJAL</div>
            <div class="legend-item"><div class="dot dot-klucze"></div> KLUCZE</div>
            <div class="legend-item"><div class="dot dot-dostawa"></div> DOSTAWA</div>
        </div>

        <div class="table-container">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th rowspan="2" class="date-col" style="width: 140px;">DATA</th>
                        <th colspan="1">KE</th>
                        <th colspan="1">KSS</th>
                        <th colspan="2">POK</th>
                        <th colspan="4">IT</th>
                        <th colspan="2">AGD</th>
                        <th colspan="1">RTV</th>
                    </tr>
                    <tr>
                        <th>PAWEŁ</th>
                        <th>MICHAŁ</th>
                        <th>NATALIA</th>
                        <th>MAGDA</th>
                        <th>JAKUB</th>
                        <th>ADRIAN</th>
                        <th>DAWID</th>
                        <th>DAREK</th>
                        <th>ŁUKASZ</th>
                        <th>ILONA</th>
                        <th>ARIEL</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="java.js"></script>
    <script>
        window.onload = () => { 
            startClock(); 
            if(typeof initMonths === 'function') initMonths(); 
            if(typeof generateTable === 'function') generateTable(); 
        };
    </script>
</body>
</html>
