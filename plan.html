<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; overflow-x: hidden; }

        header { 
            background: #ffe800; height: 50px; display: flex; 
            align-items: center; justify-content: center; position: sticky; 
            top: 0; z-index: 2000; 
        }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }

        /* SELEKTOR MIESIĘCY */
        .month-selector {
            display: flex; justify-content: center; gap: 8px; padding: 20px 10px;
            overflow-x: auto; white-space: nowrap; background: #080808;
        }
        .month-btn {
            padding: 8px 15px; border-radius: 20px; border: 1px solid #222;
            background: #111; color: #555; font-size: 0.7rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }

        /* LEGENDA */
        .legend {
            display: flex; justify-content: center; gap: 20px; padding-bottom: 20px;
            font-size: 0.7rem; font-weight: 900; text-transform: uppercase;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        /* TABELA */
        .table-wrapper { overflow: auto; height: calc(100vh - 200px); border-top: 1px solid #ffe800; }
        table { border-collapse: collapse; width: 100%; }

        thead th { 
            background: #080808; position: sticky; top: 0; z-index: 100;
            padding: 15px 5px; min-width: 90px;
        }
        .dept-code { font-size: 0.55rem; color: #444; margin-bottom: 5px; display: block; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffe800;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px; font-weight: 900; color: #ffe800; font-size: 0.9rem;
        }
        .worker-name { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; }

        .date-col {
            position: sticky; left: 0; background: #080808; z-index: 150;
            width: 120px; font-size: 0.7rem; font-weight: 700; color: #777;
            text-align: center; border-right: 2px solid #ffe800;
        }
        .sunday { color: #ff4444 !important; background: #1a0a0a; }

        td, th { border-bottom: 1px solid #151515; border-right: 1px solid #151515; }
        td input {
            width: 100%; height: 45px; background: transparent; border: none;
            color: white; text-align: center; font-weight: 700; font-size: 0.8rem; outline: none;
        }
        /* STYL DLA ZABLOKOWANYCH PÓL */
        td input:disabled { color: #444; cursor: not-allowed; }

        tr:nth-child(even) { background: #0a0a0a; }

        /* SIDEBAR */
        .sidebar { 
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%; 
            background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 3000; 
        }
        .sidebar.active { left: 0; }
        .sidebar-header { background: #1a1a1a; color: #777; padding: 25px; font-weight: 900; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #222; }
        .sidebar-link { display: block; color: white; padding: 18px 25px; text-decoration: none; font-weight: 700; border-bottom: 1px solid #1a1a1a; }
        .sidebar-link.active { color: #ffe800; background: #111; border-left: 5px solid #ffe800; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2500; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">NAWIGACJA</div>
    <a href="index.html" class="sidebar-link">🏠 STRONA GŁÓWNA</a>
    <a href="plan.html" class="sidebar-link active">📅 PLAN PRACY</a>
    <a href="inwa.html" class="sidebar-link">📝 INWENTURY</a>
    <a href="kwt.html" class="sidebar-link">📋 KWT</a>
    <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="month-selector" id="monthSelector">
    <button class="month-btn" onclick="selectMonth(this)">Styczeń</button>
    <button class="month-btn active" onclick="selectMonth(this)">Luty</button>
    <button class="month-btn" onclick="selectMonth(this)">Marzec</button>
    <button class="month-btn" onclick="selectMonth(this)">Kwiecień</button>
    <button class="month-btn" onclick="selectMonth(this)">Maj</button>
    <button class="month-btn" onclick="selectMonth(this)">Czerwiec</button>
</div>

<div class="legend">
    <div class="legend-item"><div class="dot" style="background:#00aaff"></div> SOCJAL</div>
    <div class="legend-item"><div class="dot" style="background:#ff8800"></div> KLUCZE</div>
    <div class="legend-item"><div class="dot" style="background:#ffe800"></div> DOSTAWA</div>
</div>

<div class="table-wrapper">
    <table>
        <thead>
            <tr id="workerRow">
                <th class="date-col" style="top:0; border-bottom: 2px solid #ffe800;">DATA</th>
            </tr>
        </thead>
        <tbody id="daysBody"></tbody>
    </table>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    // Obsługa selektora miesięcy
    function selectMonth(btn) {
        document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const employees = [
        {n: "PAWEŁ", d: "KE", i: "P", id: "03060"}, 
        {n: "MICHAŁ", d: "KSS", i: "M", id: "300100965"},
        {n: "NATALIA", d: "POK", i: "N", id: "300101555"}, 
        {n: "MAGDA", d: "POK", i: "M", id: "39544"},
        {n: "JAKUB", d: "IT", i: "J", id: "300101019"}, 
        {n: "ADRIAN", d: "IT", i: "A", id: "30662"},
        {n: "DAWID", d: "IT", i: "D", id: "300101107"}, 
        {n: "DAREK", d: "IT", i: "D", id: "40556"},
        {n: "ŁUKASZ", d: "AGD", i: "Ł", id: "30378"}, 
        {n: "ILONA", d: "AGD", i: "I", id: "300101413"},
        {n: "ARIEL", d: "RTV", i: "A", id: "31020"}
    ];

    const daysCount = 28;
    const dayNames = ["NIEDZ.", "PON.", "WT.", "ŚR.", "CZW.", "PT.", "SOB."];

    function init() {
        const loggedID = localStorage.getItem('loggedCharID');
        if(!loggedID) { window.location.href = 'login.html'; return; }

        // SPRAWDZENIE UPRAWNIEŃ (Paweł lub Dawid)
        const isAdmin = (loggedID === "03060" || loggedID === "300101107");

        const workerRow = document.getElementById('workerRow');
        const daysBody = document.getElementById('daysBody');

        employees.forEach(emp => {
            const th = document.createElement('th');
            th.innerHTML = `
                <span class="dept-code">${emp.d}</span>
                <div class="avatar">${emp.i}</div>
                <div class="worker-name">${emp.n}</div>
            `;
            workerRow.appendChild(th);
        });

        for (let d = 1; d <= daysCount; d++) {
            const date = new Date(2026, 1, d); // Luty 2026
            const dayName = dayNames[date.getDay()];
            const isSunday = date.getDay() === 0;

            const tr = document.createElement('tr');
            if(isSunday) tr.classList.add('sunday');

            let rowHtml = `<td class="date-col ${isSunday ? 'sunday' : ''}">${d} ${dayName}</td>`;
            
            employees.forEach(emp => {
                const key = `plan_${emp.n}_d${d}`;
                const val = localStorage.getItem(key) || "";
                
                // Pole zablokowane, jeśli użytkownik nie jest adminem
                const disabledAttr = isAdmin ? "" : "disabled";
                
                rowHtml += `<td><input type="text" value="${val}" ${disabledAttr} onchange="localStorage.setItem('${key}', this.value)"></td>`;
            });

            tr.innerHTML = rowHtml;
            daysBody.appendChild(tr);
        }
    }

    window.onload = init;
</script>

</body>
</html>
