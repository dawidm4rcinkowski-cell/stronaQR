<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #111; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #111; border-left: 1px solid #222; border-top: 1px solid #222; }
        ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #e6d100; }
        
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; box-shadow: 0 2px 10px rgba(255, 232, 0, 0.2); }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; transition: 0.2s; }
        .menu-btn:hover { transform: scale(1.1); }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.8); }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; transition: 0.2s; }
        .sidebar-link:hover { background: #1a1a1a; color: #ffe800; padding-left: 35px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 800; }
        .month-row { display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-wrap: wrap; }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-grow: 1; padding-bottom: 2px; }
        .month-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #333; background: #000; color: #666; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; box-shadow: 0 0 10px rgba(255, 232, 0, 0.4); }
        .month-btn:hover:not(.active) { color: #fff; border-color: #555; }
        
        .admin-controls { display: flex; align-items: center; gap: 8px; border-left: 1px solid #333; padding-left: 10px; }
        .norm-input { width: 55px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; border-radius: 4px; outline: none; }
        
        /* POPRAWKA ROZCIĄGANIA TABELI - KONIEC Z CZARNYM PASKIEM */
        .table-container { flex-grow: 1; overflow: auto; background: #111; width: 100%; display: block; }
        table { border-collapse: collapse; width: 100%; min-width: 1100px; table-layout: fixed; background: #080808; }
        
        thead th { background: #151515; position: sticky; top: 0; z-index: 500; padding: 10px 2px; border-bottom: 3px solid #ffe800; border-right: 1px solid #222; }
        thead th:last-child { border-right: none; } /* Brak kreski na samym końcu */
        
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-weight: 900; color: #ffe800; font-size: 0.65rem; background: #000; box-shadow: 0 0 5px rgba(255, 232, 0, 0.3); }
        .worker-name { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; line-height: 1.2; color: #fff; letter-spacing: 0.5px; }
        .dept-tag { font-size: 0.45rem; font-weight: 900; color: #888; }
        .dept-me { color: #f44 !important; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }

        .date-col { position: sticky; left: 0; background: #111; z-index: 600; width: 85px; font-size: 0.65rem; font-weight: 900; color: #ccc; text-align: center; border-right: 2px solid #ffe800; border-left: 2px solid #ffe800; }
        .obsada-col { width: 110px; color: #ffe800; font-weight: 900; font-size: 0.6rem; background: #111; text-align: center; border-left: 2px solid #ffe800; border-right: none !important; } /* Przykleja się do scrolla */
        
        tbody tr { transition: background-color 0.2s; }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.05); }

        td { border-bottom: 1px solid #222; border-right: 1px solid #222; height: 38px; }
        td:last-child { border-right: none; } /* Brak prawej ramki na końcu ekranu */
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.8rem; outline: none; transition: 0.2s; cursor: pointer; }
        td input:focus, td input:hover { background: rgba(255, 232, 0, 0.15); }
        td input:disabled { color: #888; cursor: not-allowed; background: transparent; }
        
        /* KOLORYSTYKA DNI */
        .sun { background-color: #800000 !important; } 
        .sun:hover { background-color: #a00000 !important; }
        .sun .date-col { background-color: #a00000 !important; color: #fff; border-right-color: #ff4d4d; }
        .sun td { border-bottom-color: #600000; border-right-color: #600000; }
        
        .sat { background-color: #ffe800 !important; }
        .sat:hover { background-color: #ffed4a !important; }
        .sat .date-col { background-color: #e6d100 !important; color: #000; border-right-color: #000; }
        .sat input { color: #000 !important; font-weight: 900; text-shadow: none; }
        .sat input:focus, .sat input:hover { background: rgba(0, 0, 0, 0.1); }
        .sat td { border-bottom-color: #cca600; border-right-color: #cca600; }
        .sat .obsada-col { background-color: #e6d100 !important; color: #000; border-left-color: #000; }

        .wish-cell input { color: #d0a !important; font-weight: 900; background: rgba(221, 0, 170, 0.1); }
        
        /* AKTUALNY DZIEŃ */
        .today-row { position: relative; background-color: rgba(0, 255, 0, 0.1) !important; }
        .today-row::after { content: ''; position: absolute; inset: 0; border: 2px solid #0f0; pointer-events: none; z-index: 100; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2) inset; }
        .today-row .date-col { color: #0f0; background-color: #0a150a !important; border-right-color: #0f0; }
        .today-row input { color: #fff; }

        /* STOPKA PRAWIDŁOWY SZARY KOLOR (#111) */
        tfoot { position: sticky; bottom: 0; z-index: 700; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.65rem; text-align: center; border-top: 2px solid #ffe800; height: 35px; border-right: 1px solid #222; }
        tfoot td:last-child { border-right: none; }
        tfoot .date-col { background: #111; }
        tfoot .obsada-col { background: #111; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 800px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 232, 0, 0.15); }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; max-height: 60vh; overflow-y: auto; }
        .worker-card { background: #151515; padding: 10px; border-radius: 8px; border: 1px solid #333; transition: 0.3s; }
        .worker-card:hover { border-color: #ffe800; }
        .worker-card label { display: block; font-size: 0.5rem; color: #888; margin-top: 5px; }
        .worker-card input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 4px; font-size: 0.75rem; border-radius: 3px; outline: none; }
        .worker-card input:focus { border-color: #ffe800; }
        
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; transition: 0.3s; }
        .btn-gen:hover { transform: scale(1.05); box-shadow: 0 0 10px rgba(255, 232, 0, 0.5); }
        .btn-settings { background: #333; color: #ffe800; border: 1px solid #ffe800; padding: 8px 12px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.65rem; transition: 0.3s; }
        .btn-settings:hover { background: #ffe800; color: #000; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link">Strona główna</a>
    <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="navigation-area">
    <div class="month-row">
        <div class="month-selector" id="monthSelector"></div>
        <div class="admin-controls">
            <span style="font-size:0.55rem; font-weight:900; color:#888;">NORMA H:</span>
            <input type="number" id="hourNormInput" class="norm-input" value="160" onchange="saveNorm(this.value)">
            <button class="btn-settings" onclick="toggleModal(true)">⚙️ USTAWIENIA</button>
            <button class="btn-settings" style="background:#a00; color:#fff; border-color:#a00;" onclick="clearMonth()" id="clearBtn">🗑️ WYCZYŚĆ</button>
            <button class="btn-gen" onclick="startGeneration()" id="genBtn">🚀 GENERUJ</button>
            <button class="btn-settings" id="approveBtn" style="background:#0a0; color:#fff; border-color:#0a0;" onclick="toggleApprove()">✅ ZATWIERDŹ</button>
        </div>
    </div>
</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot>
            <tr id="sumRow"></tr>
            <tr id="satCountRow"></tr>
        </tfoot>
    </table>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="color:#ffe800; margin-bottom:10px; font-size:1rem;">USTAWIENIA SKLEPU</h3>
        <label style="font-size:0.6rem; color:#888;">DOSTĘPNE ZMIANY DLA DNI ROBOCZYCH (NP. 10-18, 12-20, 10-20):</label>
        <input id="globalShifts" style="width:100%; background:#000; border:1px solid #ffe800; color:#fff; padding:8px; margin-bottom:15px;" value="10-18, 12-20, 10-20">
        
        <div class="worker-grid" id="workerGrid"></div>
        <button class="btn-gen" style="width:100%; margin-top:20px; height:45px; font-size: 0.8rem;" onclick="saveSettings()">ZAPISZ I ZAMKNIJ</button>
    </div>
</div>

<script>
const employees = [
    {n: "PAWEŁ", i: "P", p: false, dept: "ME"},
    {n: "MICHAŁ", i: "M", p: false, dept: "KSS"},
    {n: "NATALIA", i: "N", p: true, dept: "POK"},
    {n: "MAGDA", i: "M", p: true, dept: "POK"},
    {n: "JAKUB", i: "J", p: false, dept: "IT"},
    {n: "ADRIAN", i: "A", p: false, dept: "IT"},
    {n: "DAWID", i: "D", p: false, dept: "IT"},
    {n: "DAREK", i: "D", p: false, dept: "IT"},
    {n: "ŁUKASZ", i: "Ł", p: false, dept: "AGD"},
    {n: "ILONA", i: "I", p: false, dept: "AGD"},
    {n: "ARIEL", i: "A", p: false, dept: "RTV"}
];

const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
let curM = new Date().getMonth(); 
const year = 2026;

const holidays2026 = ["1-1", "1-6", "4-5", "4-6", "5-1", "5-3", "5-24", "6-4", "8-15", "11-1", "11-11", "12-25", "12-26"];
const tradingSundays2026 = ["1-25", "3-29", "4-26", "6-28", "8-30", "12-13", "12-20"]; 

function isWorkDay(d) {
    let date = new Date(year, curM, d);
    let ds = `${curM+1}-${d}`;
    if (holidays2026.includes(ds)) return false;
    if (date.getDay() === 0 && !tradingSundays2026.includes(ds)) return false;
    return true;
}

function getV(n, d) { return localStorage.getItem(`pl_${year}_${curM}_${n}_${d}`) || ""; }
function saveV(n, d, v) { localStorage.setItem(`pl_${year}_${curM}_${n}_${d}`, v.toUpperCase()); }

function saveNorm(v) { localStorage.setItem(`norm_${year}_${curM}`, v); render(); }
function loadNorm() {
    let v = localStorage.getItem(`norm_${year}_${curM}`);
    document.getElementById('hourNormInput').value = v ? v : 160;
}

function toggleApprove() {
    let locked = localStorage.getItem(`locked_${year}_${curM}`) === 'true';
    localStorage.setItem(`locked_${year}_${curM}`, !locked);
    render();
}

function clearMonth() {
    if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return;
    if(confirm("Czy na pewno chcesz wyczyścić wygenerowany grafik?\n(Urlopy i życzenia zostaną nienaruszone!)")) {
        const days = new Date(year, curM + 1, 0).getDate();
        employees.forEach(e => {
            if(e.dept === 'ME') return; 
            for(let d=1; d<=days; d++) {
                let v = getV(e.n, d);
                if(v !== "URLOP" && v !== "Ż") saveV(e.n, d, "");
            }
        });
        render();
    }
}

function calcRealH(name) {
    let h = 0;
    for(let d=1; d<=31; d++) {
        let v = getV(name, d);
        if(v.includes('-')) {
            let p = v.split('-');
            h += (parseInt(p[1]) || 0) - (parseInt(p[0]) || 0);
        }
    }
    return h;
}

function getStreak(name, day) {
    let s = 0;
    for (let d = day-1; d >= 1; d--) {
        let v = getV(name, d);
        if(v.includes('-') || v==="URLOP" || v.toLowerCase()==="szk.") s++; else break;
    }
    for (let d = day+1; d <= 31; d++) {
        let v = getV(name, d);
        if(v.includes('-') || v==="URLOP" || v.toLowerCase()==="szk.") s++; else break;
    }
    return s;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startGeneration() {
    if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return;

    const baseNorm = parseInt(document.getElementById('hourNormInput').value);
    const shifts = document.getElementById('globalShifts').value.split(',').map(s => s.trim());
    const openShift = shifts[0] || "10-18";
    const closeShift = shifts.length > 1 ? shifts[1] : "12-20";
    const fullShift = shifts.length > 2 ? shifts[2] : "10-20";
    const satShift = "10-20"; 
    const days = new Date(year, curM + 1, 0).getDate();

    // 1. CZYSZCZENIE
    employees.forEach(e => { 
        if(e.dept === 'ME') return;
        for(let d=1; d<=days; d++) { 
            let v=getV(e.n, d); 
            if(v.includes('-') || v==="WOLNE") saveV(e.n, d, ""); 
        }
    });

    // 2. SOBOTY (Dokładnie 6 osób pracujących, 4 wolne = idealny mix 1/2 wolne sb na msc)
    let sats = [];
    for(let d=1; d<=days; d++) {
        if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) sats.push(d);
    }

    sats.forEach(d => {
        let available = employees.filter(e => getV(e.n, d) === "" && e.dept !== 'ME');
        shuffle(available);

        available.sort((a,b) => {
            let aWork = 0, bWork = 0;
            sats.forEach(s => { if(getV(a.n, s).includes('-')) aWork++; });
            sats.forEach(s => { if(getV(b.n, s).includes('-')) bWork++; });
            return aWork - bWork; 
        });

        let toWork = [];
        let poks = available.filter(e => e.p);
        let sales = available.filter(e => !e.p);

        let totalNeeded = 6;

        if(poks.length > 0) { toWork.push({ e: poks[0], shift: satShift }); sales = sales.filter(e => e.n !== poks[0].n); totalNeeded--; }
        
        let it = sales.find(e => e.dept === 'IT');
        if(it) { toWork.push({ e: it, shift: satShift }); sales = sales.filter(e => e.n !== it.n); totalNeeded--; }

        let agd = sales.find(e => e.dept === 'AGD');
        if(agd) { toWork.push({ e: agd, shift: satShift }); sales = sales.filter(e => e.n !== agd.n); totalNeeded--; }

        for(let i=0; i<totalNeeded && sales.length>0; i++) {
            toWork.push({ e: sales[0], shift: satShift });
            sales.shift();
        }

        toWork.forEach(w => saveV(w.e.n, d, w.shift));
    });

    // 3. DNI ROBOCZE (3+1 OTW, 3+1 ZAM)
    for(let d=1; d<=days; d++) {
        if(new Date(year, curM, d).getDay() === 6) continue;
        if(!isWorkDay(d)) continue;
        
        let available = employees.filter(e => getV(e.n, d) === "" && getStreak(e.n, d) < 5 && e.dept !== 'ME');
        shuffle(available);
        available.sort((a,b) => calcRealH(a.n) - calcRealH(b.n));
        
        let poks = available.filter(e => e.p);
        let sales = available.filter(e => !e.p);

        if(poks.length > 0) saveV(poks[0].n, d, openShift);
        if(poks.length > 1) saveV(poks[1].n, d, closeShift);

        let otwNeeded = 3;
        let zamNeeded = 3;

        let assignSale = (emp, isOtw) => {
            if(isOtw) { saveV(emp.n, d, openShift); otwNeeded--; }
            else { saveV(emp.n, d, closeShift); zamNeeded--; }
            sales = sales.filter(e => e.n !== emp.n);
        };

        let it = sales.find(e => e.dept === 'IT');
        if(it) assignSale(it, true); 

        let agd = sales.find(e => e.dept === 'AGD');
        if(agd) assignSale(agd, false); 

        for(let i=0; i<sales.length && (otwNeeded>0 || zamNeeded>0); i++) {
            if(otwNeeded > 0) { assignSale(sales[i], true); i--; }
            else if (zamNeeded > 0) { assignSale(sales[i], false); i--; }
        }
    }

    // 4. INTELIGENTNE BILANSOWANIE NORM Z "DEADLOCK BREAKER"
    let allBalanced = false;
    let iterations = 0;

    const tryAddShift = (emp) => {
        let possibleDays = [];
        for(let d=1; d<=days; d++) {
            let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
            if(isWorkDay(d) && !isWknd && getV(emp.n, d) === "" && getStreak(emp.n, d) < 5) {
                let c = 0; employees.forEach(em => { if(em.dept !== 'ME' && getV(em.n, d).includes('-')) c++; });
                possibleDays.push({ d, staff: c });
            }
        }
        if(possibleDays.length > 0) {
            shuffle(possibleDays);
            possibleDays.sort((a,b) => a.staff - b.staff); 
            saveV(emp.n, possibleDays[0].d, (Math.random()>0.5 ? openShift : closeShift));
            return true;
        }
        return false;
    };

    const tryExtendShift = (emp) => {
        let possibleDays = [];
        for(let d=1; d<=days; d++) {
            let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
            let v = getV(emp.n, d);
            if(!isWknd && (v === openShift || v === closeShift) && getStreak(emp.n, d) < 5) possibleDays.push(d);
        }
        if(possibleDays.length > 0) {
            shuffle(possibleDays);
            saveV(emp.n, possibleDays[0], fullShift);
            return true;
        }
        return false;
    };

    const tryRemoveShift = (emp, strict) => {
        let possibleDays = [];
        for(let d=1; d<=days; d++) {
            let v = getV(emp.n, d);
            let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
            
            if(!isWknd && (v === openShift || v === closeShift || v === fullShift)) {
                let otwSales = 0, zamSales = 0, otwPok = 0, zamPok = 0, itCount = 0, agdCount = 0;
                employees.forEach(em => {
                    if(em.n === emp.n || em.dept === 'ME') return;
                    let ev = getV(em.n, d);
                    if(ev.includes('-')) {
                        let p = ev.split('-');
                        let isO = parseInt(p[0]) <= 10;
                        let isZ = parseInt(p[1]) >= 20;
                        if(isO) { if(em.p) otwPok++; else otwSales++; }
                        if(isZ) { if(em.p) zamPok++; else zamSales++; }
                        if(em.dept === 'IT') itCount++;
                        if(em.dept === 'AGD') agdCount++;
                    }
                });
                
                let isOtw = parseInt(v.split('-')[0]) <= 10;
                let isZam = parseInt(v.split('-')[1]) >= 20;
                let isSafe = true;
                
                if(strict) {
                    if(isOtw && (otwSales < 3 || otwPok < 1)) isSafe = false;
                    if(isZam && (zamSales < 3 || zamPok < 1)) isSafe = false;
                    if(itCount < 1 || agdCount < 1) isSafe = false;
                } else {
                    if(isOtw && (otwSales + otwPok <= 1)) isSafe = false;
                    if(isZam && (zamSales + zamPok <= 1)) isSafe = false;
                }

                if(isSafe) possibleDays.push({ d, staff: otwSales + zamSales });
            }
        }
        if(possibleDays.length > 0) {
            shuffle(possibleDays);
            possibleDays.sort((a,b) => b.staff - a.staff);
            saveV(emp.n, possibleDays[0].d, "");
            return true;
        }
        return false;
    };

    const tryShortenShift = (emp) => {
        let possibleDays = [];
        for(let d=1; d<=days; d++) {
            let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
            let v = getV(emp.n, d);
            if(!isWknd && v === fullShift) possibleDays.push(d);
        }
        if(possibleDays.length > 0) {
            shuffle(possibleDays);
            saveV(emp.n, possibleDays[0], (Math.random()>0.5 ? openShift : closeShift));
            return true;
        }
        return false;
    };

    while(!allBalanced && iterations < 4000) {
        allBalanced = true;
        let strictMode = iterations < 1500; 
        
        let status = employees.map(e => {
            let urlops = 0;
            for(let d=1; d<=days; d++) {
                let v = getV(e.n, d);
                if(v === "URLOP" || v.toLowerCase() === "szk.") urlops++;
            }
            let target = baseNorm - (urlops * 8);
            let current = calcRealH(e.n);
            return { e, target, current, diff: target - current };
        });

        shuffle(status);
        status.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));

        for(let st of status) {
            if(st.diff === 0 || st.e.dept === 'ME') continue;
            allBalanced = false;
            let actionTaken = false;
            
            if(st.diff > 0) { 
                if(st.diff >= 8) actionTaken = tryAddShift(st.e);
                if(!actionTaken && st.diff >= 2) actionTaken = tryExtendShift(st.e);
                if(!actionTaken) actionTaken = tryAddShift(st.e);
                
            } else if (st.diff < 0) { 
                if(st.diff <= -8) actionTaken = tryRemoveShift(st.e, strictMode);
                if(!actionTaken && st.diff <= -2) actionTaken = tryShortenShift(st.e);
                if(!actionTaken) actionTaken = tryRemoveShift(st.e, strictMode);
            }
            
            if(actionTaken) break; 
        }
        iterations++;
    }

    render();
}

function render() {
    const days = new Date(year, curM + 1, 0).getDate();
    const body = document.getElementById('daysBody');
    const head = document.getElementById('workerRow');
    const baseNorm = parseInt(document.getElementById('hourNormInput').value);
    
    const isLocked = localStorage.getItem(`locked_${year}_${curM}`) === 'true';
    const genBtn = document.getElementById('genBtn');
    const clrBtn = document.getElementById('clearBtn');
    const appBtn = document.getElementById('approveBtn');
    
    genBtn.disabled = isLocked;
    clrBtn.disabled = isLocked;
    genBtn.style.opacity = isLocked ? '0.3' : '1';
    clrBtn.style.opacity = isLocked ? '0.3' : '1';
    genBtn.style.cursor = isLocked ? 'not-allowed' : 'pointer';
    clrBtn.style.cursor = isLocked ? 'not-allowed' : 'pointer';
    
    appBtn.innerText = isLocked ? '🔓 ODBLOKUJ' : '✅ ZATWIERDŹ';
    appBtn.style.background = isLocked ? '#a00' : '#0a0';
    appBtn.style.borderColor = isLocked ? '#a00' : '#0a0';

    head.innerHTML = '<th class="date-col">DATA</th>';
    employees.forEach(e => {
        let deptClass = e.dept === 'ME' ? 'dept-me' : '';
        head.innerHTML += `<th>
            <div class="avatar">${e.i}</div>
            <div class="worker-name">${e.n}<br><span class="dept-tag ${deptClass}">${e.dept}</span></div>
        </th>`;
    });
    head.innerHTML += '<th class="obsada-col">OTW - SUMA - ZAM</th>';

    body.innerHTML = "";
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === curM;

    for(let d=1; d<=days; d++) {
        let date = new Date(year, curM, d);
        let tr = document.createElement('tr');
        
        if(!isWorkDay(d)) tr.className = 'sun';
        else if(date.getDay() === 6) tr.className = 'sat';
        
        if(isCurrentMonth && today.getDate() === d) {
            tr.classList.add('today-row');
        }
        
        let html = `<td class="date-col">${d} ${['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()]}</td>`;
        let o=0, z=0, suma=0;
        
        employees.forEach(e => {
            let v = getV(e.n, d);
            let cellClass = (v === "Ż") ? 'class="wish-cell"' : '';
            if(v.includes('-')) {
                suma++;
                let p = v.split('-');
                if(parseInt(p[0]) <= 10) o++;
                if(parseInt(p[1]) >= 20) z++;
            }
            let disabledAttr = isLocked ? 'disabled' : '';
            html += `<td ${cellClass}><input value="${v}" ${disabledAttr} onchange="saveV('${e.n}',${d},this.value);render()"></td>`;
        });
        
        html += `<td class="obsada-col">${o} - ${suma} - ${z}</td>`;
        tr.innerHTML = html; body.appendChild(tr);
    }

    const fSum = document.getElementById('sumRow');
    fSum.innerHTML = '<td class="date-col">GODZINY</td>';
    employees.forEach(e => {
        let urlops = 0;
        for(let d=1; d<=days; d++) {
            let v = getV(e.n, d);
            if(v === "URLOP" || v.toLowerCase() === "szk.") urlops++;
        }
        let target = baseNorm - (urlops * 8); 
        let h = calcRealH(e.n); 
        fSum.innerHTML += `<td style="color:${h==target?'#0f0':'#f44'}; font-size: 0.55rem;">${h} / ${target}</td>`;
    });
    fSum.innerHTML += '<td class="obsada-col"></td>';

    const fSat = document.getElementById('satCountRow');
    fSat.innerHTML = '<td class="date-col">WOLNE SB</td>';
    employees.forEach(e => {
        let count = 0;
        if(e.dept !== 'ME') {
            for(let d=1; d<=days; d++) {
                if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) {
                    let v = getV(e.n, d);
                    if(v === "" || v === "URLOP" || v === "Ż") count++;
                }
            }
        }
        fSat.innerHTML += `<td style="color:${count>=1 && count<=2 ?'#ffe800':'#888'}">${e.dept==='ME'?'-':count}</td>`;
    });
    fSat.innerHTML += '<td class="obsada-col"></td>';
}

function renderSettings() {
    const grid = document.getElementById('workerGrid'); grid.innerHTML = "";
    employees.forEach(e => {
        let savedZ = localStorage.getItem(`set_z_${year}_${curM}_${e.n}`) || "";
        let savedU1 = localStorage.getItem(`set_u1_${year}_${curM}_${e.n}`) || "";
        let savedU2 = localStorage.getItem(`set_u2_${year}_${curM}_${e.n}`) || "";

        grid.innerHTML += `<div class="worker-card">
            <div style="color:#ffe800; font-weight:900; font-size:0.7rem;">${e.n} <span style="color:#666; font-size:0.5rem">(${e.dept})</span></div>
            <label>ŻYCZENIA (Dni np. 5,12):</label>
            <input id="z_${e.n}" value="${savedZ}">
            <label>URLOP (Od-Do np. 1-7):</label>
            <div style="display:flex; gap:2px">
                <input id="u1_${e.n}" placeholder="Od" value="${savedU1}">
                <input id="u2_${e.n}" placeholder="Do" value="${savedU2}">
            </div>
        </div>`;
    });
}

function saveSettings() {
    const days = new Date(year, curM + 1, 0).getDate();
    
    employees.forEach(e => {
        for(let d=1; d<=days; d++) {
            let v = getV(e.n, d);
            if(v === "URLOP" || v === "Ż") saveV(e.n, d, "");
        }
    });

    employees.forEach(e => {
        let z = document.getElementById(`z_${e.n}`)?.value.trim() || "";
        let u1 = document.getElementById(`u1_${e.n}`)?.value.trim() || "";
        let u2 = document.getElementById(`u2_${e.n}`)?.value.trim() || "";
        
        localStorage.setItem(`set_z_${year}_${curM}_${e.n}`, z);
        localStorage.setItem(`set_u1_${year}_${curM}_${e.n}`, u1);
        localStorage.setItem(`set_u2_${year}_${curM}_${e.n}`, u2);

        if(z) {
            z.split(',').forEach(d => {
                let dayNum = parseInt(d.trim());
                if(!isNaN(dayNum) && dayNum >= 1 && dayNum <= days) saveV(e.n, dayNum, "Ż");
            });
        }
        
        if(u1 && u2) {
            let start = parseInt(u1);
            let end = parseInt(u2);
            if(!isNaN(start) && !isNaN(end)) {
                for(let d=start; d<=end; d++) {
                    if(d >= 1 && d <= days && isWorkDay(d)) saveV(e.n, d, "URLOP");
                }
            }
        }
    });

    toggleModal(false); 
    render();
}

function setMonth(i) {
    curM = i;
    loadNorm();
    renderMonths();
    render();
}

function renderMonths() {
    const div = document.getElementById('monthSelector'); div.innerHTML = "";
    months.forEach((m, i) => {
        const b = document.createElement('button');
        b.className = `month-btn ${i === curM ? 'active' : ''}`;
        b.innerText = m;
        b.onclick = () => setMonth(i);
        div.appendChild(b);
    });
}

function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
function toggleModal(s) { document.getElementById('settingsModal').style.display = s ? 'flex' : 'none'; if(s) renderSettings(); }

window.onload = () => { setMonth(curM); };
</script>
