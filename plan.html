<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* STYL CSS Z TWOJEGO PLIKU plan.css */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #000; color: white; overflow-x: hidden; }
        
        header { 
            background: #ffe800; height: 60px; display: flex; 
            align-items: center; justify-content: center; position: sticky; 
            top: 0; z-index: 2000; 
        }
        
        .logo { color: #000; font-weight: 900; font-size: 1.6rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 4px; }
        
        .menu-btn { position: absolute; left: 20px; cursor: pointer; color: #000; font-size: 1.8rem; padding: 5px; }
        
        .sidebar { 
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%; 
            background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; 
            z-index: 3000; padding-top: 20px; 
        }
        .sidebar.active { left: 0; }
        
        .sidebar-header { 
            background: #1a1a1a; color: #777; padding: 25px; 
            font-weight: 900; font-size: 0.75rem; text-transform: uppercase; 
            border-bottom: 1px solid #222; 
        }
        
        .sidebar-link { 
            display: block; color: white; padding: 18px 25px; 
            text-decoration: none; font-weight: 700; border-bottom: 1px solid #1a1a1a; 
        }
        .sidebar-link:hover { color: #ffe800; background: #111; }
        .sidebar-link.active { color: #ffe800; background: #111; border-left: 5px solid #ffe800; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2500; }
        .overlay.active { display: block; }

        .plan-container { padding: 30px 10px; }
        .plan-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; padding: 0 10px; 
        }
        
        .page-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; }
        .page-title span { color: #ffe800; }
        
        .month-display { 
            background: #1a1a1a; padding: 10px 20px; border-radius: 8px; 
            font-weight: 900; border: 1px solid #ffe800; 
        }
        
        .table-wrapper { 
            overflow-x: auto; background: #111; border-radius: 15px; 
            border: 1px solid #222; 
        }
        
        table { border-collapse: collapse; width: 100%; min-width: 1200px; }
        th, td { border: 1px solid #222; padding: 12px 8px; text-align: center; font-size: 0.9rem; }
        th { background: #1a1a1a; color: #777; text-transform: uppercase; }
        
        .sticky-col { 
            position: sticky; left: 0; background: #111 !important; 
            z-index: 100; min-width: 160px; text-align: left; 
            font-weight: 900; color: #fff; border-right: 2px solid #ffe800; 
        }
        
        .sum-col { font-weight: 900; color: #ffe800; background: #1a1a1a; }
        
        input { 
            background: transparent; border: none; color: white; width: 45px; 
            text-align: center; font-weight: 700; font-size: 1rem; outline: none; 
        }
        input:focus { background: rgba(255, 232, 0, 0.1); border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-header">NAWIGACJA</div>
    <a href="index.html" class="sidebar-link">🏠 STRONA GŁÓWNA</a>
    <a href="plan.html" class="sidebar-link active">📅 PLAN PRACY</a>
    <a href="inwa.html" class="sidebar-link">📝 INWENTURY</a>
    <a href="kwt.html" class="sidebar-link">📋 KWT</a>
    <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
    <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff4444; margin-top: 20px;">🚪 WYLOGUJ</a>
</nav>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<main class="plan-container">
    <div class="plan-header">
        <h1 class="page-title">PLAN <span>PRACY</span></h1>
        <div class="month-display" id="currentMonth">LUTY 2026</div>
    </div>

    <div class="table-wrapper">
        <table id="scheduleTable">
            <thead>
                <tr id="headerRow">
                    <th class="sticky-col">Pracownik</th>
                    <th class="sum-col">Suma</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>
</main>

<script>
    // LOGIKA JS Z TWOJEGO PLIKU plan.js
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function logout() {
        localStorage.removeItem('loggedCharID');
        window.location.href = 'login.html';
    }

    // Twoja pełna lista 11 pracowników
    const employees = [
        "Pawel", "Michal", "Kuba", "Lukasz", "Ariel", 
        "Dawid", "Adrian", "Magdalena", "Ilona", "Dariusz", "Natalia"
    ];

    const daysInMonth = 28; // Luty 2026

    function initPlan() {
        // Zabezpieczenie przed wejściem bez logowania
        if(!localStorage.getItem('loggedCharID')) {
            window.location.href = 'login.html';
            return;
        }

        const headerRow = document.getElementById('headerRow');
        const scheduleBody = document.getElementById('scheduleBody');
        const sumTh = headerRow.querySelector('.sum-col');

        // Generuj nagłówki dni (1-28)
        for (let i = 1; i <= daysInMonth; i++) {
            const th = document.createElement('th');
            th.innerText = i;
            headerRow.insertBefore(th, sumTh);
        }

        // Generuj wiersze pracowników
        employees.forEach(emp => {
            const tr = document.createElement('tr');
            let rowHtml = `<td class="sticky-col">${emp}</td>`;
            
            for (let i = 1; i <= daysInMonth; i++) {
                const savedVal = localStorage.getItem(`plan-${emp}-${i}`) || "";
                rowHtml += `<td><input type="text" value="${savedVal}" onchange="saveHour('${emp}', ${i}, this.value)"></td>`;
            }
            
            rowHtml += `<td class="sum-col" id="sum-${emp}">0</td>`;
            tr.innerHTML = rowHtml;
            scheduleBody.appendChild(tr);
            calculateSum(emp);
        });
    }

    function saveHour(emp, day, value) {
        localStorage.setItem(`plan-${emp}-${day}`, value);
        calculateSum(emp);
    }

    function calculateSum(emp) {
        let total = 0;
        for (let i = 1; i <= daysInMonth; i++) {
            const val = localStorage.getItem(`plan-${emp}-${i}`);
            if (val) {
                // Obsługa przecinków i kropki
                const num = parseFloat(val.replace(',', '.'));
                if (!isNaN(num)) {
                    total += num;
                }
            }
        }
        // Wyświetlanie sumy (zaokrąglone)
        document.getElementById(`sum-${emp}`).innerText = Math.round(total * 100) / 100;
    }

    window.onload = initPlan;
</script>

</body>
</html>
