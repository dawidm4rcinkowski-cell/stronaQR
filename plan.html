<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Expert - Plan Pracy PRO MAX</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
body{background:#080808;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#ffe800;height:50px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:2px solid #000}
.logo{color:#000;font-weight:900;font-size:1.4rem}
.logo span{background:#000;color:#ffe800;padding:0 4px;border-radius:3px}
.menu-btn{position:absolute;left:15px;cursor:pointer;color:#000;font-size:1.5rem}
.table-container{flex-grow:1;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{border:1px solid #111;text-align:center;height:42px}
thead th{background:#000;position:sticky;top:0;z-index:5}
.date-col{position:sticky;left:0;background:#000;z-index:6;width:85px}
.obsada-col{background:#111;color:#ffe800;font-weight:900}
input{width:100%;height:100%;background:transparent;border:none;color:#fff;text-align:center}
tfoot td{background:#111;color:#ffe800;font-weight:900}
</style>
</head>

<body>

<header>
<div class="logo">MEDIA <span>EXPERT</span> PRO MAX</div>
</header>

<div class="table-container">
<table id="planTable">
<thead><tr id="workerRow"></tr></thead>
<tbody id="daysBody"></tbody>
<tfoot>
<tr id="sumRow"></tr>
</tfoot>
</table>
</div>

<script>

// ============================
// 🔥 KONFIGURACJA
// ============================

const employees=[
{n:"PAWEŁ",pok:false},
{n:"MICHAŁ",pok:false},
{n:"NATALIA",pok:true},
{n:"MAGDA",pok:true},
{n:"JAKUB",pok:false},
{n:"ADRIAN",pok:false},
{n:"DAWID",pok:false},
{n:"DAREK",pok:false},
{n:"ŁUKASZ",pok:false},
{n:"ILONA",pok:false},
{n:"ARIEL",pok:false}
];

const shifts=["10-20","10-18","12-20","13-20"];
const targetHours=160;
const year=2026;
let currentMonth=1; // LUTY

// ============================
// 🇵🇱 ŚWIĘTA 2026
// ============================

const polishHolidays=[
"2026-01-01","2026-01-06",
"2026-04-05","2026-04-06",
"2026-05-01","2026-05-03",
"2026-05-24",
"2026-06-04",
"2026-08-15",
"2026-11-01","2026-11-11",
"2026-12-25","2026-12-26"
];

const handlowe2026=[
"2026-01-25","2026-04-26","2026-06-28",
"2026-08-30","2026-12-13","2026-12-20"
];

// ============================
// 🔧 POMOCNICZE
// ============================

function dateStr(d){
return `${year}-${String(currentMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

function shiftLength(s){
const [a,b]=s.split("-");
return parseInt(b)-parseInt(a);
}

// ============================
// 🚀 PRO MAX GENERATOR
// ============================

function generate(){

const days=new Date(year,currentMonth+1,0).getDate();

let data={};

employees.forEach(e=>{
data[e.n]={
hours:0,
workStreak:0,
freeSat:null
};
});

// 🎯 Jedna wolna sobota
let saturdays=[];
for(let d=1;d<=days;d++){
if(new Date(year,currentMonth,d).getDay()===6)
saturdays.push(d);
}
let mix=[...saturdays].sort(()=>Math.random()-0.5);

employees.forEach((e,i)=>{
if(e.n==="PAWEŁ")return;
data[e.n].freeSat=mix[i % mix.length];
});

// 📆 Budowanie miesiąca
for(let day=1;day<=days;day++){

let ds=dateStr(day);
let weekday=new Date(year,currentMonth,day).getDay();

let isHoliday=polishHolidays.includes(ds);
let isSunday=weekday===0;
let isHandlowa=handlowe2026.includes(ds);

if(isHoliday || (isSunday && !isHandlowa)){
continue;
}

let open=3,close=3;

// 🔥 POK
if(!(data["NATALIA"].workStreak>=5)){
assign("NATALIA","10-18");
open--;
}
if(!(data["MAGDA"].workStreak>=5)){
assign("MAGDA","12-20");
close--;
}

// 👥 RESZTA
let pool=employees.filter(e=>!e.pok && e.n!=="PAWEŁ");

for(let e of pool){

if(data[e.n].workStreak>=5)continue;
if(day===data[e.n].freeSat)continue;
if(data[e.n].hours>=targetHours)continue;

if(open>0){
assign(e.n,"10-20");
open--;
}
else if(close>0){
assign(e.n,"12-20");
close--;
}

}

function assign(name,shift){
data[name].hours+=shiftLength(shift);
data[name].workStreak++;
}
}

// 🧮 Korekta do idealnej normy
employees.forEach(e=>{
if(e.n==="PAWEŁ")return;
while(data[e.n].hours>targetHours){
data[e.n].hours-=8;
}
});

console.log("PRO MAX wygenerowany");
}

generate();

</script>
</body>
</html>
