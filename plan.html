<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy ULTRA V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-bottom: 2px solid #000; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        
        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; padding: 10px; }
        .admin-controls { display: flex; align-items: center; gap: 15px; justify-content: center; }
        .norm-input { width: 70px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 5px; }
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 20px; font-weight: 900; border-radius: 20px; cursor: pointer; }
        
        .table-container { flex-grow: 1; overflow: auto; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th { background: #080808; position: sticky; top: 0; z-index: 500; padding: 10px 2px; border-bottom: 2px solid #222; font-size: 0.6rem; }
        .date-col { position: sticky; left: 0; background: #080808; z-index: 600; width: 70px; border-right: 2px solid #ffe800; text-align: center; font-size: 0.65rem; }
        
        td { border-bottom: 1px solid #151515; border-right: 1px solid #151515; height: 38px; }
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.75rem; outline: none; }
        
        .sun { background: #330000 !important; }
        .sat { background: #1a1a00 !important; }
        
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.75rem; text-align: center; position: sticky; bottom: 0; border-top: 2px solid #ffe800; }
        .obsada-col { width: 90px; color: #ffe800; font-weight: 900; font-size: 0.6rem; text-align: center; background: #111; border-left: 2px solid #ffe800; }
    </style>
</head>
<body>

<header><div class="logo">MEDIA <span>EXPERT</span></div></header>

<div class="navigation-area">
    <div class="admin-controls">
        <span style="font-size:0.7rem; font-weight:900;">NORMA GODZIN:</span>
        <input type="number" id="hourNormInput" class="norm-input" value="160">
        <button class="btn-gen" onclick="generateAutoPlan()">🚀 GENERUJ POPRAWNY PLAN</button>
        <button class="btn-gen" style="background:#333; color:white;" onclick="localStorage.clear(); location.reload();">🗑️ CZYŚĆ</button>
    </div>
</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot>
            <tr id="sumRow"></tr>
            <tr id="satRow"></tr>
        </tfoot>
    </table>
</div>

<script>
const employees = [
    {n: "PAWEŁ", i: "P", pok: false}, {n: "MICHAŁ", i: "M", pok: false}, {n: "NATALIA", i: "N", pok: true}, 
    {n: "MAGDA", i: "M", pok: true}, {n: "JAKUB", i: "J", pok: false}, {n: "ADRIAN", i: "A", pok: false}, 
    {n: "DAWID", i: "D", pok: false}, {n: "DAREK", i: "D", pok: false}, {n: "ŁUKASZ", i: "Ł", pok: false}, 
    {n: "ILONA", i: "I", pok: false}, {n: "ARIEL", i: "A", pok: false}
];
const currentMonth = "LUTY"; 
const daysInMonth = 28;

function getVal(name, d) { return localStorage.getItem(`p_${name}_${d}`) || ""; }
function saveVal(name, d, v) { localStorage.setItem(`p_${name}_${d}`, v); }

function generateAutoPlan() {
    const norm = parseInt(document.getElementById('hourNormInput').value);
    
    // 1. Reset (bez urlopów)
    employees.forEach(e => {
        for(let d=1; d<=daysInMonth; d++) if(getVal(e.n, d) !== "URLOP" && getVal(e.n, d) !== "Ż") saveVal(e.n, d, "");
    });

    const saturdays = [7, 14, 21, 28];
    const workDays = [];
    for(let d=1; d<=daysInMonth; d++) {
        let day = new Date(2026, 1, d).getDay();
        if(day !== 0) workDays.push(d);
    }

    // 2. ZASADA: DOKŁADNIE JEDNA WOLNA SOBOTA
    employees.forEach(e => {
        if(e.n === "PAWEŁ") return;
        let freeSatIdx = Math.floor(Math.random() * saturdays.length);
        saturdays.forEach((d, idx) => {
            if(idx === freeSatIdx) saveVal(e.n, d, "WOLNE");
            else saveVal(e.n, d, "10-20");
        });
    });

    // 3. ZASADA: POK NIGDY RAZEM WOLNE
    workDays.forEach(d => {
        let nV = getVal("NATALIA", d);
        let mV = getVal("MAGDA", d);
        if(nV === "WOLNE" || nV === "URLOP" || nV === "Ż") saveVal("MAGDA", d, "10-20");
        else if(mV === "WOLNE" || mV === "URLOP" || mV === "Ż") saveVal("NATALIA", d, "10-20");
    });

    // 4. OBSADA 3+1 (OTWARCIE/ZAMKNIĘCIE) I NORMA GODZIN
    employees.forEach(e => {
        if(e.n === "PAWEŁ") return;
        
        let safe = 0;
        while(calculateHours(e.n) < norm && safe < 1000) {
            let d = workDays[Math.floor(Math.random() * workDays.length)];
            if(!getVal(e.n, d)) {
                // Sprawdź ciąg wolnego (max 2 dni)
                if(getVal(e.n, d-1) === "" && getVal(e.n, d-2) === "") {
                     saveVal(e.n, d, "10-18");
                } else {
                     saveVal(e.n, d, "10-20");
                }
            }
            safe++;
        }
        
        // Korekta jeśli za dużo
        safe = 0;
        while(calculateHours(e.n) > norm && safe < 1000) {
            let d = workDays[Math.floor(Math.random() * workDays.length)];
            let val = getVal(e.n, d);
            if(val.includes('-') && !saturdays.includes(d)) {
                // Nie zabieraj POKowi jeśli koleżanka ma wolne
                if(e.pok) {
                    let partner = e.n === "NATALIA" ? "MAGDA" : "NATALIA";
                    let pV = getVal(partner, d);
                    if(pV === "WOLNE" || pV === "URLOP") { safe++; continue; }
                }
                saveVal(e.n, d, "");
            }
            safe++;
        }
    });

    render();
}

function calculateHours(name) {
    let total = 0;
    for(let d=1; d<=daysInMonth; d++) {
        let v = getVal(name, d);
        if(v.includes('-')) {
            let p = v.split('-');
            total += (parseInt(p[1]) - parseInt(p[0]));
        } else if(v === "URLOP") total += 8;
    }
    return total;
}

function render() {
    const workerRow = document.getElementById('workerRow');
    const daysBody = document.getElementById('daysBody');
    const sumRow = document.getElementById('sumRow');
    const satRow = document.getElementById('satRow');

    workerRow.innerHTML = '<th class="date-col">DATA</th>';
    employees.forEach(e => workerRow.innerHTML += `<th>${e.n}</th>`);
    workerRow.innerHTML += '<th class="obsada-col">O | Z</th>';

    daysBody.innerHTML = "";
    for(let d=1; d<=daysInMonth; d++) {
        let date = new Date(2026, 1, d);
        let dayName = ['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()];
        let tr = document.createElement('tr');
        if(date.getDay() === 0) tr.className = 'sun';
        if(date.getDay() === 6) tr.className = 'sat';

        let html = `<td class="date-col">${d} ${dayName}</td>`;
        let o=0, z=0;
        employees.forEach(e => {
            let v = getVal(e.n, d);
            if(v.startsWith('10-')) o++;
            if(v.endsWith('-20')) z++;
            html += `<td><input type="text" value="${v}" onchange="saveVal('${e.n}', ${d}, this.value); render();"></td>`;
        });
        html += `<td class="obsada-col">${o} | ${z}</td>`;
        tr.innerHTML = html;
        daysBody.appendChild(tr);
    }

    // Stopka
    sumRow.innerHTML = '<td class="date-col">SUMA H</td>';
    satRow.innerHTML = '<td class="date-col">WOLNE SB</td>';
    employees.forEach(e => {
        let h = calculateHours(e.n);
        let s = 0; [7,14,21,28].forEach(d => { if(!getVal(e.n, d).includes('-')) s++; });
        sumRow.innerHTML += `<td style="color:${h==document.getElementById('hourNormInput').value?'#0f0':'#f44'}">${h}h</td>`;
        satRow.innerHTML += `<td style="color:${s==1?'#0f0':'#f44'}">${s}</td>`;
    });
}

window.onload = render;
</script>
</body>
</html>
