<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Pracy - Media Expert</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* RESET I PODSTAWY */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #000; color: white; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: #ffe800; height: 60px; display: flex; align-items: center; 
            justify-content: center; position: sticky; top: 0; z-index: 2000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .logo { color: #000; font-weight: 900; font-size: 1.6rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 6px; border-radius: 4px; }
        .menu-btn { position: absolute; left: 20px; cursor: pointer; color: #000; font-size: 1.8rem; }

        /* SIDEBAR */
        .sidebar { 
            position: fixed; left: -280px; top: 0; width: 260px; height: 100%; 
            background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.3s; z-index: 3000; 
        }
        .sidebar.active { left: 0; }
        .sidebar-header { 
            background: #1a1a1a; color: #777; padding: 25px; font-weight: 900; 
            font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #222; 
        }
        .sidebar-link { 
            display: block; color: white; padding: 18px 25px; text-decoration: none; 
            font-weight: 700; border-bottom: 1px solid #1a1a1a; transition: 0.3s; 
        }
        .sidebar-link:hover { background: #111; color: #ffe800; padding-left: 35px; }
        .sidebar-link.active { background: #111; color: #ffe800; border-left: 5px solid #ffe800; }
        
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            display: none; z-index: 2500; backdrop-filter: blur(4px); 
        }
        .overlay.active { display: block; }

        /* MAIN CONTENT */
        main { padding: 30px 10px; }
        .page-title { text-align: center; font-weight: 900; font-size: 2rem; margin-bottom: 30px; text-transform: uppercase; }
        .page-title span { color: #ffe800; }

        /* TABELA */
        .table-container { 
            overflow-x: auto; background: #111; border-radius: 15px; 
            border: 2px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th, td { border: 1px solid #222; padding: 12px 8px; text-align: center; }
        th { background: #1a1a1a; color: #777; font-size: 0.75rem; text-transform: uppercase; }
        
        /* KOLUMNA Z NAZWISKIEM */
        .sticky-col { 
            position: sticky; left: 0; background: #0a0a0a !important; 
            font-weight: 900; color: #ffe800; border-right: 2px solid #ffe800; 
            min-width: 180px; text-align: left; padding-left: 15px;
            z-index: 10;
        }

        /* INPUTY W TABELI */
        input { 
            background: transparent; border: none; color: white; width: 45px; 
            text-align: center; font-weight: 700; outline: none; font-size: 0.9rem;
        }
        input:focus { background: rgba(255, 232, 0, 0.1); border-radius: 4px; }

        /* KOLUMNA SUMY */
        .sum-col { 
            background: #1a1a00 !important; color: #ffe800; 
            font-weight: 900; font-size: 1rem; border-left: 2px solid #ffe800;
        }

        /* DZIAŁY */
        .dept-tag { font-size: 0.6rem; color: #555; display: block; font-weight: 400; }
    </style>
</head>
<body>

        <div class="menu-btn" onclick="toggleMenu()">☰</div>

    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">NAWIGACJA</div>

        <a href="#" onclick="logout()" class="sidebar-link" style="color: #ff4444; margin-top: 20px;">🚪 WYLOGUJ</a>
    </nav>
