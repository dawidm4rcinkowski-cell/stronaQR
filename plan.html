<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Plan Pracy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #ffe800; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 9999; border-bottom: 2px solid #000; position: relative; }
        .logo { color: #000; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
        .logo span { background: #000; color: #ffe800; padding: 0 4px; border-radius: 3px; }
        .menu-btn { position: absolute; left: 15px; cursor: pointer; color: #000; font-size: 1.5rem; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a; border-right: 3px solid #ffe800; transition: 0.4s; z-index: 10000; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-link { display: block; color: white; padding: 15px 25px; text-decoration: none; font-weight: 700; font-size: 0.8rem; border-bottom: 1px solid #111; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 9500; }
        .overlay.active { display: block; }

        .navigation-area { background: #111; border-bottom: 2px solid #ffe800; flex-shrink: 0; }
        .month-row { display: flex; align-items: center; padding: 10px 15px; gap: 15px; }
        .month-selector { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex-grow: 1; }
        .month-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #222; background: #000; color: #666; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
        .month-btn.active { background: #ffe800; color: #000; border-color: #ffe800; }
        .admin-controls { display: flex; align-items: center; gap: 10px; border-left: 1px solid #333; padding-left: 15px; }
        .norm-input { width: 65px; background: #000; color: #ffe800; border: 1px solid #ffe800; text-align: center; font-weight: 900; padding: 4px; font-size: 0.8rem; border-radius: 4px; }
        
        .table-container { flex-grow: 1; overflow: auto; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        thead th { background: #080808; position: sticky; top: 0; z-index: 500; padding: 10px 2px; border-bottom: 2px solid #222; }
        .avatar { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ffe800; display: flex; align-items: center; justify-content: center; margin: 0 auto 3px; font-weight: 900; color: #ffe800; font-size: 0.6rem; }
        .worker-name { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; }
        .date-col { position: sticky; left: 0; background: #080808; z-index: 600; width: 80px; font-size: 0.65rem; font-weight: 700; color: #777; text-align: center; border-right: 2px solid #ffe800; }
        .obsada-col { width: 105px; color: #ffe800; font-weight: 900; font-size: 0.6rem; background: #111; text-align: center; border-left: 2px solid #ffe800; }
        
        td { border-bottom: 1px solid #151515; border-right: 1px solid #151515; height: 38px; }
        td input { width: 100%; height: 100%; background: transparent; border: none; color: white; text-align: center; font-weight: 700; font-size: 0.75rem; outline: none; }
        td input:disabled { color: #888; cursor: not-allowed; }
        
        .sun { background: #300 !important; } 
        .sat { background: #110 !important; }
        .wish-cell { background: #300060 !important; }

        tfoot { position: sticky; bottom: 0; z-index: 700; }
        tfoot td { background: #111; color: #ffe800; font-weight: 900; font-size: 0.65rem; text-align: center; border-top: 2px solid #ffe800; height: 35px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 20px; width: 100%; max-width: 800px; border-radius: 15px; }
        .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; max-height: 60vh; overflow-y: auto; }
        .worker-card { background: #151515; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .worker-card label { display: block; font-size: 0.5rem; color: #888; margin-top: 5px; }
        .worker-card input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 3px; font-size: 0.7rem; }
        
        .btn-gen { background: #ffe800; color: #000; border: none; padding: 8px 15px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.7rem; transition: 0.3s; }
        .btn-settings { background: #333; color: #ffe800; border: 1px solid #ffe800; padding: 8px 15px; font-weight: 900; border-radius: 20px; cursor: pointer; font-size: 0.7rem; transition: 0.3s; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleNav()">☰</div>
    <div class="logo">MEDIA <span>EXPERT</span></div>
</header>

<div class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-link">Strona główna</a>
    <a href="plan.html" class="sidebar-link" style="color:#ffe800">Plan pracy</a>
    <a href="inwentury.html" class="sidebar-link">Inwentury</a>
    <a href="kodqr.html" class="sidebar-link">Kod QR</a>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>

<div class="navigation-area">
    <div class="month-row">
        <div class="month-selector" id="monthSelector"></div>
        <div class="admin-controls">
            <span style="font-size:0.55rem; font-weight:900; color:#888;">NORMA H:</span>
            <input type="number" id="hourNormInput" class="norm-input" value="160" onchange="saveNorm(this.value)">
            <button class="btn-settings" onclick="toggleModal(true)">⚙️ USTAWIENIA</button>
            <button class="btn-gen" onclick="startGeneration()" id="genBtn">🚀 GENERUJ</button>
            <button class="btn-settings" id="approveBtn" style="background:#0a0; color:#fff; border-color:#0a0;" onclick="toggleApprove()">✅ ZATWIERDŹ PLAN</button>
        </div>
    </div>
</div>

<div class="table-container">
    <table id="planTable">
        <thead><tr id="workerRow"></tr></thead>
        <tbody id="daysBody"></tbody>
        <tfoot>
            <tr id="sumRow"></tr>
            <tr id="satCountRow"></tr>
        </tfoot>
    </table>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <h3 style="color:#ffe800; margin-bottom:10px; font-size:1rem;">USTAWIENIA SKLEPU</h3>
        <label style="font-size:0.6rem; color:#888;">DOSTĘPNE ZMIANY (NP. 10-18, 12-20, 10-20):</label>
        <input id="globalShifts" style="width:100%; background:#000; border:1px solid #ffe800; color:#fff; padding:8px; margin-bottom:15px;" value="10-18, 12-20, 10-20">
        
        <div class="worker-grid" id="workerGrid"></div>
        <button class="btn-gen" style="width:100%; margin-top:20px; height:45px;" onclick="saveSettings()">ZAPISZ I ZAMKNIJ</button>
    </div>
</div>

<script>
const employees = [
    {n: "PAWEŁ", i: "P", p: false}, {n: "MICHAŁ", i: "M", p: false}, {n: "NATALIA", i: "N", p: true}, 
    {n: "MAGDA", i: "M", p: true}, {n: "JAKUB", i: "J", p: false}, {n: "ADRIAN", i: "A", p: false}, 
    {n: "DAWID", i: "D", p: false}, {n: "DAREK", i: "D", p: false}, {n: "ŁUKASZ", i: "Ł", p: false}, 
    {n: "ILONA", i: "I", p: false}, {n: "ARIEL", i: "A", p: false}
];
const months = ["STYCZEŃ", "LUTY", "MARZEC", "KWIECIEŃ", "MAJ", "CZERWIEC", "LIPIEC", "SIERPIEŃ", "WRZESIEŃ", "PAŹDZIERNIK", "LISTOPAD", "GRUDZIEŃ"];
let curM = 1; // 1 = Luty
const year = 2026;

const holidays2026 = ["1-1", "1-6", "4-5", "4-6", "5-1", "5-3", "5-24", "6-4", "8-15", "11-1", "11-11", "12-25", "12-26"];
const tradingSundays2026 = ["1-25", "3-29", "4-26", "6-28", "8-30", "12-13", "12-20"]; 

function isWorkDay(d) {
    let date = new Date(year, curM, d);
    let ds = `${curM+1}-${d}`;
    if (holidays2026.includes(ds)) return false;
    if (date.getDay() === 0 && !tradingSundays2026.includes(ds)) return false;
    return true;
}

function getV(n, d) { return localStorage.getItem(`pl_${year}_${curM}_${n}_${d}`) || ""; }
function saveV(n, d, v) { localStorage.setItem(`pl_${year}_${curM}_${n}_${d}`, v.toUpperCase()); }

function saveNorm(v) { localStorage.setItem(`norm_${year}_${curM}`, v); render(); }
function loadNorm() {
    let v = localStorage.getItem(`norm_${year}_${curM}`);
    document.getElementById('hourNormInput').value = v ? v : 160;
}

function toggleApprove() {
    let locked = localStorage.getItem(`locked_${year}_${curM}`) === 'true';
    localStorage.setItem(`locked_${year}_${curM}`, !locked);
    render();
}

function calcRealH(name) {
    let h = 0;
    for(let d=1; d<=31; d++) {
        let v = getV(name, d);
        if(v.includes('-')) {
            let p = v.split('-');
            h += (parseInt(p[1]) || 0) - (parseInt(p[0]) || 0);
        }
    }
    return h;
}

function getStreak(name, day) {
    let s = 0;
    for (let d = day-1; d >= 1; d--) {
        let v = getV(name, d);
        if(v.includes('-') || v==="URLOP" || v.toLowerCase()==="szk.") s++; else break;
    }
    for (let d = day+1; d <= 31; d++) {
        let v = getV(name, d);
        if(v.includes('-') || v==="URLOP" || v.toLowerCase()==="szk.") s++; else break;
    }
    return s;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startGeneration() {
    if(localStorage.getItem(`locked_${year}_${curM}`) === 'true') return; // Zablokowane

    const baseNorm = parseInt(document.getElementById('hourNormInput').value);
    const shifts = document.getElementById('globalShifts').value.split(',').map(s => s.trim());
    const openShift = shifts[0] || "10-18";
    const closeShift = shifts.length > 1 ? shifts[1] : "12-20";
    const fullShift = shifts.length > 2 ? shifts[2] : "10-20";
    const satShift = "10-20"; // Sztywna zmiana 10 godzinna w sobotę
    const days = new Date(year, curM + 1, 0).getDate();

    // 1. Czyszczenie (Zniknęło wpisywanie WOLNE, po prostu zostaje pusto)
    employees.forEach(e => { 
        for(let d=1; d<=days; d++) { 
            let v=getV(e.n, d); 
            if(v.includes('-') || v==="WOLNE") saveV(e.n, d, ""); 
        }
    });

    // 2. Soboty (Sztywno 10-20, brak słowa WOLNE)
    let sats = [];
    for(let d=1; d<=days; d++) {
        if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) sats.push(d);
    }

    sats.forEach(d => {
        let available = employees.filter(e => getV(e.n, d) === "");
        shuffle(available);

        available.sort((a,b) => {
            let aOff = 0, bOff = 0;
            sats.forEach(s => { let v = getV(a.n, s); if(v===""||v==="Ż"||v==="URLOP") aOff++; });
            sats.forEach(s => { let v = getV(b.n, s); if(v===""||v==="Ż"||v==="URLOP") bOff++; });
            return bOff - aOff; 
        });

        let toWork = [];
        
        let pokIndex = available.findIndex(e => e.p);
        if(pokIndex !== -1) {
            toWork.push({ e: available[pokIndex], shift: satShift });
            available.splice(pokIndex, 1);
        }

        let zamNeeded = pokIndex !== -1 ? 2 : 3;
        for(let i=0; i<zamNeeded && available.length > 0; i++) {
            toWork.push({ e: available[0], shift: satShift });
            available.splice(0, 1);
        }

        let otwNeeded = 3;
        for(let i=0; i<otwNeeded && available.length > 0; i++) {
            toWork.push({ e: available[0], shift: satShift });
            available.splice(0, 1);
        }

        toWork.forEach(w => saveV(w.e.n, d, w.shift));
        // UWAGA: Reszta "available" po prostu zostaje pusta, nie wpisujemy im "WOLNE"
    });

    // 3. Budowanie szkieletu na dni robocze
    for(let d=1; d<=days; d++) {
        if(new Date(year, curM, d).getDay() === 6) continue;
        if(!isWorkDay(d)) continue;
        
        let available = employees.filter(e => getV(e.n, d) === "" && getStreak(e.n, d) < 5);
        shuffle(available);
        available.sort((a,b) => calcRealH(a.n) - calcRealH(b.n));
        
        let pok = available.find(e => e.p);
        if(pok) { saveV(pok.n, d, closeShift); available = available.filter(e => e.n !== pok.n); }

        let zamNeeded = pok ? 2 : 3;
        for(let i=0; i<available.length && zamNeeded>0; i++) {
            saveV(available[i].n, d, closeShift);
            available.splice(i, 1); i--; zamNeeded--;
        }

        let otwNeeded = 3;
        for(let i=0; i<available.length && otwNeeded>0; i++) {
            saveV(available[i].n, d, openShift);
            available.splice(i, 1); i--; otwNeeded--;
        }
    }

    // 4. Bilansowanie Normy
    let allBalanced = false;
    let iterations = 0;

    while(!allBalanced && iterations < 3000) {
        allBalanced = true;
        
        let status = employees.map(e => {
            let urlops = 0;
            for(let d=1; d<=days; d++) {
                let v = getV(e.n, d);
                if(v === "URLOP" || v.toLowerCase() === "szk.") urlops++;
            }
            let target = baseNorm - (urlops * 8);
            let current = calcRealH(e.n);
            return { e, target, current, diff: target - current };
        });

        shuffle(status);
        status.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));

        for(let st of status) {
            if(st.diff === 0) continue;
            allBalanced = false;
            let emp = st.e;
            
            if(st.diff > 0) { 
                let added = false;
                if(st.diff >= 8) {
                    let possibleDays = [];
                    for(let d=1; d<=days; d++) {
                        let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
                        if(isWorkDay(d) && !isWknd && getV(emp.n, d) === "" && getStreak(emp.n, d) < 5) {
                            let c = 0; employees.forEach(em => { if(getV(em.n, d).includes('-')) c++; });
                            possibleDays.push({ d, staff: c });
                        }
                    }
                    if(possibleDays.length > 0) {
                        shuffle(possibleDays);
                        possibleDays.sort((a,b) => a.staff - b.staff); 
                        saveV(emp.n, possibleDays[0].d, (Math.random()>0.5 ? openShift : closeShift));
                        added = true;
                    }
                }
                
                if(!added && st.diff >= 2) { 
                    let possibleDays = [];
                    for(let d=1; d<=days; d++) {
                        let v = getV(emp.n, d);
                        if((v === openShift || v === closeShift) && getStreak(emp.n, d) < 5) possibleDays.push(d);
                    }
                    if(possibleDays.length > 0) {
                        shuffle(possibleDays);
                        saveV(emp.n, possibleDays[0], fullShift);
                    }
                }
                break; 
                
            } else if (st.diff < 0) { 
                let removed = false;
                if(st.diff <= -8) {
                    let possibleDays = [];
                    for(let d=1; d<=days; d++) {
                        let v = getV(emp.n, d);
                        let isWknd = new Date(year, curM, d).getDay() === 0 || new Date(year, curM, d).getDay() === 6;
                        
                        if(!isWknd && (v === openShift || v === closeShift || v === fullShift)) {
                            let otw = 0, zam = 0, pok = 0;
                            employees.forEach(em => {
                                if(em.n === emp.n) return;
                                let ev = getV(em.n, d);
                                if(ev.includes('-')) {
                                    let p = ev.split('-');
                                    if(parseInt(p[0]) <= 10) otw++;
                                    if(parseInt(p[1]) >= 20) { zam++; if(em.p) pok++; }
                                }
                            });
                            
                            let isOtw = parseInt(v.split('-')[0]) <= 10;
                            let isZam = parseInt(v.split('-')[1]) >= 20;
                            let isSafe = true;
                            
                            if(isOtw && otw < 3) isSafe = false;
                            if(isZam && zam < 3) isSafe = false; 
                            if(isZam && emp.p && pok < 1) isSafe = false;

                            if(isSafe) {
                                let c = otw + zam;
                                possibleDays.push({ d, staff: c });
                            }
                        }
                    }
                    if(possibleDays.length > 0) {
                        shuffle(possibleDays);
                        possibleDays.sort((a,b) => b.staff - a.staff);
                        saveV(emp.n, possibleDays[0].d, "");
                        removed = true;
                    }
                }
                
                if(!removed && st.diff <= -2) { 
                    let possibleDays = [];
                    for(let d=1; d<=days; d++) {
                        let v = getV(emp.n, d);
                        if(v === fullShift) possibleDays.push(d);
                    }
                    if(possibleDays.length > 0) {
                        shuffle(possibleDays);
                        saveV(emp.n, possibleDays[0], (Math.random()>0.5 ? openShift : closeShift));
                    }
                }
                break;
            }
        }
        iterations++;
    }

    render();
}

function render() {
    const days = new Date(year, curM + 1, 0).getDate();
    const body = document.getElementById('daysBody');
    const head = document.getElementById('workerRow');
    const baseNorm = parseInt(document.getElementById('hourNormInput').value);
    
    // Sprawdzenie blokady planu
    const isLocked = localStorage.getItem(`locked_${year}_${curM}`) === 'true';
    const genBtn = document.getElementById('genBtn');
    const appBtn = document.getElementById('approveBtn');
    
    genBtn.disabled = isLocked;
    genBtn.style.opacity = isLocked ? '0.3' : '1';
    genBtn.style.cursor = isLocked ? 'not-allowed' : 'pointer';
    
    appBtn.innerText = isLocked ? '🔓 ODBLOKUJ PLAN' : '✅ ZATWIERDŹ PLAN';
    appBtn.style.background = isLocked ? '#a00' : '#0a0';
    appBtn.style.borderColor = isLocked ? '#a00' : '#0a0';

    head.innerHTML = '<th class="date-col">DATA</th>';
    employees.forEach(e => head.innerHTML += `<th><div class="avatar">${e.i}</div><div class="worker-name">${e.n}</div></th>`);
    head.innerHTML += '<th class="obsada-col">OTW|ZAM|SUMA</th>';

    body.innerHTML = "";
    for(let d=1; d<=days; d++) {
        let date = new Date(year, curM, d);
        let tr = document.createElement('tr');
        if(!isWorkDay(d)) tr.className = 'sun';
        else if(date.getDay() === 6) tr.className = 'sat';
        
        let html = `<td class="date-col">${d} ${['ND','PN','WT','ŚR','CZ','PT','SB'][date.getDay()]}</td>`;
        let o=0, z=0, suma=0;
        
        employees.forEach(e => {
            let v = getV(e.n, d);
            let cellClass = (v === "Ż") ? 'class="wish-cell"' : '';
            if(v.includes('-')) {
                suma++;
                let p = v.split('-');
                if(parseInt(p[0]) <= 10) o++;
                if(parseInt(p[1]) >= 20) z++;
            }
            let disabledAttr = isLocked ? 'disabled' : '';
            html += `<td ${cellClass}><input value="${v}" ${disabledAttr} onchange="saveV('${e.n}',${d},this.value);render()"></td>`;
        });
        html += `<td class="obsada-col">${o} | ${z} | ${suma}</td>`;
        tr.innerHTML = html; body.appendChild(tr);
    }

    const fSum = document.getElementById('sumRow');
    fSum.innerHTML = '<td class="date-col">GODZINY</td>';
    employees.forEach(e => {
        let urlops = 0;
        for(let d=1; d<=days; d++) {
            let v = getV(e.n, d);
            if(v === "URLOP" || v.toLowerCase() === "szk.") urlops++;
        }
        let target = baseNorm - (urlops * 8); 
        let h = calcRealH(e.n); 
        
        fSum.innerHTML += `<td style="color:${h==target?'#0f0':'#f44'}; font-size: 0.55rem;">${h} / ${target}</td>`;
    });

    const fSat = document.getElementById('satCountRow');
    fSat.innerHTML = '<td class="date-col">WOLNE SB</td>';
    employees.forEach(e => {
        let count = 0;
        for(let d=1; d<=days; d++) {
            // Zlicza puste pola ("") i inne oznaki wolnego
            if(new Date(year, curM, d).getDay() === 6 && isWorkDay(d)) {
                let v = getV(e.n, d);
                if(v === "" || v === "URLOP" || v === "Ż") count++;
            }
        }
        fSat.innerHTML += `<td style="color:${count>=1 && count<=2 ?'#ffe800':'#f44'}">${count}</td>`;
    });
}

function renderSettings() {
    const grid = document.getElementById('workerGrid'); grid.innerHTML = "";
    employees.forEach(e => {
        grid.innerHTML += `<div class="worker-card">
            <div style="color:#ffe800; font-weight:900; font-size:0.7rem;">${e.n}</div>
            <label>ŻYCZENIA (Dni np. 5,12):</label><input id="z_${e.n}">
            <label>URLOP (Od-Do np. 1-7):</label>
            <div style="display:flex; gap:2px"><input id="u1_${e.n}" placeholder="Od"><input id="u2_${e.n}" placeholder="Do"></div>
        </div>`;
    });
}

function saveSettings() {
    employees.forEach(e => {
        let z = document.getElementById(`z_${e.n}`)?.value;
        if(z) z.split(',').forEach(d => saveV(e.n, d.trim(), "Ż"));
        let u1 = document.getElementById(`u1_${e.n}`)?.value;
        let u2 = document.getElementById(`u2_${e.n}`)?.value;
        if(u1 && u2) for(let d=parseInt(u1); d<=parseInt(u2); d++) {
            if(isWorkDay(d)) saveV(e.n, d, "URLOP");
        }
    });
    toggleModal(false); render();
}

function setMonth(i) {
    curM = i;
    loadNorm();
    renderMonths();
    render();
}

function renderMonths() {
    const div = document.getElementById('monthSelector'); div.innerHTML = "";
    months.forEach((m, i) => {
        const b = document.createElement('button');
        b.className = `month-btn ${i === curM ? 'active' : ''}`;
        b.innerText = m;
        b.onclick = () => setMonth(i);
        div.appendChild(b);
    });
}

function toggleNav() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
function toggleModal(s) { document.getElementById('settingsModal').style.display = s ? 'flex' : 'none'; if(s) renderSettings(); }

window.onload = () => { setMonth(curM); };
</script>
</body>
</html>
