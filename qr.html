<section id="qr-generator" class="content-section">
    <div class="qr-container">
        <h2 class="qr-title">GENERATOR KODU <span>QR</span></h2>
        
        <div class="json-box">
            <span class="bracket">{</span>
            <span class="key">"type"</span>: <span class="val">"npws_qr"</span>,
            <span class="key">"order"</span>: "<input type="tel" id="ord_input" class="qr-input" placeholder="numer">",
            <span class="key">"pin"</span>: "<input type="tel" id="pin_input" class="qr-input" placeholder="pin">"
            <span class="bracket">}</span>
        </div>

        <button class="copy-btn" onclick="copyQR()">KOPIUJ CAŁOŚĆ</button>
        <div id="copy-status" class="status-msg"></div>

        <div class="history-box">
            <h3>HISTORIA KOPIOWANIA:</h3>
            <ul id="qr-history"></ul>
        </div>
    </div>
</section>
