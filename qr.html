<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Generator QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="qr.css">
</head>
<body>
    <header>
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <div class="logo">MEDIA <span>EXPERT</span></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">NAWIGACJA</div>
        <a href="index.html" class="sidebar-link">🏠 STRONA GŁÓWNA</a>
        <a href="plan.html" class="sidebar-link">📅 PLAN PRACY</a>
        <a href="qr.html" class="sidebar-link">🖼️ KOD QR</a>
    </nav>

    <main>
        <div class="qr-card">
            <h1 class="qr-title">GENERATOR KODU <span>QR</span></h1>
            
            <div class="json-box">
                <span class="json-syntax">{ "type" : "npws_order_received_qr_code" , "order_number" : "</span>
                <input type="number" id="orderNum" class="qr-input" placeholder="123456" oninput="updatePreview()"> 
                <span class="json-syntax">" , "pin" : "</span>
                <input type="number" id="pinNum" class="qr-input pin" placeholder="123" oninput="updatePreview()"> 
                <span class="json-syntax">" }</span>
            </div>

            <button id="copyBtn" class="copy-action-btn" onclick="copyCode()">KOPIUJ KOD</button>
        </div>

        <div class="history-wrapper">
            <h2 class="history-title">OSTATNIO WYGENEROWANE</h2>
            <div class="history-header">
                <span class="col-main">PEŁNY KOD JSON</span>
                <span class="col-time">GODZINA</span>
                <span class="col-action">AKCJA</span>
            </div>
            <div id="historyList" class="history-items">
                </div>
        </div>
    </main>

    <script src="qr.js"></script>
</body>
</html>
