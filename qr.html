<!DOCTYPE html>
<html lang="pl">
<head>

    <link rel="stylesheet" href="main.css">

<body>
    <header>

                <div class="qr-footer">
                    <p>Zeskanuj kod przy wejściu do strefy</p>
                    <button class="print-btn" onclick="window.print()">WYDRUKUJ KOD</button>
