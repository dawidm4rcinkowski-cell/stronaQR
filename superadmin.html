<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Tool - SUPERADMIN</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f44'/><text x='50%' y='53%' font-family='Arial, sans-serif' font-size='45' font-weight='900' fill='%23fff' text-anchor='middle' dominant-baseline='middle'>GOD</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0N6Bjyzs34piOoujEn9mxKir8LDGdD2k",
            authDomain: "expert-tool.firebaseapp.com",
            databaseURL: "https://expert-tool-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "expert-tool",
            storageBucket: "expert-tool.firebasestorage.app",
            messagingSenderId: "880843997228",
            appId: "1:880843997228:web:fa37aa80b7f9f017705189"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: #111; } ::-webkit-scrollbar-thumb { background: #f44; border-radius: 2px; }

        header { background: #050505; height: 60px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #f44; box-shadow: 0 0 20px rgba(255, 68, 68, 0.3); }
        .logo { color: #fff; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .logo span { background: #f44; color: #000; padding: 0 8px; border-radius: 3px; }

        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 20px; }
        .login-box { background: #111; border: 2px solid #333; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
        .login-box h2 { color: #f44; margin-bottom: 20px; font-size: 1.5rem; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 0.75rem; color: #888; font-weight: bold; margin-bottom: 5px; display: block; }
        .form-input { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; font-size: 1rem; font-weight: bold; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: #f44; box-shadow: 0 0 10px rgba(255, 68, 68, 0.3); }
        .btn-action { width: 100%; background: #f44; color: #000; border: none; padding: 15px; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; font-size: 1rem; }
        .btn-action:hover { background: #ff6666; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4); }

        #adminDashboard { display: none; padding: 30px 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .btn-logout { background: transparent; border: 1px solid #666; color: #888; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { color: #fff; border-color: #fff; }

        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; align-items: start; }
        @media(max-width: 800px) { .admin-grid { grid-template-columns: 1fr; } }
        
        .panel-card { background: #111; border: 1px solid #333; padding: 25px; border-radius: 12px; }
        .panel-title { color: #f44; font-weight: 900; font-size: 1.2rem; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        
        .token-display { background: #000; border: 2px dashed #f44; color: #f44; font-size: 2.5rem; font-weight: 900; text-align: center; padding: 20px; border-radius: 10px; letter-spacing: 5px; margin: 20px 0; display: none; }

        .stores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .store-card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s; position: relative; overflow: hidden; }
        .store-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #f44; }
        .store-card:hover { border-color: #f44; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .store-title { font-size: 1.5rem; font-weight: 900; color: #fff; }
        .store-city { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .btn-ghost { width: 100%; background: transparent; border: 1px solid #ffe800; color: #ffe800; padding: 10px; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: auto; font-size: 0.75rem;}
        .btn-ghost:hover { background: #ffe800; color: #000; }
        .btn-delete { background: transparent; border: none; color: #555; font-size: 0.7rem; font-weight: bold; cursor: pointer; text-align: right; margin-top: 5px; transition: 0.2s; }
        .btn-delete:hover { color: #f44; text-decoration: underline; }

        .msg-box { padding: 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; text-align: center; display: none; margin-bottom: 15px; }
        .msg-success { background: rgba(0, 170, 0, 0.2); border: 1px solid #0a0; color: #0a0; display: block; }
    </style>
</head>
<body>

<header>
    <div class="logo">SUPER <span>ADMIN</span></div>
</header>

<div class="login-container" id="loginScreen">
    <div class="login-box">
        <h2>AUTORYZACJA</h2>
        <div class="input-group">
            <label>ID Autoryzacyjne</label>
            <input type="text" class="form-input" id="adminLogin" placeholder="Wpisz ID" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Hasło Główne</label>
            <input type="password" class="form-input" id="adminPass" placeholder="Wpisz hasło" autocomplete="off">
        </div>
        <div id="loginMsg" class="msg-box" style="border-color:#f44; color:#f44;">Błędne dane!</div>
        <button class="btn-action" onclick="verifyAdmin()">WEJDŹ DO SYSTEMU</button>
    </div>
</div>

<div id="adminDashboard">
    <div class="dashboard-header">
        <div>
            <h1 style="font-size: 2rem; font-weight: 900; text-transform: uppercase;">Centrum <span style="color:#f44;">Dowodzenia</span></h1>
        </div>
        <button class="btn-logout" onclick="logoutAdmin()">WYLOGUJ</button>
    </div>
    
    <div class="admin-grid">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="panel-card">
                <div class="panel-title">Generator Dostępów</div>
                <p style="font-size:0.75rem; color:#888; margin-bottom:15px; line-height:1.4;">Wygeneruj jednorazowy kod (OTP) dla nowego Kierownika Sklepu. Kod wygasa po jednym użyciu.</p>
                <button class="btn-action" onclick="generateToken()">GENERUJ KOD OTP</button>
                <div class="token-display" id="tokenDisplay">------</div>
            </div>

            <div class="panel-card">
                <div class="panel-title">Komunikaty Globalne</div>
                <div class="input-group">
                    <label>Ogłoszenie na stronie głównej (wszystkie sklepy)</label>
                    <textarea class="form-input" id="globalMsg" rows="3" placeholder="Wpisz ważny komunikat dla całej sieci..."></textarea>
                </div>
                <div class="input-group">
                    <label>Globalna Norma Godzinowa (dla generatora grafików)</label>
                    <input type="number" class="form-input" id="globalNorm" placeholder="np. 160">
                </div>
                <div id="settingsMsg" class="msg-box msg-success" style="display:none;">Zapisano!</div>
                <button class="btn-action" style="background:#0a0; color:#fff;" onclick="saveGlobalSettings()">ZAPISZ USTAWIENIA</button>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-title">Aktywne Sklepy w Chmurze</div>
            <div class="stores-grid" id="storesGrid">
                <div style="color: #666; font-size:0.9rem; font-weight:bold; width:100%; text-align:center; padding:40px;">Pobieranie infrastruktury...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const adminID = "782058521";
    const adminPW = "dawid2902";

    if(sessionStorage.getItem('superAdminLogged') === 'true') { showDashboard(); }

    function verifyAdmin() {
        const l = document.getElementById('adminLogin').value.trim();
        const p = document.getElementById('adminPass').value.trim();
        if(l === adminID && p === adminPW) {
            sessionStorage.setItem('superAdminLogged', 'true');
            document.getElementById('loginMsg').style.display = 'none';
            showDashboard();
        } else {
            document.getElementById('loginMsg').style.display = 'block';
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem('superAdminLogged');
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
    }

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        
        // Pobierz globalne ustawienia
        db.ref('Admin/Settings').on('value', snap => {
            const data = snap.val() || {};
            if(data.announcement) document.getElementById('globalMsg').value = data.announcement;
            if(data.globalNorm) document.getElementById('globalNorm').value = data.globalNorm;
        });

        loadAllStores();
    }

    // GENERATOR TOKENÓW
    function generateToken() {
        const token = Math.floor(100000 + Math.random() * 900000).toString(); // 6 cyfr
        db.ref(`Admin/Tokens/${token}`).set({
            valid: true,
            createdAt: Date.now()
        }).then(() => {
            const display = document.getElementById('tokenDisplay');
            display.innerText = token;
            display.style.display = 'block';
        });
    }

    // ZAPIS USTAWIEŃ GLOBALNYCH
    function saveGlobalSettings() {
        const msg = document.getElementById('globalMsg').value.trim();
        const norm = parseInt(document.getElementById('globalNorm').value) || 160;
        
        db.ref('Admin/Settings').update({
            announcement: msg,
            globalNorm: norm
        }).then(() => {
            const box = document.getElementById('settingsMsg');
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        });
    }

    function loadAllStores() {
        db.ref('Stores').on('value', snap => {
            const stores = snap.val() || {};
            const grid = document.getElementById('storesGrid');
            grid.innerHTML = '';
            const storeKeys = Object.keys(stores);
            
            if(storeKeys.length === 0) {
                grid.innerHTML = '<div style="color: #666; font-size:0.9rem; font-weight:bold; width:100%; text-align:center; padding:40px;">Brak sklepów w bazie.</div>';
                return;
            }

            storeKeys.forEach(sNum => {
                const storeData = stores[sNum];
                const setup = storeData.Setup || { city: 'Nieznane' };
                const users = storeData.Users || {};
                const userCount = Object.keys(users).filter(k => k !== 'ADMIN').length;

                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <div>
                        <div class="store-title">${sNum}</div>
                        <div class="store-city">${setup.city} (Załoga: ${userCount})</div>
                    </div>
                    <button class="btn-ghost" onclick="possessStore('${sNum}')">👁️ ZALOGUJ JAKO DUCH</button>
                    <button class="btn-delete" onclick="deleteStore('${sNum}')">Zniszcz bazę</button>
                `;
                grid.appendChild(card);
            });
        });
    }

    function possessStore(storeId) {
        localStorage.setItem('myStore', storeId);
        localStorage.setItem('currentUser', JSON.stringify({ charId: "SUPERADMIN", name: "Dawid (Twórca)", dept: "ME", isKss: true, isGhost: true, avatar: "" }));
        window.location.href = 'index.html';
    }

    function deleteStore(storeId) {
        const confirmCode = prompt(`Zniszczyć całkowicie sklep ${storeId}? Przepisz numer sklepu aby potwierdzić:`);
        if(confirmCode === storeId) {
            db.ref(`Stores/${storeId}`).remove();
        }
    }
</script>
</body>
</html>
