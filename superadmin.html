<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Expert - Panel Superadmina</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    
    <script>
        // Tutaj zabezpieczenie superadmina - powinieneś mieć tu swój mechanizm
        // Na ten moment zakładamy, że tylko superadmin zna link lub jest zalogowany.

        const firebaseConfig = {
            apiKey: "AIzaSyD0N6Bjyzs34piOoujEn9mxKir8LDGdD2k",
            authDomain: "expert-tool.firebaseapp.com",
            databaseURL: "https://expert-tool-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "expert-tool",
            storageBucket: "expert-tool.firebasestorage.app",
            messagingSenderId: "880843997228",
            appId: "1:880843997228:web:fa37aa80b7f9f017705189"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080808; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 12px; height: 12px; } 
        ::-webkit-scrollbar-track { background: #111; border-left: 1px solid #222; border-top: 1px solid #222; } 
        ::-webkit-scrollbar-thumb { background: #ffe800; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #e6d100; }
        
        header { background: #ffe800; height: 60px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-bottom: 2px solid #000; box-shadow: 0 2px 15px rgba(255, 232, 0, 0.2); }
        .logo { color: #000; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;}
        .logo span { background: #000; color: #ffe800; padding: 0 8px; border-radius: 4px; }
        
        .content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .content-inner { max-width: 1000px; margin: 0 auto; }
        .page-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
        .page-title span { color: #ffe800; }
        .page-subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 40px; font-weight: bold; }

        .btn-main { background: #ffe800; color: #000; border: none; padding: 12px 25px; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.3s; display: block; margin: 0 auto 30px; font-size: 1rem; box-shadow: 0 5px 15px rgba(255, 232, 0, 0.2);}
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 232, 0, 0.4); }

        /* LISTA SKLEPÓW */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .store-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 25px; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .store-card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: #ffe800; }
        .store-card:hover { border-color: #ffe800; background: #151515; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .store-number { font-size: 1.8rem; font-weight: 900; color: #ffe800; margin-bottom: 5px; line-height: 1; }
        .store-city { font-size: 1.1rem; color: #fff; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; }
        .store-id-label { font-size: 0.65rem; color: #666; font-weight: bold; }
        
        .btn-edit { width: 100%; background: transparent; border: 2px solid #555; color: #aaa; padding: 10px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 0.8rem; }
        .btn-edit:hover { border-color: #ffe800; color: #ffe800; background: rgba(255, 232, 0, 0.05); }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #0a0a0a; border: 2px solid #ffe800; padding: 30px; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 232, 0, 0.2); }
        
        .modal h2 { color: #ffe800; font-size: 1.5rem; font-weight: 900; text-align: center; margin-bottom: 25px; text-transform: uppercase; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.75rem; color: #888; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; }
        .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #ffe800; background: #000; }
        .input-group input[readonly] { background: #1a1a1a; color: #666; cursor: not-allowed; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 30px; }
        .btn-cancel { flex: 1; background: #222; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-cancel:hover { background: #444; }
        .btn-save { flex: 2; background: #ffe800; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-save:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(255, 232, 0, 0.3); }
        
        .msg-box { padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; text-align: center; display: none; margin-top: 15px; }
        .msg-error { background: rgba(255, 68, 68, 0.1); border: 1px solid #f44; color: #f44; }
        .msg-success { background: rgba(0, 170, 0, 0.1); border: 1px solid #0a0; color: #0a0; }
        
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; display: flex; align-items: center; justify-content: center; color: #ffe800; font-weight: bold; font-size: 1.5rem; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">SUPER <span>ADMIN</span></div>
</header>

<div class="loading-overlay" id="loadingData">Pobieranie sklepów...</div>

<div class="content">
    <div class="content-inner">
        <h1 class="page-title">ZARZĄDZANIE <span>SKLEPAMI</span></h1>
        <p class="page-subtitle">Zarządzaj ustawieniami poszczególnych placówek w systemie</p>
        
        <button class="btn-main" onclick="openStoreModal(null)">+ DODAJ NOWY SKLEP</button>
        
        <div class="store-grid" id="storesContainer">
            </div>
    </div>
</div>

<div class="modal" id="storeModal">
    <div class="modal-content">
        <h2 id="modalTitle">EDYTUJ SKLEP</h2>
        
        <input type="hidden" id="storeKey">
        
        <div class="input-group">
            <label>Klucz bazy danych (ID Sklepu)</label>
            <input type="text" id="storeIdInput" placeholder="np. BydgoszczFordonska">
            <div style="font-size: 0.6rem; color: #666; margin-top: 5px;">Tego używają pracownicy do logowania (Pole "Sklep"). Po utworzeniu nie można go zmienić.</div>
        </div>
        
        <div class="input-group">
            <label>Numer Sklepu (SXXX)</label>
            <input type="text" id="storeNumberInput" placeholder="np. S123">
        </div>
        
        <div class="input-group">
            <label>Miejscowość / Nazwa Sklepu</label>
            <input type="text" id="storeCityInput" placeholder="np. Bydgoszcz">
        </div>
        
        <div id="modalMsg" class="msg-box"></div>
        
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeStoreModal()">ANULUJ</button>
            <button class="btn-save" onclick="saveStoreData()">ZAPISZ DANE</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // LOGIKA POBIERANIA I WYŚWIETLANIA SKLEPÓW
    // ==========================================
    const storesContainer = document.getElementById('storesContainer');
    const loadingOverlay = document.getElementById('loadingData');
    
    let allStoresData = {};

    loadingOverlay.style.display = 'flex';

    // Nasłuchiwanie zmian w węźle Stores
    db.ref('Stores').on('value', snap => {
        allStoresData = snap.val() || {};
        renderStores();
        loadingOverlay.style.display = 'none';
    });

    function renderStores() {
        storesContainer.innerHTML = '';
        const storeKeys = Object.keys(allStoresData);
        
        if (storeKeys.length === 0) {
            storesContainer.innerHTML = '<div style="color:#888; text-align:center; width:100%; grid-column: 1 / -1; font-weight:bold;">Brak sklepów w bazie. Dodaj pierwszy sklep!</div>';
            return;
        }

        storeKeys.forEach(key => {
            const store = allStoresData[key];
            const setup = store.Setup || {};
            const sNum = setup.sNumber || "Brak numeru";
            const sCity = setup.city || "Brak nazwy";
            
            const card = document.createElement('div');
            card.className = 'store-card';
            card.innerHTML = `
                <div>
                    <div class="store-number">${sNum}</div>
                    <div class="store-city">${sCity}</div>
                    <div class="store-id-label">Klucz bazy: ${key}</div>
                </div>
                <button class="btn-edit" onclick="openStoreModal('${key}')" style="margin-top: 20px;">⚙️ EDYTUJ DANE</button>
            `;
            storesContainer.appendChild(card);
        });
    }

    // ==========================================
    // LOGIKA MODALA (DODAWANIE I EDYCJA)
    // ==========================================
    function openStoreModal(storeKey) {
        const msgBox = document.getElementById('modalMsg');
        msgBox.style.display = 'none';
        
        const idInput = document.getElementById('storeIdInput');
        const numInput = document.getElementById('storeNumberInput');
        const cityInput = document.getElementById('storeCityInput');
        
        if (storeKey) {
            // Tryb edycji istniejącego sklepu
            document.getElementById('modalTitle').innerText = "EDYTUJ SKLEP";
            document.getElementById('storeKey').value = storeKey;
            
            const setup = allStoresData[storeKey].Setup || {};
            
            idInput.value = storeKey;
            idInput.readOnly = true; // Nie pozwalamy zmieniać ID po utworzeniu, bo zepsuje relacje
            
            numInput.value = setup.sNumber || "";
            cityInput.value = setup.city || "";
        } else {
            // Tryb dodawania nowego
            document.getElementById('modalTitle').innerText = "NOWY SKLEP";
            document.getElementById('storeKey').value = "";
            
            idInput.value = "";
            idInput.readOnly = false;
            
            numInput.value = "";
            cityInput.value = "";
        }
        
        document.getElementById('storeModal').style.display = 'flex';
    }

    function closeStoreModal() {
        document.getElementById('storeModal').style.display = 'none';
    }

    function saveStoreData() {
        const currentKey = document.getElementById('storeKey').value;
        const inputKey = document.getElementById('storeIdInput').value.trim();
        const sNumber = document.getElementById('storeNumberInput').value.trim();
        const city = document.getElementById('storeCityInput').value.trim();
        
        const msgBox = document.getElementById('modalMsg');
        msgBox.style.display = 'block';
        msgBox.className = 'msg-box';
        
        if (!inputKey || !sNumber || !city) {
            msgBox.classList.add('msg-error');
            msgBox.innerText = "Wypełnij wszystkie 3 pola!";
            return;
        }

        // Zapis do Firebase
        const storePath = currentKey ? currentKey : inputKey; // Jeśli edytujemy, używamy starego klucza. Jeśli nowy, bierzemy z inputa.
        
        db.ref(`Stores/${storePath}/Setup`).update({
            sNumber: sNumber,
            city: city
        }).then(() => {
            msgBox.classList.add('msg-success');
            msgBox.innerText = "Zapisano pomyślnie!";
            setTimeout(() => {
                closeStoreModal();
            }, 1000);
        }).catch(err => {
            msgBox.classList.add('msg-error');
            msgBox.innerText = "Błąd zapisu: " + err.message;
        });
    }
</script>

</body>
</html>
